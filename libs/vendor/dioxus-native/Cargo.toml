[package]
name = "dioxus-native"
version = "0.8.0-alpha.0"
authors = ["Jonathan Kelley", "Nico Burns"]
edition = "2024"
description = "Native renderer for Dioxus based on blitz"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DioxusLabs/dioxus/"
homepage = "https://dioxuslabs.com/learn/0.7/getting_started"
keywords = ["dom", "ui", "gui", "react"]

[features]
default = ["accessibility", "hot-reload", "net", "html", "svg", "system-fonts", "clipboard", "file-dialog", "vello-hybrid", "incremental", "woff", "apple-font-embolden"]
prelude = ["dep:dioxus-core-macro", "dep:dioxus-hooks", "dep:dioxus-signals", "dep:dioxus-stores", "dep:manganis"]

# DOM features
svg = ["blitz-dom/svg", "blitz-paint/svg"]
floats = ["blitz-dom/floats"]
incremental = ["blitz-dom/incremental"]
autofocus = ["blitz-dom/autofocus"]
system-fonts = ["blitz-dom/system-fonts"]
# complex-scripts: enable dictionary-based line-breaking
complex-scripts = ["blitz-dom/complex-scripts"]
# WOFF/WOFF2 decoder. Default-on so wasm callers (which can't use system fonts)
# can bundle compressed fonts without extra setup.
woff = ["blitz-dom/woff"]

# Shell Features
clipboard = ["blitz-shell/clipboard"]
file-dialog = ["blitz-shell/file-dialog"]
accessibility = ["blitz-shell/accessibility", "blitz-dom/accessibility"]
data-uri = ["blitz-shell/data-uri"]

# Renderer features
vello = ["dep:anyrender_vello", "dep:wgpu_context"]
vello-hybrid = ["dep:anyrender_vello_hybrid", "dep:wgpu_context"]
skia = ["dep:anyrender_skia"]
vello-cpu = ["vello-cpu-pixels"]
vello-cpu-pixels = ["vello-cpu-base", "anyrender_vello_cpu/pixels_window_renderer"]
vello-cpu-softbuffer = ["vello-cpu-base", "anyrender_vello_cpu/softbuffer_window_renderer"]
vello-cpu-base = ["dep:anyrender_vello_cpu"]

font-embolden = ["blitz-paint/font-embolden"]
apple-font-embolden = ["blitz-paint/apple-font-embolden"]
scrollbars = ["blitz-paint/scrollbars"]

# Other features
# No-op on wasm32 (blitz_net::Provider needs tokio's threaded runtime); launch_cfg
# falls back to the in-process DioxusNativeNetProvider there.
net = ["dep:tokio", "dep:blitz-net"]
html = ["dep:blitz-html"]

# Dev
hot-reload = ["dep:dioxus-devtools"]

# Debug/Logging
log-times = ["log-phase-times", "log-frame-times"]
log-phase-times = ["blitz-dom/log-phase-times"]
log-frame-times = [
  "anyrender_vello_cpu?/log_frame_times",
  "anyrender_vello?/log_frame_times",
  "anyrender_vello_hybrid?/log_frame_times",
  "anyrender_skia?/log_frame_times",
]
tracing = ["dep:tracing", "dioxus-native-dom/tracing", "blitz-shell/tracing", "blitz-dom/tracing", "blitz-html/tracing", "blitz-net/tracing"]


[dependencies]
anyrender = { version = "0.11.0" }
anyrender_skia = { version = "0.9.0", optional = true }
anyrender_vello = { version = "0.12.0", optional = true }
anyrender_vello_cpu = { version = "0.14.0", optional = true }
anyrender_vello_hybrid = { version = "0.8.0", optional = true }
blitz-dom = { version = "=0.3.0-beta.1", default-features = false, features = ["custom-widget"] }
blitz-html = { version = "=0.3.0-beta.1", optional = true }
blitz-net = { version = "=0.3.0-beta.1", optional = true }
blitz-paint = { version = "=0.3.0-beta.1", features = ["custom-widget"], optional = true }
blitz-shell = { version = "=0.3.0-beta.1", default-features = false }
blitz-traits = { version = "=0.3.0-beta.1" }
cfg-if = { version = "1.0.4" }
dioxus-asset-resolver = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", version = "0.8.0-alpha.0", features = ["native"] }
dioxus-cli-config = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", version = "0.8.0-alpha.0" }
dioxus-core = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", version = "0.8.0-alpha.0" }
dioxus-core-macro = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", version = "0.8.0-alpha.0", optional = true }
dioxus-devtools = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", version = "0.8.0-alpha.0", optional = true }
dioxus-document = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", version = "0.8.0-alpha.0", default-features = false }
dioxus-history = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", version = "0.8.0-alpha.0", default-features = false }
dioxus-hooks = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", version = "0.8.0-alpha.0", optional = true }
dioxus-html = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", version = "0.8.0-alpha.0", default-features = false }
dioxus-native-dom = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", version = "0.8.0-alpha.0" }
dioxus-signals = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", version = "0.8.0-alpha.0", optional = true }
dioxus-stores = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", version = "0.8.0-alpha.0", optional = true }
futures-util = { version = "0.3.32", default-features = false }
keyboard-types = { version = "0.7", default-features = false }
manganis = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", version = "0.8.0-alpha.0", features = ["dioxus"], optional = true }
rustc-hash = { version = "2.1.1" }
slotmap = { version = "1.0.7", features = ["serde"] }
tokio = { version = "1.48", features = ["rt"], optional = true }
tracing = { version = "0.1.41", optional = true }
webbrowser = { version = "1.2.1" }
wgpu_context = { version = "0.7.0", optional = true }
winit = { version = "=0.31.0-beta.2" }

[target.'cfg(all(target_os = "ios", target_abi = "sim"))'.dependencies]
anyrender_vello_cpu = { version = "0.14.0", features = ["pixels_window_renderer"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.48", features = ["rt-multi-thread"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", default-features = false }
