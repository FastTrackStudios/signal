[package]
name = "dioxus-core"
version = "0.8.0-alpha.0"
authors = ["Jonathan Kelley"]
edition = "2024"
description = "Build fullstack web, desktop, and mobile apps with a single codebase."
license = "MIT OR Apache-2.0"
repository = "https://github.com/DioxusLabs/dioxus/"
homepage = "https://dioxuslabs.com"
keywords = ["web", "desktop", "mobile", "gui", "wasm"]
rust-version = "1.85.0"

[dependencies]
dioxus-core-types = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc" }
const_format = "0.2.34"
futures-channel = "0.3.32"
generational-box = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc" }
longest-increasing-subsequence = "0.1.0"
rustc-hash = "2.1.1"
rustversion = "1.0.21"
slab = "0.4.10"
slotmap = { version = "1.0.7", features = ["serde"] }
tracing = "0.1.41"
futures-util = { version = "0.3.32", default-features = false, features = ["alloc", "std"] }
serde = { version = "1.0.228", optional = true, features = ["derive"] }
subsecond = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc" }
anyhow = "1.0.98"
xxhash-rust = { version = "0.8.15", default-features = false, features = ["const_xxh64"] }

[features]
serialize = ["dep:serde"]
