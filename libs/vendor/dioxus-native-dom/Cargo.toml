[package]
name = "dioxus-native-dom"
version = "0.8.0-alpha.0"
authors = ["Jonathan Kelley", "Nico Burns"]
edition = "2024"
description = "Core headless native renderer for Dioxus based on blitz"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DioxusLabs/dioxus/"
homepage = "https://dioxuslabs.com/learn/0.7/getting_started"
keywords = ["dom", "ui", "gui", "react"]

[features]
# `incremental` is deliberately absent — it leaves dead node ids in
# `layout_children`, which `hit_inner` later unwraps. See the root
# Cargo.toml's note on `blitz-dom`.
default = ["accessibility", "svg", "system-fonts"]

# DOM features
svg = ["blitz-dom/svg"]
floats = ["blitz-dom/floats"]
incremental = ["blitz-dom/incremental"]
accessibility = ["blitz-dom/accessibility"]
tracing = ["dep:tracing", "blitz-dom/tracing"]
system-fonts = ["blitz-dom/system-fonts"]
# complex-scripts: enable dictionary-based line-breaking
complex-scripts = ["blitz-dom/complex-scripts"]
autofocus = ["blitz-dom/autofocus"]

[dependencies]
# Blitz dependencies
blitz-dom = { version = "=0.3.0-beta.1", default-features = false, features = ["custom-widget"] }
blitz-traits = "=0.3.0-beta.1"

# DioxusLabs dependencies
dioxus-core = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc" }
dioxus-html = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", default-features = false }

# Windowing & Input
keyboard-types = { version = "0.7", default-features = false }


# Other dependencies
tracing = { version = "0.1", optional = true }
rustc-hash = "2.1.1"
futures-util = { version = "0.3.32", default-features = false }

[dev-dependencies]
dioxus = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", default-features = false, features = ["lib"] }

[package.metadata.docs.rs]
all-features = true

