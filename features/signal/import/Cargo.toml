[package]
name = "signal-import"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
signal-proto.workspace = true
signal-controller.workspace = true
uuid.workspace = true
eyre.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
# For `AlgorithmType::t60_range` only — the translator has to know what
# reverberation times an engine can actually be asked for, so it does not
# route a 0.3 s preset to an engine whose floor is a second. Data, not DSP.
dsp = { workspace = true, features = ["reverb", "eq"] }
thiserror.workspace = true

[dev-dependencies]
# The translation is only worth anything if the engine on the other side acts
# on it, so `tests/proq4_dynamics.rs` drives real audio through `NativeEq`.
builtin = { workspace = true }
# The comparison tools that check a translated preset against the plugin it
# came from (examples/: eq_match, reverb_match, proq_params, and the
# eq_sweep / preset_sweep drivers): they host the commercial plugin (a
# VST3, hence `vst3-host`) and render ours beside it. They were builtin's
# examples until the engine left for the daw repo (studio#510).
signal-plugin-host = { workspace = true, features = ["vst3-host"] }
dsp = { workspace = true, features = ["analyzer"] }
hound = { workspace = true }
realfft = { workspace = true }
