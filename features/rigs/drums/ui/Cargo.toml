[package]
name = "signal-drums-ui"
version.workspace = true
edition = "2021"
license.workspace = true
authors.workspace = true

# Drum-rig Dioxus components — the feature-scoped, wasm-clean UI half of the
# detachable GUI. Renders purely from the wire contract (`signal-drums-proto`)
# via the generated vox clients; no audio backend, no platform I/O.

[dependencies]
dioxus.workspace = true
signal-drums-proto.workspace = true
# use_stream (atom+vox) + the portable sleep (tokio native / gloo wasm).
architect = { workspace = true, features = ["atom", "vox", "platform"] }
