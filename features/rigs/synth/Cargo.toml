[package]
name = "signal-synth"
version.workspace = true
edition = "2021"          # kept on 2021 — pre-move signal workspace edition; migrate deliberately
license.workspace = true
authors.workspace = true

[dependencies]
tracing.workspace = true
# The shared sampler engine expresses the Omnisphere routing tree + render
# nodes; synth is the Omnisphere definition + patch importer on top.
signal-sampler.workspace = true
# BlockType — the composition tree's block tagging schema.
signal-proto.workspace = true
# The pack builder serializes the loop/tag-enriched styx before packing.
facet-styx.workspace = true
# `gig`: PROCESSORSTATEZ payloads are zlib — the "Z" in the tag name.
flate2 = "1"

[dev-dependencies]
# `import_gig_songs` writes the gig's song library out as song folders. A
# dev-dep so the direction stays one-way: `song` is portable storage and must
# never learn about a rig.
song.workspace = true
uuid = { workspace = true, features = ["v4"] }
# The `#[ignore]`d machine-local render tests drive hosted-plugin note events.
signal-plugin-host.workspace = true
# `daw::service::MidiMessage` in those same render tests + the omni_state example.
daw.workspace = true
# build_omni_pack serializes the loop/tag-enriched LibrarySpec back to styx.
facet-styx.workspace = true
# pack_hold_rms surfaces the sampler's tracing (preload / cache-miss) logs.
tracing-subscriber.workspace = true
