[package]
name = "signal-orchestra"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# The shared sampler engine implements the CSS articulation behaviour; orchestra
# is the strings definition + spec + A/B tests on top.
sampler = { workspace = true }
# Score side of the bridge: MusicXML → engine PartOutput, converted here into
# the sampler's TrackDocument (score → annotated schedule → offline audio).
keyflow-lang = { workspace = true, features = ["orchestra"] }

[dev-dependencies]
sampler = { workspace = true, features = ["pipewire"] }
hound = { workspace = true }
eyre.workspace = true
