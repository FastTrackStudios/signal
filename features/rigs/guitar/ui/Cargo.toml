[package]
name = "signal-guitar-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# Guitar-rig Dioxus components — the feature-scoped, wasm-clean UI half of
# the detachable GUI. Everything here renders purely from the wire contract
# (`signal-guitar-proto`) via the generated vox clients; no audio backend, no
# signal domain, no platform I/O. Consumed by signal-ui (desktop) and
# apps/web (browser) alike.

[lints]
workspace = true

[dependencies]
dioxus.workspace = true
# Shared audio-gui widgets (knob + arc geometry) — one copy for every rig UI.
signal-widgets.workspace = true
lumen-blocks.workspace = true
signal-guitar-proto.workspace = true
# The TONE3000 catalog browser — mounted as the Tones page. Wasm-clean,
# like everything else here.
signal-tone3000-ui.workspace = true
# Uses `session_ui::PerformanceLayout` (a Dioxus component), so session-ui's
# `dioxus` must be on — it's optional there, gated behind `web`/`desktop`.
session-ui = { workspace = true, features = ["web"] }
# The real FTS-EQ editor core (band model, response math, SVG generators,
# interaction rules) — wasm-portable; see eq_surface.rs.
# The real EQ editor's graph — see the `eq-vello` feature.
#
# `graph` is the vello surface as an embeddable widget — the plugin's own
# painter, hit-testing and interaction rules, driven by `bands` and band
# events rather than a parameter tree. Native only: a custom widget is a
# painted scene, which needs a Blitz host. The wasm remote builds the same
# crate without the feature and draws the portable SVG path instead.
eq-ui.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eq-ui = { workspace = true }
# The modulation visualisers, from the effect that owns them. Signal draws
# processor's picture of a chorus rather than keeping a second one.
modulation-ui = { workspace = true, features = ["viz"] }
# The custom-widget surface: a painted scene composited into Blitz's own
# paint pass. Native only — the dx-web build is a DOM renderer, which
# cannot be handed an `Any` attribute at all (it panics), so the browser
# draws the DOM panels instead.
anyrender.workspace = true
# `custom-widget` is what compiles the painted-scene path in at all: without
# it `process_custom_widget_node` is `#[cfg]`'d out and a widget silently
# draws nothing. `dioxus-native` turns it on for the window; anything that
# paints a document itself — the screenshot tool — has to ask too.
blitz-dom = { workspace = true, features = ["custom-widget"] }
blitz-traits.workspace = true
dioxus-native-dom.workspace = true
vello.workspace = true
# The shader path: a WGSL fragment shader rendered into a texture vello
# composites. See `shader.rs` for why this is optional at runtime rather
# than at build time.
wgpu.workspace = true
bytemuck = { version = "1", features = ["derive"] }
fts-audio-ui.workspace = true
# BlockType — chain-strip coloring.
signal-proto.workspace = true
# The zoomable rig graph + the headless slot conversion (both wasm-clean).
signal-grid.workspace = true
signal-grid-ui.workspace = true
uuid = { version = "1", features = ["v4"] }
# use_stream (atom+vox) + the portable sleep (platform: tokio native / gloo wasm).
architect = { workspace = true, features = ["atom", "vox", "platform"] }

# `rig_shot` — the UI rendered to a PNG with no window and no audio device.
# The backend is a dev-dep because the UI crate does not depend on it (the
# arrow runs the other way, and the remote talks over a wire, not a link);
# for a picture the two have to meet, and an example is where they can.
[features]
default = ["eq-vello"]
# Mount the EQ plugin's own vello editor instead of the portable SVG
# re-host (`eq_vello` vs `eq_surface`).
#
# Off by default because it needs eq-ui's `graph` feature, which is newer
# than the tag this workspace pins — turning it on requires a local
# `[patch]` to a processor checkout, and processor and signal must agree on
# their blitz rev (the custom-widget `Widget` trait differs between them).
# Flip it on, with both aligned, and the rig draws the real editor.
#
# Needs an eq-ui with `graph`, which is newer than the pinned tag — so a
# local `[patch]` to a processor checkout until processor releases one.
eq-vello = ["eq-ui/graph"]

[dev-dependencies]
# Validate the WGSL without a GPU. The screenshot tool cannot run the shader
# path — `VelloImageRenderer` has no device to give — so nothing else in the
# tree would catch a shader that does not compile until someone ran the app.
naga = { version = "29", features = ["wgsl-in"] }
signal-guitar.workspace = true
# `local` — the in-process server the shot establishes against.
architect = { workspace = true, features = ["atom", "vox", "platform", "local"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber.workspace = true
dioxus-native-dom.workspace = true
blitz-dom.workspace = true
blitz-paint = { workspace = true, features = ["custom-widget"] }
blitz-traits.workspace = true
anyrender.workspace = true
anyrender_vello.workspace = true
image.workspace = true

[[example]]
name = "rig_shot"
