[package]
name = "signal-keys-ui"
version.workspace = true
edition = "2021"
license.workspace = true
authors.workspace = true

[dependencies]
dioxus.workspace = true
# Shared audio-gui widgets (knob + arc geometry).
signal-widgets.workspace = true
fts-chrome.workspace = true
signal-keys-proto.workspace = true
midicore-ui.workspace = true
midicore-proto.workspace = true
signal-ui = { workspace = true, features = ["web"] }
# Headless types only — the filesystem pack scanner and the live
# controller queries stay out of the browser build.
signal-browser = { workspace = true, default-features = false }
architect = { workspace = true, features = ["atom", "vox", "platform"] }
