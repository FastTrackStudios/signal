[package]
name = "signal-bass"
version.workspace = true
edition = "2021"
license.workspace = true
authors.workspace = true

[features]
# PipeWire mode: route this rig's hardware MIDI through the pipewire-jack
# backend (routable graph node, not an exclusive ALSA grab). midir's jack
# swap is compile-time and whole-binary. Audio pipewire is picked up via
# signal-sampler when the app enables it.
# PipeWire (audio + MIDI) is DEFAULT on Linux — audio is target-gated in
# daw-audio-io, MIDI via the linux target table below. Alias only.
pipewire = []

[dependencies]
signal-rigs-proto.workspace = true
# The shared sampler core — GuitarRig / ProfileRig / RigProfile / RigBlock /
# RigAudioPrefs. The bass rig is a preset layer on the same duplex engine.
signal-sampler.workspace = true
# Cross-rig utilities: poison-tolerant locking.
signal-rig-host.workspace = true

# The wire contract this crate's headless backend implements; front-ends
# consume the same crate's clients.
signal-bass-proto.workspace = true
# Layer/Services composition + the shared rig-backend scaffold (meter pump).
architect = { workspace = true, features = ["vox", "rig"] }
# BlockType for the chain mirror.
signal-proto.workspace = true
# Styx-serializable rig definitions (the runtime library files).
facet.workspace = true
facet-styx.workspace = true
# MIDI capture (program changes / footswitch CCs) + the monitor.
midicore = { workspace = true, features = ["vox", "midir"] }
tracing.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Hardware MIDI as a routable PipeWire graph node (midir on the
# pipewire-jack backend) — the Linux default, matching the audio host.
midicore = { workspace = true, features = ["vox", "midir", "midir-pipewire"] }
