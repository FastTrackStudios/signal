[package]
name = "saturate-profiles"
version.workspace = true
authors.workspace = true
license.workspace = true
edition = "2021"
description = "Saturation profiles — the five circuits, and the curve each one clips with"

[dependencies]
saturate-dsp = { path = "../saturate-dsp" }

[dev-dependencies]
# The harmonic probe: the mapping tests assert what a voicing SOUNDS like
# (H2 against H3), not what its fields happen to be set to.
saturate-dsp = { path = "../saturate-dsp", features = ["analysis"] }
# The gain-compensation harness (docs/spec/fx/gain-comp.md) — pink
# reference + drive sweeps in tests/gain_comp.rs.
fx-stack = { workspace = true }
