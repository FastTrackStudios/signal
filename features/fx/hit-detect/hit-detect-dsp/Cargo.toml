[package]
name = "hit-detect-dsp"
version.workspace = true
edition = "2021"          # matches sibling fx DSP crates (trigger-dsp, comp-dsp)
authors.workspace = true
license.workspace = true
description = "hit-detect-dsp — offline musical hit detection: per-band onset strength and a 0-1 dynamics envelope over a whole recording, for charting a song rather than triggering a sample."

[dependencies]
# The onset detection functions themselves. `trigger-dsp` already carries a
# referenced implementation of the spectral flux family (SuperFlux et al.)
# plus adaptive peak picking, driven one sample at a time for a live drum
# replacer. This crate drives the same machinery over a finished file and
# asks a different question — not "fire a sample now" but "where are this
# song's hits, and how hard is it hitting" — so it reuses rather than
# reimplements. A second onset detector in one tree is how two of them end
# up disagreeing.
trigger-dsp = { workspace = true }
# Crossover filters, to ask the kick and the snare separately.
eq-dsp = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
# The `chart` example only — decoding a real file to look at the output.
fts-sample = { workspace = true, features = ["decode-compressed"] }
anyhow = "1"
