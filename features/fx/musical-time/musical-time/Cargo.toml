[package]
name = "musical-time"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Note values, dotted and triplet, and what they are worth in seconds"

[lints]
workspace = true

# The core is dependency-free and `no_std`: it is arithmetic over note values,
# and anything it pulled in would be inherited by every DSP crate that wants
# to express a time in beats, embedded targets included.
#
# `params` is additive and off by default. It builds the two nice-plug
# parameters a synced time control needs, so the range, the labels and the
# parser are declared once instead of once per plugin per control — there are
# already six of them across the delay, the reverb and the compressor.
[features]
default = []
params = ["dep:nice-plug"]

[dependencies]
nice-plug = { workspace = true, optional = true }
