[package]
name = "pitch"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "pitch — facade over pitch-dsp; plugin UI + preset profiles are opt-in features."

[features]
default = []
# Opt-in plugin UI and preset profiles. Wired once the plugin shell
# (nice-plug / fts-ui) is brought into the workspace; declared now so the
# facade shape is stable and consumers can `features = ["ui"]`.
ui = []
profiles = []

[dependencies]
pitch-dsp = { workspace = true }
