[package]
name = "comp"
version.workspace = true
edition = "2021"          # kept on 2021 — pre-move signal workspace edition; migrate deliberately
license.workspace = true
description = "comp — facade over comp-dsp; plugin UI + preset profiles are opt-in features."

[features]
default = []
# Opt-in plugin UI and preset profiles. Wired once the plugin shell
# (nice-plug / fts-ui) is brought into the workspace; declared now so the
# facade shape is stable and consumers can `features = ["ui"]`.
ui = []
profiles = []

[dependencies]
comp-dsp = { workspace = true }

# Backs the `limiter` module (Airwindows clip primitives). The intended dep is
# `limiter-dsp` (LimiterChain over AdClip/ClipSoftly/BlockParty/Loud), but that
# crate is currently an all-stub skeleton whose manifest inherits a `fts-dsp`
# workspace dep that does not exist in the root workspace — declaring a path
# dep on it would break workspace resolution. Swap this for `limiter-dsp` once
# that crate is implemented and registered at the root.
audiocore-dsp = { workspace = true }
