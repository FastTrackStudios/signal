[package]
name = "spectrum-analyzer-ui"
version.workspace = true
edition = "2021"          # kept on 2021 — pre-move signal workspace edition; migrate deliberately
authors.workspace = true
license.workspace = true
description = "Spectrum analyzer painters + settings panel for FTS-EQ"

# Per-feature UI for the spectrum analyzer: vello painters (composited into the
# EQ graph's scene) and a Dioxus settings panel. Depends on the same
# nice-plug-dioxus / architect-ui stack as eq-ui so the `Scene` type and dioxus
# prelude line up exactly.

[dependencies]
# Direct dioxus dep: in the signal workspace audiocore-core is built without
# its dioxus re-exports (default-features = false), so the prelude items
# (Props/Callback/rsx) must come from dioxus itself.
dioxus = { workspace = true }
spectrum-analyzer-dsp = { workspace = true }
nice-plug-dioxus = { workspace = true }
audiocore-core = { workspace = true }
architect-ui = { workspace = true }
fts-ui-audio = { workspace = true }
