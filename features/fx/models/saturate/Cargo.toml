[package]
name = "fts-model-saturate"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The FTS Saturate model (from fts-fx), run by signal-effects so songs sound as they did: FTS Saturate — CLAP/VST3 saturation plugin: five circuits over the Class-A preamp engine"

[lib]
# cdylib → the loadable CLAP/VST3 binary; lib → tests + a future standalone host.
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[dependencies]
# Plugin framework. Must be a direct dep — the export macros expand to
# absolute `::nice_plug::…` paths.
nice-plug = { workspace = true, features = ["vst3"] }
plugin-core = { workspace = true }

# The DSP facade (re-exports saturate-dsp). Never depend on saturate-dsp directly.
# The effect and its parameters' faces: plugins' `plugin-ui`, which re-exports
# `dsp` with each module's `ui` at the paths fts-fx had.
dsp = { package = "plugin-ui", git = "https://github.com/FastTrackStudios/plugins", rev = "86edc7a2b79968dc3edf828a70cc1d802a37b502", features = ["saturate", "saturate-native", "saturate-profiles", "saturate-ui", "saturate-viz"] }
# What each circuit IS, and the only place that knows how a knob reaches the
# DSP — the shell deliberately carries no voicing table of its own.
# The Blitz/nice-plug editor: the five circuits and their panels. `native`
# pulls nice-plug-dioxus.
# The meters the editor reads.
atomic_float = { workspace = true }

[features]
default = []
# The CLAP / VST3 entry points, on only for the bundle build (`just
# plugins-bundle` passes `--features export`): every plugin exports the
# same `clap_entry` / `GetPluginFactory` symbols, so two in one binary —
# the session engine's built-in FX, or a workspace test build, where cargo
# unifies features — collide.
export = []

