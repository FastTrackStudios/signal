[package]
name = "fts-model-comp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The FTS Comp model (from fts-fx), run by signal-effects so songs sound as they did: FTS Comp — CLAP/VST3 compressor plugin over the comp engine"

[lib]
# cdylib → the loadable CLAP/VST3 binary; lib → tests + a future standalone host.
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[dependencies]
plugin-core = { workspace = true }
# Plugin framework. `nice_plug` must be a DIRECT dep: `#[derive(Params)]` and
# `nice_export_clap!`/`nice_export_vst3!` expand to absolute `::nice_plug::…`
# paths, so the crate has to be nameable here. `vst3` is on by default.
nice-plug = { workspace = true, features = ["vst3"] }

# The DSP facade (re-exports comp-dsp). Never depend on comp-dsp directly.
# The effect and its parameters' faces: plugins' `plugin-ui`, which re-exports
# `dsp` with each module's `ui` at the paths fts-fx had.
dsp = { package = "plugin-ui", git = "https://github.com/FastTrackStudios/plugins", rev = "9e3ea439153e0d030d3bc220ce5d69c41cc11bf6", features = ["comp", "comp-native", "comp-ui", "stack"] }
# The stack core (docs/spec/fx/stack.md): lanes of serial stages, sum laws,
# lane latency compensation.
# The full Dioxus plugin editor (control view, params, GR meter) —
# `native` pulls nice-plug-dioxus/Blitz.

[features]
default = []
# The CLAP / VST3 entry points, on only for the bundle build (`just
# plugins-bundle` passes `--features export`): every plugin exports the
# same `clap_entry` / `GetPluginFactory` symbols, so two in one binary —
# the session engine's built-in FX, or a workspace test build, where cargo
# unifies features — collide.
export = []

