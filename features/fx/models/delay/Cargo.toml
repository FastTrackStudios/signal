[package]
name = "fts-model-delay"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The FTS Delay model (from fts-fx), run by signal-effects so songs sound as they did: FTS Delay — CLAP/VST3 stereo delay plugin (tape/digital/BBD/... styles, wow/flutter, saturation, ducking) over the delay engine"

[lib]
# cdylib → the loadable CLAP/VST3 binary; lib → tests + a future standalone host.
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[dependencies]
# Plugin framework. Must be a direct dep — the export macros expand to
# absolute `::nice_plug::…` paths.
nice-plug = { workspace = true, features = ["vst3"] }

# The Blitz/nice-plug editor: the six families and their panels.
# The effect and its parameters' faces: plugins' `plugin-ui`, which re-exports
# `dsp` with each module's `ui` at the paths fts-fx had.
dsp = { package = "plugin-ui", git = "https://github.com/FastTrackStudios/plugins", rev = "9e3ea439153e0d030d3bc220ce5d69c41cc11bf6", features = ["delay", "delay-native", "delay-profiles", "delay-ui", "delay-viz"] }
plugin-core = { workspace = true }

# The DSP facade (re-exports delay-dsp). Never depend on delay-dsp directly.

# The shared DSP contract: `DelayChain` implements
# `audiocore_dsp::Processor` and is driven via `AudioConfig`, and the
# facade does not re-export those items — the trait must be in scope here.
dsp-core = { workspace = true, features = ["audio"] }

[features]
default = []
# The CLAP / VST3 entry points, on only for the bundle build (`just
# plugins-bundle` passes `--features export`): every plugin exports the
# same `clap_entry` / `GetPluginFactory` symbols, so two in one binary —
# the session engine's built-in FX, or a workspace test build, where cargo
# unifies features — collide.
export = []

