<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>signal-sampler render report</title>
<style>
  body { font-family: monospace; margin: 0; background: #14161a; color: #d8dce2; }
  #top { padding: 10px 16px; display: flex; gap: 24px; align-items: baseline; flex-wrap: wrap; }
  #top h1 { font-size: 15px; margin: 0; color: #fff; }
  #top .meta { color: #8b93a0; font-size: 12px; }
  #legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 0 16px 8px; font-size: 11px; }
  #legend span { display: inline-flex; align-items: center; gap: 5px; }
  #legend i { width: 12px; height: 12px; display: inline-block; border-radius: 2px; }
  #wrap { display: flex; }
  #canvas { display: block; cursor: crosshair; }
  #side { width: 340px; min-width: 340px; padding: 10px 14px; font-size: 12px;
          border-left: 1px solid #2a2e36; max-height: 90vh; overflow-y: auto; }
  #side h2 { font-size: 12px; color: #fff; margin: 0 0 6px; }
  #side table { border-collapse: collapse; width: 100%; }
  #side td { padding: 1px 6px 1px 0; vertical-align: top; }
  #side td:first-child { color: #8b93a0; white-space: nowrap; }
  #tip { position: fixed; pointer-events: none; background: #1f232b; color: #e6e9ee;
         border: 1px solid #3a404c; padding: 4px 8px; font-size: 11px; display: none;
         white-space: pre; z-index: 10; border-radius: 3px; }
  audio { width: 100%; margin-top: 8px; }
  .samplecard { margin: 12px 16px; border: 1px solid #2a2e36; border-radius: 4px; }
  .samplecard h3 { font-size: 12px; margin: 0; padding: 6px 10px; background: #1b1f26; }
  .samplecard canvas { display: block; }
  .samplecard .meta { padding: 6px 10px; font-size: 11px; color: #8b93a0; }
</style>
</head>
<body>
<div id="top"></div>
<div id="legend"></div>
<div id="wrap">
  <div style="flex:1; min-width:0"><canvas id="canvas"></canvas></div>
  <div id="side"><h2>Click an event or voice</h2></div>
</div>
<div id="tip"></div>
<div id="samples"></div>
<script>
const DATA = /*__REPORT_DATA__*/null;
const COL = {
  wave: '#4f8fd0', wavefill: 'rgba(79,143,208,0.35)', grid: '#242832', axis: '#8b93a0',
  SustainLayer: '#4fd08f', SustainLo: '#4fd08f', SustainHi: '#37b578', SustainNVLo: '#4fd08f',
  SustainNVHi: '#37b578', SustainVibLo: '#7fe0b0', SustainVibHi: '#5cc898',
  Legato: '#f0a03c', Release: '#b07fe0', Short: '#e0d05c', Zoned: '#5cc8e0',
  transition: '#ff7043', fire: '#ffab91', noteoff: '#90a4ae', miss: '#ff1744',
  marker: '#ffe082', emitted: '#a5d6a7', wrapTick: '#ffffff',
  loopRegion: 'rgba(240,160,60,0.22)', xfade: 'rgba(255,255,255,0.25)',
};
const NAMES = 'C C# D D# E F F# G G# A A# B'.split(' ');
const nm = n => NAMES[n % 12] + (Math.floor(n / 12) - 1);
const fmt = f => (f / DATA.sample_rate).toFixed(3) + 's';

if (DATA.mode === 'render') renderMode(); else samplesMode();

// ── render mode ──────────────────────────────────────────────────────────────
function renderMode() {
  const top = document.getElementById('top');
  const modeBadge = DATA.mode_label
    ? `<span style="background:#31506e;color:#dce7f5;border-radius:3px;padding:2px 8px;
        font-size:11px;font-weight:bold;letter-spacing:.5px">${esc(DATA.mode_label)}</span>` : '';
  const rf = DATA.reactive_fallbacks || 0;
  const rfBadge = rf > 0
    ? `<span style="background:#8b1a1a;color:#ffd7d7;border-radius:3px;padding:2px 8px;
        font-size:11px;font-weight:bold">⚠ ${rf} REACTIVE FALLBACK${rf > 1 ? 'S' : ''} — live path leaked into document render</span>`
    : '';
  top.innerHTML = `<h1>${esc(DATA.name)}</h1>${modeBadge}${rfBadge}
    <span class="meta">${DATA.sample_rate} Hz · ${DATA.channels} ch · ${fmt(DATA.frames)} ·
    ${DATA.voices.length} voices · ${DATA.events.length} events</span>`;
  if (DATA.audio_href) {
    const a = document.createElement('audio');
    a.controls = true; a.src = DATA.audio_href; a.id = 'player';
    a.preload = 'auto';
    top.appendChild(a);
  }
  // Sample-accurate seek box + live readout.
  const seekbox = document.createElement('span');
  seekbox.innerHTML = `<input id="seek" size="14" placeholder="1.234s | f59232"
      style="background:#1b1f26;color:#e6e9ee;border:1px solid #3a404c;padding:2px 6px;font:inherit">
    <span id="pos" class="meta"></span>`;
  top.appendChild(seekbox);
  // Selection controls (shift-drag on the waveform to select a range).
  const selbox = document.createElement('span');
  selbox.style.cssText = 'display:inline-flex;gap:4px;align-items:center';
  const selbtn = (label, fn) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.style.cssText =
      'background:#1b1f26;color:#d8dce2;border:1px solid #3a404c;border-radius:3px;' +
      'padding:2px 8px;font:inherit;cursor:pointer';
    b.onclick = fn;
    selbox.appendChild(b);
    return b;
  };
  selbox.innerHTML = '<span class="meta">shift-drag to select ·</span>';
  selbtn('▶ sel', () => playSelection(false));
  selbtn('⟳ loop', () => playSelection(true));
  selbtn('✕', () => { sel = null; playRange = null; document.getElementById('selinfo').textContent = ''; draw(); });
  const selinfo = document.createElement('span');
  selinfo.id = 'selinfo'; selinfo.className = 'meta';
  selbox.appendChild(selinfo);
  top.appendChild(selbox);
  window.playSelection = function (loop) {
    if (!sel) return;
    const p = document.getElementById('player');
    const start = Math.min(sel.a, sel.b), stop = Math.max(sel.a, sel.b);
    playRange = { start, end: stop, loop };
    if (p) { p.currentTime = start / DATA.sample_rate; p.play().catch(() => {}); }
  };
  // Solo: switch the player between the full mix and per-note isolated stems
  // (preserving playhead position) — A/B which note carries the artifact.
  if (DATA.stems && DATA.stems.length) {
    const bar = document.createElement('span');
    bar.id = 'solobar';
    bar.style.cssText = 'display:inline-flex;gap:4px;align-items:center';
    bar.innerHTML = '<span class="meta">solo:</span>';
    const mkbtn = (label, href, note) => {
      const b = document.createElement('button');
      b.textContent = label;
      b.dataset.href = href || '';
      b.dataset.note = note == null ? '' : note;
      b.style.cssText =
        'background:#1b1f26;color:#d8dce2;border:1px solid #3a404c;border-radius:3px;' +
        'padding:2px 8px;font:inherit;cursor:pointer';
      b.onclick = () => setSolo(b);
      bar.appendChild(b);
      return b;
    };
    mkbtn('mix', DATA.audio_href, null);
    DATA.stems.forEach(s => mkbtn(s.label, s.href, s.note));
    top.appendChild(bar);
  }
  // Click: swap the player source between the dry mix and a full-length copy
  // with the click BAKED IN (frame-0 aligned by construction — no separate
  // <audio>, no drift, can't be faked). Same swap mechanism as solo.
  if (DATA.click_href) {
    const cb = document.createElement('button');
    cb.textContent = '♩ click';
    cb.dataset.on = '0';
    cb.style.cssText =
      'background:#1b1f26;color:#d8dce2;border:1px solid #3a404c;border-radius:3px;' +
      'padding:2px 8px;font:inherit;cursor:pointer';
    cb.onclick = () => {
      const on = cb.dataset.on !== '1';
      cb.dataset.on = on ? '1' : '0';
      cb.style.background = on ? '#31506e' : '#1b1f26';
      const p = document.getElementById('player');
      const href = on ? DATA.click_href : DATA.audio_href;
      if (p && href && !p.src.endsWith(href)) {
        const t = p.currentTime, playing = !p.paused;
        p.src = href;
        p.addEventListener('loadedmetadata', function once() {
          p.currentTime = t; if (playing) p.play().catch(() => {});
          p.removeEventListener('loadedmetadata', once);
        });
      }
    };
    top.appendChild(cb);
  }
  const legend = document.getElementById('legend');
  const kinds = new Set(DATA.voices.map(v => v.kind));
  ['transition','fire','noteoff','miss','marker','emitted'].forEach(k => kinds.add(k));
  legend.innerHTML = [...kinds].map(k =>
    `<span><i style="background:${COL[k] || '#888'}"></i>${k}</span>`).join('') +
    `<span><i style="background:${COL.wrapTick}"></i>loop wrap</span>`;

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let view = { a: 0, b: DATA.frames };           // visible frame range
  let hover = null;
  let soloNote = null;                           // null = full mix
  let sel = null;                                // {a,b} frame selection
  let selecting = false;
  let playRange = null;                          // {start,end,loop} active playback bounds

  // Switch the audio source to a stem (or the full mix), keeping the playhead
  // position and play/pause state so an A/B is seamless.
  window.setSolo = function (btn) {
    const p = document.getElementById('player');
    const href = btn.dataset.href;
    soloNote = btn.dataset.note === '' ? null : parseInt(btn.dataset.note, 10);
    document.querySelectorAll('#solobar button').forEach(b =>
      b.style.background = b === btn ? '#31506e' : '#1b1f26');
    if (p && href && !p.src.endsWith(href)) {
      const t = p.currentTime, playing = !p.paused;
      p.src = href;
      p.addEventListener('loadedmetadata', function once() {
        p.currentTime = t; if (playing) p.play().catch(() => {});
        p.removeEventListener('loadedmetadata', once);
      });
    }
    draw();
  };

  // Voice rows: stack per line then spawn order.
  const voices = [...DATA.voices].sort((x, y) => (x.line - y.line) || (x.spawn - y.spawn));
  const ROWS = Math.max(voices.length, 1);
  const WAVE_H = 180, ROW_H = Math.max(10, Math.min(18, 420 / ROWS)), EV_H = 90, AXIS = 22;

  function layout() {
    canvas.width = Math.max(700, window.innerWidth - 380);
    canvas.height = WAVE_H + AXIS + ROWS * ROW_H + EV_H + 30;
  }
  const X = f => (f - view.a) / (view.b - view.a) * canvas.width;
  const F = x => view.a + x / canvas.width * (view.b - view.a);

  function draw() {
    layout();
    ctx.fillStyle = '#14161a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    // waveform
    const { block, min, max } = DATA.peaks;
    ctx.fillStyle = COL.wavefill; ctx.strokeStyle = COL.wave;
    const mid = WAVE_H / 2;
    ctx.beginPath();
    for (let x = 0; x < canvas.width; x++) {
      const f0 = F(x), f1 = F(x + 1);
      let lo = 1, hi = -1;
      for (let b = Math.floor(f0 / block); b <= Math.min(Math.floor(f1 / block), min.length - 1); b++) {
        lo = Math.min(lo, min[b]); hi = Math.max(hi, max[b]);
      }
      if (lo > hi) { lo = 0; hi = 0; }
      ctx.rect(x, mid - hi * mid * 0.95, 1, Math.max(1, (hi - lo) * mid * 0.95));
    }
    ctx.fill();
    const gridH = WAVE_H + AXIS + ROWS * ROW_H + EV_H;
    // time axis
    ctx.fillStyle = COL.axis; ctx.font = '10px monospace';
    const span = (view.b - view.a) / DATA.sample_rate;
    const step = Math.pow(10, Math.floor(Math.log10(span / 8)));
    for (let t = Math.ceil(view.a / DATA.sample_rate / step) * step; t * DATA.sample_rate < view.b; t += step) {
      const x = X(t * DATA.sample_rate);
      ctx.fillRect(x, 0, 1, gridH);
      ctx.fillText(t.toFixed(step < 1 ? 2 : 0) + 's', x + 3, WAVE_H + 14);
    }
    // musical beat/bar ruler — beat 1.1 anchored at frame 0. Bar lines bold +
    // labeled; beat lines faint. So off-grid onsets are visible against it.
    if (DATA.tempo) {
      const { bpm, beats_per_bar } = DATA.tempo;
      const fpb = 60 / bpm * DATA.sample_rate;          // frames per beat
      const bpbar = beats_per_bar || 4;
      const b0 = Math.max(0, Math.floor(view.a / fpb));
      const b1 = Math.ceil(view.b / fpb);
      // Skip beat sub-lines when they'd be denser than ~6 px.
      const drawBeats = fpb / (view.b - view.a) * canvas.width > 6;
      for (let bi = b0; bi <= b1; bi++) {
        const x = X(bi * fpb);
        const isBar = bi % bpbar === 0;
        if (!isBar && !drawBeats) continue;
        ctx.fillStyle = isBar ? '#c8b04d' : 'rgba(200,176,77,0.28)';
        ctx.fillRect(x, WAVE_H, isBar ? 2 : 1, AXIS + ROWS * ROW_H + EV_H);
        ctx.fillStyle = isBar ? '#e0c860' : 'rgba(200,176,77,0.7)';
        const bar = Math.floor(bi / bpbar) + 1, beat = (bi % bpbar) + 1;
        ctx.fillText(isBar ? `${bar}` : `${bar}.${beat}`, x + 2, WAVE_H + 24);
      }
    }
    // voice rows
    voices.forEach((v, i) => {
      const y = WAVE_H + AXIS + i * ROW_H;
      const end = v.end ?? DATA.frames;
      const x0 = X(v.spawn), x1 = Math.max(X(end), x0 + 2);
      v._rect = [x0, y, x1 - x0, ROW_H - 2];
      // Brightness ∝ spawn gain — the many gain≈0 CC1 sustain layers fade
      // back so the one carrying the note stands out. Solo-muted rows dim
      // further; hover is always full.
      const muted = soloNote != null && v.note !== soloNote;
      const gAlpha = Math.min(1, 0.14 + Math.abs(v.gain) * 0.62);
      ctx.globalAlpha = hover === v ? 1 : (muted ? 0.12 : gAlpha);
      ctx.fillStyle = COL[v.kind] || '#888';
      ctx.fillRect(x0, y, x1 - x0, ROW_H - 2);
      // A thin full-opacity baseline keeps even silent rows locatable.
      ctx.globalAlpha = muted ? 0.2 : 0.5;
      ctx.fillRect(x0, y + ROW_H - 3, x1 - x0, 1);
      ctx.globalAlpha = 1;
      // loop wrap ticks
      ctx.fillStyle = COL.wrapTick;
      for (const w of v.wraps) ctx.fillRect(X(w), y, 1, ROW_H - 2);
      if (ROW_H >= 12 && x1 - x0 > 60) {
        ctx.fillStyle = '#0009';
        ctx.fillText(`${nm(v.note)} ${v.articulation}`, x0 + 3, y + ROW_H - 5);
      }
    });
    // Events annotated in a strip JUST BELOW the note they concern (follow the
    // action instead of a detached bottom lane). The relevant note is the
    // transition/fire DESTINATION, else the event's own note.
    const evNote = e => e.kind === 'transition' || e.kind === 'fire' ? e.to
      : (e.note != null ? e.note : null);
    const rowOfNote = (note, frame) => {
      if (note == null) return null;
      let best = null;
      for (const v of voices) {
        if (v.note !== note) continue;
        const end = v.end ?? DATA.frames;
        if (frame >= v.spawn - 4800 && frame <= end + 4800) {
          if (!best || v.spawn > best.spawn) best = v; // most recent match
        }
      }
      return best ? best._rect[1] : null;
    };
    const fallbackY = WAVE_H + AXIS + ROWS * ROW_H + 4;
    // Stagger sub-lanes so coincident events on the same note don't overlap.
    const subLane = { transition: 0, fire: 0, noteoff: 1, marker: 1, emitted: 1, miss: 2 };
    for (const e of DATA.events) {
      const x = X(e.frame);
      const rowY = rowOfNote(evNote(e), e.frame);
      const y = (rowY != null ? rowY + ROW_H - 1 : fallbackY) + (subLane[e.kind] ?? 2) * 4;
      e._rect = [x - 3, y, 7, 9];
      ctx.fillStyle = COL[e.kind] || '#888';
      if (e.kind === 'miss') ctx.fillRect(x - 3, y, 7, 9);
      else {
        // little downward triangle pointing at the note row above
        ctx.beginPath();
        ctx.moveTo(x - 3, y + 8); ctx.lineTo(x + 3, y + 8); ctx.lineTo(x, y);
        ctx.closePath(); ctx.fill();
      }
      // fire→arrival span shows the CSS transition latency in-place
      if (e.kind === 'fire' && e.arrival != null) {
        ctx.fillStyle = COL.fire + '99';
        ctx.fillRect(x, y + 3, Math.max(X(e.arrival) - x, 1), 2);
      }
    }
    // Selection overlay.
    if (sel) {
      const sa = X(Math.min(sel.a, sel.b)), sb = X(Math.max(sel.a, sel.b));
      ctx.fillStyle = 'rgba(80,180,255,0.14)';
      ctx.fillRect(sa, 0, sb - sa, canvas.height);
      ctx.fillStyle = 'rgba(80,180,255,0.8)';
      ctx.fillRect(sa, 0, 1, canvas.height);
      ctx.fillRect(sb - 1, 0, 1, canvas.height);
    }
    // Playhead cursor — full height, drawn last.
    const p = document.getElementById('player');
    if (p && !isNaN(p.currentTime)) {
      const pf = p.currentTime * DATA.sample_rate;
      if (pf >= view.a && pf <= view.b) {
        const x = X(pf);
        ctx.fillStyle = '#ff5252';
        ctx.fillRect(x, 0, 2, canvas.height);
        ctx.beginPath();
        ctx.moveTo(x - 5, 0); ctx.lineTo(x + 7, 0); ctx.lineTo(x + 1, 9);
        ctx.closePath(); ctx.fill();
      }
      const pos = document.getElementById('pos');
      if (pos) pos.textContent =
        ` ▶ ${p.currentTime.toFixed(4)}s · frame ${Math.round(pf)}`;
    }
  }

  function pick(mx, my) {
    for (const e of DATA.events) {
      const r = e._rect;
      if (r && mx >= r[0] && mx <= r[0] + r[2] && my >= r[1] && my <= r[1] + r[3]) return e;
    }
    for (const v of voices) {
      const r = v._rect;
      if (r && mx >= r[0] && mx <= r[0] + r[2] && my >= r[1] && my <= r[1] + r[3]) return v;
    }
    return null;
  }

  const tip = document.getElementById('tip');
  // Alt-scrub: hold Alt and move across the waveform to hear the audio track
  // the cursor (tape-style scrubbing) — the fast way to pin a timing issue by
  // ear. The player follows the pointer; releasing Alt (or leaving the canvas)
  // pauses.
  let scrubbing = false;
  function scrub(ev) {
    const p = document.getElementById('player');
    if (!p) return;
    p.currentTime = Math.max(0, F(ev.offsetX) / DATA.sample_rate);
    if (p.paused) { p.play().catch(() => {}); }
    scrubbing = true;
    draw();
  }
  function endScrub() {
    const p = document.getElementById('player');
    if (scrubbing && p) p.pause();
    scrubbing = false;
  }
  canvas.addEventListener('mousemove', ev => {
    if (ev.altKey) { scrub(ev); tip.style.display = 'none'; return; }
    if (scrubbing) endScrub();
    const mx = ev.offsetX, my = ev.offsetY;
    const hit = pick(mx, my);
    if (hit !== hover) { hover = hit; draw(); }
    if (hit) {
      tip.style.display = 'block';
      tip.style.left = (ev.clientX + 14) + 'px';
      tip.style.top = (ev.clientY + 10) + 'px';
      tip.textContent = hit.id !== undefined ? voiceTip(hit) : eventTip(hit);
    } else tip.style.display = 'none';
  });
  window.addEventListener('keyup', ev => { if (ev.key === 'Alt') endScrub(); });
  canvas.addEventListener('mouseleave', () => { tip.style.display = 'none'; endScrub(); });
  canvas.addEventListener('click', ev => {
    const hit = pick(ev.offsetX, ev.offsetY);
    if (hit) showDetail(hit);
    // Seek: an event/voice hit seeks to its EXACT frame (sample-accurate);
    // bare canvas clicks seek to the pixel position.
    const frame = hit ? (hit.frame ?? hit.spawn) : F(ev.offsetX);
    seekTo(frame);
  });
  function seekTo(frame) {
    const p = document.getElementById('player');
    if (p && frame != null) p.currentTime = frame / DATA.sample_rate;
    draw();
  }
  // Seek box: "1.234" / "1.234s" = seconds, "f59232" / "59232f" = frames.
  document.getElementById('seek').addEventListener('keydown', ev => {
    if (ev.key !== 'Enter') return;
    const s = ev.target.value.trim().toLowerCase();
    let frame = null;
    const fm = s.match(/^f?(\d+)f?$/);
    if (s.includes('f') && fm) frame = parseInt(fm[1], 10);
    else {
      const t = parseFloat(s.replace(/s$/, ''));
      if (!isNaN(t)) frame = t * DATA.sample_rate;
    }
    if (frame != null) {
      seekTo(frame);
      // Center the view on the seek target if it's off-screen.
      if (frame < view.a || frame > view.b) {
        const span = view.b - view.a;
        view.a = Math.max(0, frame - span / 2);
        view.b = Math.min(DATA.frames, view.a + span);
        draw();
      }
    }
  });
  // Space = play/pause (unless typing in the seek box).
  window.addEventListener('keydown', ev => {
    if (ev.code === 'Space' && ev.target.tagName !== 'INPUT') {
      ev.preventDefault();
      const p = document.getElementById('player');
      if (p) p.paused ? p.play() : p.pause();
    }
  });
  // Live playhead: redraw while playing (and follow the cursor when it
  // leaves the visible window).
  (function raf() {
    const p = document.getElementById('player');
    if (p && !p.paused) {
      // Enforce the play/loop selection bounds.
      if (playRange) {
        const cf = p.currentTime * DATA.sample_rate;
        if (cf >= playRange.end) {
          if (playRange.loop) { p.currentTime = playRange.start / DATA.sample_rate; }
          else { p.pause(); playRange = null; }
        }
      }
      const pf = p.currentTime * DATA.sample_rate;
      if (pf > view.b) {
        const span = view.b - view.a;
        view.a = Math.min(pf, DATA.frames - span);
        view.b = view.a + span;
      }
      draw();
    }
    requestAnimationFrame(raf);
  })();
  canvas.addEventListener('wheel', ev => {
    ev.preventDefault();
    const f = F(ev.offsetX);
    const z = ev.deltaY < 0 ? 0.8 : 1.25;
    view.a = Math.max(0, f - (f - view.a) * z);
    view.b = Math.min(DATA.frames, f + (view.b - f) * z);
    draw();
  }, { passive: false });
  let dragX = null;
  canvas.addEventListener('mousedown', ev => {
    if (ev.shiftKey) {                    // shift-drag = range selection
      selecting = true;
      const f = F(ev.offsetX);
      sel = { a: f, b: f };
      playRange = null;
      draw();
    } else {
      dragX = ev.offsetX;
    }
  });
  window.addEventListener('mouseup', () => { dragX = null; selecting = false; updateSelInfo(); });
  function updateSelInfo() {
    const el = document.getElementById('selinfo');
    if (!el) return;
    if (!sel) { el.textContent = ''; return; }
    const a = Math.min(sel.a, sel.b), b = Math.max(sel.a, sel.b);
    const dur = (b - a) / DATA.sample_rate;
    let s = ` ${(a / DATA.sample_rate).toFixed(3)}–${(b / DATA.sample_rate).toFixed(3)}s (${(dur * 1000).toFixed(0)} ms`;
    if (DATA.tempo) s += `, ${(dur / (60 / DATA.tempo.bpm)).toFixed(2)} beats`;
    el.textContent = s + ')';
  }
  canvas.addEventListener('mousemove', ev => {
    if (selecting) { sel.b = F(ev.offsetX); updateSelInfo(); draw(); return; }
    if (dragX === null || ev.altKey) return;
    const df = (dragX - ev.offsetX) / canvas.width * (view.b - view.a);
    if (Math.abs(dragX - ev.offsetX) < 3) return;
    const span = view.b - view.a;
    view.a = Math.max(0, Math.min(view.a + df, DATA.frames - span));
    view.b = view.a + span;
    dragX = ev.offsetX;
    draw();
  });
  window.addEventListener('resize', draw);

  function voiceTip(v) {
    return `#${v.id} ${v.kind} ${nm(v.note)}  ${v.articulation}/${v.dynamic || '-'}\n` +
      `${v.file}\n` +
      `spawn ${fmt(v.spawn)}  end ${v.end != null ? fmt(v.end) : '(running)'}  ` +
      `gain ${v.gain.toFixed(3)} rate ${v.rate.toFixed(4)}\n` +
      (v.loop_end > v.loop_start
        ? `loop ${v.loop_start}..${v.loop_end} xf ${v.loop_xfade} (${v.wraps.length} wraps)`
        : 'no loop');
  }
  function eventTip(e) {
    let s = e.kind + ' @ ' + fmt(e.frame);
    // Timing deltas vs the musical grid: how far this event sits from the
    // nearest beat, and (for fires/prefires) the prefire lead to arrival.
    if (DATA.tempo) {
      const fpb = 60 / DATA.tempo.bpm * DATA.sample_rate;
      const grid = f => {
        const b = Math.round(f / fpb);
        const dms = (f - b * fpb) / DATA.sample_rate * 1000;
        return `beat ${b + 1} ${dms >= 0 ? '+' : ''}${dms.toFixed(1)}ms`;
      };
      s += `\n${grid(e.frame)}`;
      if (e.kind === 'fire' && e.arrival != null) {
        s += `\narrival: ${grid(e.arrival)}`;
        s += `\nprefire lead: ${((e.arrival - e.frame) / DATA.sample_rate * 1000).toFixed(1)}ms before arrival`;
      }
    }
    // Distance to the nearest emitted "heard" marker of the same note — the
    // real audible arrival vs this intended marker.
    const note = e.to ?? e.note;
    if (note != null) {
      let best = null;
      for (const o of DATA.events) {
        if (o.kind === 'emitted' && o.note === note) {
          if (!best || Math.abs(o.frame - e.frame) < Math.abs(best - e.frame)) best = o.frame;
        }
      }
      if (best != null && best !== e.frame) {
        s += `\nheard vs this: ${((best - e.frame) / DATA.sample_rate * 1000).toFixed(1)}ms`;
      }
    }
    s += '\n' + JSON.stringify(e, (k, v) => k.startsWith('_') ? undefined : v);
    return s;
  }
  function showDetail(o) {
    const side = document.getElementById('side');
    const rows = Object.entries(o)
      .filter(([k]) => !k.startsWith('_'))
      .map(([k, v]) => `<tr><td>${k}</td><td>${esc(JSON.stringify(v))}</td></tr>`).join('');
    side.innerHTML = `<h2>${o.id !== undefined ? 'voice #' + o.id : o.kind}</h2><table>${rows}</table>`;
  }
  // Redraw the playhead on scrubs via the audio element's own controls. The
  // click is BAKED into the swapped source (see the ♩ click toggle), so there
  // is no second element to keep in sync — nothing can drift.
  const player = document.getElementById('player');
  if (player) {
    player.addEventListener('seeked', draw);
    player.addEventListener('pause', draw);
    player.addEventListener('timeupdate', () => { if (player.paused) draw(); });
  }
  draw();
}

// ── samples mode ─────────────────────────────────────────────────────────────
function samplesMode() {
  document.getElementById('top').innerHTML =
    `<h1>${esc(DATA.name)}</h1><span class="meta">${DATA.samples.length} sample(s)</span>`;
  document.getElementById('wrap').style.display = 'none';
  const host = document.getElementById('samples');
  for (const s of DATA.samples) {
    const card = document.createElement('div');
    card.className = 'samplecard';
    const z = s.zone;
    card.innerHTML = `<h3>${esc(s.title)}</h3>`;
    const c = document.createElement('canvas');
    c.width = Math.max(700, window.innerWidth - 64); c.height = 150;
    card.appendChild(c);
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent =
      `${z.articulation}/${z.dynamic || '-'} mic=${z.mic} keys ${nm(z.key_min)}..${nm(z.key_max)} ` +
      `root ${nm(z.root_key)} vel ${z.vel_min}-${z.vel_max} rr ${z.rr_index} ` +
      (z.direction ? `dir ${z.direction} iv ${z.interval} ` : '') +
      (z.loop_end > z.loop_start ? `LOOP ${z.loop_start}..${z.loop_end} xf ${z.loop_xfade} ` : 'no loop ') +
      (z.lead_in_ms ? `lead_in ${z.lead_in_ms.toFixed(1)}ms ` : '') +
      (z.arrival_ms ? `arrival ${z.arrival_ms.toFixed(1)}ms ` : '') +
      `gain ${z.gain_db}dB tune ${z.tune_cents}c — ${s.frames} frames @ ${s.sample_rate}Hz`;
    card.appendChild(meta);
    host.appendChild(card);
    drawSample(c, s);
  }
}
function drawSample(c, s) {
  const ctx = c.getContext('2d');
  const { block, min, max } = s.peaks;
  const W = c.width, H = c.height, mid = H / 2;
  const X = f => f / s.frames * W;
  ctx.fillStyle = '#14161a'; ctx.fillRect(0, 0, W, H);
  const z = s.zone;
  // loop region + crossfade shading behind the waveform
  if (z.loop_end > z.loop_start) {
    ctx.fillStyle = COL.loopRegion;
    ctx.fillRect(X(z.loop_start), 0, X(z.loop_end) - X(z.loop_start), H);
    if (z.loop_xfade > 0) {
      ctx.fillStyle = COL.xfade;
      ctx.fillRect(X(z.loop_end - z.loop_xfade), 0, X(z.loop_end) - X(z.loop_end - z.loop_xfade), H);
    }
  }
  ctx.fillStyle = COL.wavefill;
  ctx.beginPath();
  for (let x = 0; x < W; x++) {
    const b0 = Math.floor(x / W * min.length), b1 = Math.min(Math.floor((x + 1) / W * min.length), min.length - 1);
    let lo = 1, hi = -1;
    for (let b = b0; b <= b1; b++) { lo = Math.min(lo, min[b]); hi = Math.max(hi, max[b]); }
    if (lo > hi) { lo = 0; hi = 0; }
    ctx.rect(x, mid - hi * mid * 0.95, 1, Math.max(1, (hi - lo) * mid * 0.95));
  }
  ctx.fill();
  // markers
  const mark = (frame, color, label) => {
    if (frame == null) return;
    const x = X(frame);
    ctx.fillStyle = color; ctx.fillRect(x, 0, 2, H);
    ctx.font = '10px monospace'; ctx.fillText(label, x + 4, 12);
  };
  if (z.loop_end > z.loop_start) {
    mark(z.loop_start, COL.transition, 'loop_start');
    mark(z.loop_end, COL.transition, 'loop_end');
  }
  if (z.sample_start > 0) mark(z.sample_start, COL.marker, 'sample_start');
  if (z.sample_end > 0) mark(z.sample_end, COL.marker, 'sample_end');
  if (z.lead_in_ms > 0) mark(z.lead_in_ms / 1000 * s.sample_rate, COL.emitted, 'lead_in');
  if (z.arrival_ms > 0) mark(z.arrival_ms / 1000 * s.sample_rate, COL.fire, 'arrival');
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
</script>
