[package]
name = "signal-core-clap"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Signal's CLAP backend on the desktop: a block run by its CLAP (or a third-party one) through daw's plugin host, and the hot-reload block override (signal#26)"

[lints]
workspace = true

[dependencies]
signal-core = { workspace = true, features = ["std", "fx", "nam"] }
plugin-processors = { workspace = true, features = ["std", "gate", "saturate", "eq", "comp", "delay", "reverb"] }
daw = { workspace = true, features = ["clap-host"] }
daw-clap-ext = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
