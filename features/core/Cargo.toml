[package]
name = "signal-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Signal's one processor: rigs, DSP chains and (later) the drum submixer, for every host — compiled into Studio's engine (native, iOS, wasm) or wrapped as the Signal CLAP"

[lints]
workspace = true

[features]
default = ["std", "fx", "nam", "offline"]
# The in-process session registry (one Signal session shared by the
# instances on a kit's tracks) and `std::error::Error` impls.
std = ["plugin-processors/std", "dep:realfft"]
# The plugins' effects as blocks (plugin-processors). Gain is always there.
fx = ["std", "plugin-processors/files", "plugin-processors/gate", "plugin-processors/saturate", "plugin-processors/eq", "plugin-processors/comp", "plugin-processors/delay", "plugin-processors/reverb", "plugin-processors/trigger"]
# Offline blocks' analyses (the vocal leveler's, the aligner's search):
# FastTrackStudio/dsp's `level`, run on the control thread. Their apply
# stages are always there.
offline = ["std", "dep:signal-dsp"]
# The NAM amp block (neural-amp-modeler, pure Rust).
nam = ["std", "dep:neural-amp-modeler"]

[dependencies]
plugin-processors = { workspace = true }
signal-dsp-core = { workspace = true }
signal-dsp = { workspace = true, optional = true, features = ["level"] }
libm = { workspace = true }
realfft = { workspace = true, optional = true }
neural-amp-modeler = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
realfft = { workspace = true }
signal-core = { path = ".", features = ["std", "fx", "nam", "offline"] }
