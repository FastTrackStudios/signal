[package]
name = "signal-analyzer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Measure FTS FX against reference plugins — signal generation, metrics, and A/B comparison"

[dependencies]
realfft.workspace = true
serde.workspace = true

# The library itself hosts no plugins — callers hand it rendered buffers.
# The render bridge (examples/) needs the hosts and our own FX, so those are
# dev-only: `cargo test -p signal-analyzer` still runs with nothing installed.
[dev-dependencies]
signal-plugin-host = { workspace = true, features = ["clap-host", "vst3-host"] }
signal-fx.workspace = true
reverb-dsp.workspace = true
audiocore-dsp.workspace = true
signal-import.workspace = true
# `examples/eq_bundle_check` configures the engine directly and compares it
# with the installed bundle, which is how a plugin-side fault is told from a
# DSP one.
eq-dsp.workspace = true
# Reference-render caching and result files: a tuning run is expensive and its
# output IS the preset, so both are worth keeping.
hound = "3.5"
serde_json.workspace = true

[lints]
workspace = true
