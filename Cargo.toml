# ── UI framework ──────────────────────────────────────────────────────
# dioxus 0.8 line — git rev pinned (0.8.0-alpha.0 + the blitz beta bump;
# bump this rev deliberately, it must stay in lockstep across every
# dioxus-* entry below AND the FTS fork branches of primitives/lumen/
# lucide/sdk, which pin the same rev).
dioxus = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", default-features = false, features = ["lib"] }
# Direct, and only apps/web takes it: it is how the site turns on
# `hydrate` for static generation without `dioxus/fullstack`, whose
# reqwest would be a second major in the wasm binary. Same rev as the
# meta-crate above — they are one repo and must not drift.
dioxus-web = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", default-features = false }
# Blitz native renderer — dioxus-native(-dom) moved into the dioxus repo
# on the 0.8 line; blitz-* come from crates.io (0.3.0-beta.1), matching
# dioxus git's own `=0.3.0-beta.1` pins. Feature union of the wave-1
# UI libs (prelude, system-fonts) and daw-reaper-dioxus (svg, autofocus,
# incremental, data-uri theme-skin PNGs).
# `vello` — the compute-shader renderer — because dioxus-native's own
# default is `vello-hybrid`, which does much of its path work on the CPU.
# Hybrid exists for WebGL-class targets; on a desktop GPU it is what
# stands between the expression editor and its frame budget (35 fps at
# 5120x1440 with five notes on screen, where the whole scene was 69 draw
# commands and 0.04 ms to build — the cost was all in rasterising it).
#
# Both features can be on at once: the renderer is chosen by a `cfg_if`
# chain that tests `vello` first, so this wins over the default without
# having to turn defaults off and re-list them.
# `default-features = false` with every default re-listed, so that this
# list is the whole truth: dropping a feature from a `features = [...]`
# while defaults are on does NOTHING, which cost a day of chasing
# `incremental` that was never actually off.
#
# `incremental` is back ON. It is not what crashes the window — the
# panic reproduces with it off — and it is worth roughly 2x: without it
# every resolve rebuilds layout children for the whole document, the
# combined workload goes 5.7x to 11.6x, and a frame that changes nothing
# stops being free.
# The vendored copy (see its UPSTREAM.md) by path, not the git URL the
# [patch] below redirects: a member's dep on a patched git crate leaves
# nothing in the lockfile to match it, so cargo re-queries the git source
# — which a vendored, offline build (nix, crane) refuses. daw's crates
# still name the git URL; the patch covers them.
dioxus-native = { path = "libs/vendor/dioxus-native", default-features = false, features = ["prelude", "system-fonts", "svg", "autofocus", "data-uri", "vello", "accessibility", "hot-reload", "net", "html", "clipboard", "file-dialog", "vello-hybrid", "woff", "apple-font-embolden", "incremental"] }
# On `incremental`, which was suspected of the `hit_inner` panic and
# exonerated: the crash reproduces with it off, so the stale ids that
# `resolve.rs` knowingly keeps in `layout_children` are not the cause.
# What is left is an ordering race — a pointer event hit-tests between
# dioxus applying a mutation and the next resolve rebuilding
# `paint_children` — which no feature flag reaches. The lever is to stop
# REMOVING nodes; see `TcpColumn`'s recycler, which fixed the same panic
# for the track panel.
blitz-dom = "=0.3.0-beta.1"
blitz-paint = "=0.3.0-beta.1"
blitz-traits = "=0.3.0-beta.1"
blitz-shell = "=0.3.0-beta.1"
blitz-html = "=0.3.0-beta.1"
dioxus-native-dom = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc" }
# Runtime telemetry the `dioxus-mcp` server reads back: renders, signal
# writes and PANICS, as JSONL under target/dioxus-mcp/. `dx serve` owns
# the child's console, so a panic in the window otherwise reaches nobody
# — this is how it becomes something an agent can be pointed at. A no-op
# in release builds unless the `force` feature is on. Not on crates.io.
dioxus-mcp-probe = { git = "https://github.com/tonybierman/dioxus-mcp" }
