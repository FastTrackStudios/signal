# ── Facet reflection + vox RPC — the rc.5 fleet pins ──────────────────
facet = { version = "0.50.0-rc.5", features = ["reflect", "chrono", "uuid"] }
facet-json = { version = "0.50.0-rc.5" }
facet-postcard = { version = "0.50.0-rc.5" }
facet-styx = { version = "5.0.0-rc.5" }
# facet-styx's formatter, needed directly by anyone who has to set
# `omit_none` (the `.daw` writer). Routed to the vendor repo by the
# [patch.crates-io] table below.
styx-format = { version = "5.0.0-rc.5" }
facet-toml = { version = "0.50.0-rc.5" }
# figue pairs with facet-styx 5.0 (reaper-input keybind config parsing).
figue = { version = "5.0.0-rc.5" }
vox = { version = "0.10.0-rc.5", default-features = false, features = ["runtime"] }
vox-types = { version = "0.10.0-rc.5" }
vox-phon = { version = "0.10.0-rc.5" }
vox-stream = { version = "0.10.0-rc.5" }
vox-core = { version = "0.10.0-rc.5" }
vox-websocket = { version = "0.10.0-rc.5" }
iroh = { version = "1" }
# Files CAS chunk store (issue #256): streaming FastCDC content-defined
# chunking, blake3 content addressing, iroh-blobs as the local blob store.
fastcdc = { version = "4", features = ["tokio"] }
iroh-blobs = { version = "0.103", default-features = false, features = ["fs-store"] }
blake3 = { version = "1.8" }
# Whole-file placement: reflink where the filesystem clones extents,
# hardlink otherwise (see ChunkStore::write_path). Already in the tree as
# an iroh-blobs dependency; named here so the chunk store can use it
# directly rather than only through iroh-blobs' import path, which offers
# no hardlink fallback.
reflink-copy = { version = "0.1" }
# Files version-store engine (issue #257/ADR 0001): jj-lib's `Backend` trait,
# implemented over the chunk store above. Pinned (jj-lib is pre-1.0 per the
# ADR); vendor-patch here if/when we need to carry a local fix.
jj-lib = { version = "=0.44.0" }
# Software File Roots (issue #273) are colocated git: the `files` feature
# talks to the root's real `.git` directly (branch refs, index) alongside
# jj-lib's `GitBackend`. Same version jj-lib itself pins, so there is one
# gix in the tree; features are a subset of jj-lib's own.
gix = { version = "0.85", default-features = false, features = [
    "index",
    "max-performance-safe",
    "sha1",
] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
# Embeds the staged fasttrackstudio web bundle into the native binary
# (apps/desktop feature `embed-web`).
include_dir = "0.7"
# Dante/AoIP ARC control (FastTrackStudios/inferno-control workspace) —
# discovery, channel lists, subscriptions. Pinned to the
# hardware-dante-fixes rev (parser guards + pagination + status
# semantics, found by patchbay against the live network); bump the
# ~/.flake input to match when it merges.
inferno-net = { git = "https://codeberg.org/FastTrackStudios/inferno-control", rev = "d3b048941df55dae12c7b9f8c4b776681b8679d3" }

