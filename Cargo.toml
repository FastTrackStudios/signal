# signal: the rigs, the sampler and the Signal plugins.
#
# The live-rig domain of FastTrackStudios' audio stack: Signal's domain
# crates (features/signal), the instrument rigs (features/rigs), the
# sampler (features/sampler), NAM (features/dsp/nam), the CLAP/VST3
# plugins that need them (apps/plugins: signal, sampler, nam), and the
# Komplete Kontrol driver the drum rig lights a keybed with. They came
# here from FastTrackStudios/studio with their history (studio#510); Studio
# (the product) takes them from here by git, pinned to one revision.
#
# Below them: the DAW (FastTrackStudios/daw: the base and the engine),
# the effects (FastTrackStudios/fts-fx), Frame and Architect. Every
# external dependency is declared with the version, git pin and features
# Studio's root manifest uses, and Cargo.lock was seeded from Studio's, so
# the fleet builds one of each: move a pin here and in Studio together.

[workspace]
resolver = "3"

members = [
    "apps/plugins/nam",
    "apps/plugins/sampler",
    "apps/plugins/signal",
    "features/core",
    "features/dsp/nam",
    "features/rigs/drums",
    "features/rigs/ekit",
    "features/rigs/fretted",
    "features/rigs/fx",
    "features/rigs/guitar",
    "features/rigs/host",
    "features/rigs/keys",
    "features/rigs/keys/wurli",
    "features/rigs/kontrol",
    "features/rigs/orchestra",
    "features/rigs/perform-store",
    "features/rigs/perform-ui",
    "features/rigs/proto",
    "features/rigs/shell",
    "features/rigs/synth",
    "features/rigs/synth-rig",
    "features/sampler",
    "features/signal",
    "features/signal/browser",
    "features/signal/content-client",
    "features/signal/content-library",
    "features/signal/content-proto",
    "features/signal/controller",
    "features/signal/daw-bridge",
    "features/signal/grid",
    "features/signal/grid-ui",
    "features/signal/import",
    "features/signal/live",
    "features/signal/macromod",
    "features/signal/proto",
    "features/signal/space",
    "features/signal/storage",
    "features/signal/tone3000",
    "features/signal/widgets",
    "xtask/plugins",
]

[workspace.package]
version = "26.10.3"
edition = "2024"
rust-version = "1.87"
authors = ["FastTrack Studio"]
license = "GPL-3.0-or-later"
repository = "https://github.com/FastTrackStudios/signal"

[workspace.dependencies]
signal-space = { path = "features/signal/space" }
signal-tone3000 = { path = "features/signal/tone3000" }
# The effects live in FastTrackStudios/fts-fx (studio#510): `dsp-core`,
# `dsp`, `fts-audio-ui`, `plugin-core`, `preset-browser` and the plugin
# crates `builtin` runs in-process, all at ONE rev (move every line
# together). Working on both at once: a local [patch], never committed
# (docs/fts-fx.md has the table).
fts-audio-ui = { git = "https://github.com/FastTrackStudios/fts-fx", rev = "5bae622f5d874ce58ab04916ab29a8100e883012" }
plugin-core = { git = "https://github.com/FastTrackStudios/fts-fx", rev = "5bae622f5d874ce58ab04916ab29a8100e883012" }
# Frame, the design and control-surface engine, from its own repo
# (FastTrackStudios/frame), pinned by rev: the core crate, which has no
# architect, vox or Dioxus dependency. A local checkout goes under the build
# as a never-committed [patch] (docs/frame.md).
frame = { git = "https://github.com/FastTrackStudios/frame", rev = "1f6311abc5eeef87c5226155a4838a6f58984410" }
synth = { path = "features/rigs/synth" }
# signal-core: the one processor every host runs (signal#26), compiled into
# Studio's engine and wrapped as the Signal CLAP (apps/plugins/signal).
signal-core = { path = "features/core", default-features = false }
# The blocks signal-core is built from: the plugins' effects, headless
# (FastTrackStudios/plugins `plugin-processors`), on FastTrackStudios/dsp
# (studio#683, daw#50). dsp-core directly for its numeric helpers, at the
# rev plugins pins. Renamed: the rest of the tree still takes crates of the
# same names from fts-fx at the rev above.
plugin-processors = { git = "https://github.com/FastTrackStudios/plugins", rev = "679cbfc2a181a93dd454ab48b865210de32a25b8", default-features = false }
signal-dsp-core = { package = "dsp-core", git = "https://github.com/FastTrackStudios/dsp", rev = "75d475b01e96eed4a5ddad8ad6799396f220dd82", default-features = false }
# Float maths without `std`, for signal-core's `no_std` code.
libm = { version = "0.2", default-features = false }
sampler = { path = "features/sampler" }
guitar = { path = "features/rigs/guitar" }
dsp-core = { git = "https://github.com/FastTrackStudios/fts-fx", rev = "5bae622f5d874ce58ab04916ab29a8100e883012" }
keys = { path = "features/rigs/keys" }
drums = { path = "features/rigs/drums" }
# NI Komplete Kontrol keyboard driver (Light Guide / per-key RGB LEDs): the
# drum rig mirrors its kit onto the keybed.
kontrol = { path = "features/rigs/kontrol" }
dsp = { git = "https://github.com/FastTrackStudios/fts-fx", rev = "5bae622f5d874ce58ab04916ab29a8100e883012" }
# Razor edit areas: a rectangle of time by row, and the set algebra over
# it. Dependency-free and shared by the expression editor and the
# arrangement, so the two cannot disagree about what an area is.
# ── Internal — every moved crate, path declared ONCE here ─────────────
# These two moved from `daw` to `processor` on the September 2026 FX
# split and have diverged since — `../daw` still carries an older copy,
# and taking that one puts two different `fts-audio-ui v0.1.0` in one
# lockfile, which cargo refuses outright.
# nice-plug lives in its own fork repo (upstream RustAudio/nice-plug's
# baseview-03 branch + the FTS delta: nice-plug-dioxus, embedded editors,
# rich track-info, param rescan). The ONE sanctioned exception to
# path-deps-only — it left the tree so it can track upstream.
nice-plug = { git = "https://github.com/FastTrackStudios/nice-plug.git", branch = "fts-baseview-03" }
nice-plug-dioxus = { git = "https://github.com/FastTrackStudios/nice-plug.git", branch = "fts-baseview-03" }
nice-plug-xtask = { git = "https://github.com/FastTrackStudios/nice-plug.git", branch = "fts-baseview-03" }
# The grid that follows the zoom. Pure arithmetic and no dependencies, so
# the arrange view and the expression editor can agree on it without
# either depending on the other.
# Pinned to a commit, not a tag: v0.1.2 needs valverig-nam =0.0.1, which is
# gone from crates.io, so no lockfile change resolves. bd6a156e is PR #3
# (fix/valverig-nam-0.0.2, valverig-nam =0.0.2, nothing else); back to a
# tag (v0.1.3) once it merges.
neural-amp-modeler = { git = "https://github.com/FastTrackStudios/neural-amp-modeler-rs", rev = "bd6a156e5280d9ba30a8f50f5d39b0310feb8780" }

# ── The base and the engine, from the daw repo ────────────────────────
# (FastTrackStudios/daw: the eleven crates that depend on nothing else in
# Studio, then the engine that plays a session, moved there with their
# history; studio#510.) One revision for all of them, so they move
# together; a tag once that repo cuts one. Its
# root manifest declares the same versions, git pins and patches as this
# one: bump a pin there and here together, or Cargo.lock grows a second
# copy. Working on both at once: AGENTS.md, "Co-developing across repos".
daw-proto = { git = "https://github.com/FastTrackStudios/daw", rev = "86263731dfd07e3ef69cfdce923901ce9894905e" }
utils = { git = "https://github.com/FastTrackStudios/daw", rev = "86263731dfd07e3ef69cfdce923901ce9894905e" }
midi = { git = "https://github.com/FastTrackStudios/daw", rev = "86263731dfd07e3ef69cfdce923901ce9894905e" }
audio = { git = "https://github.com/FastTrackStudios/daw", rev = "86263731dfd07e3ef69cfdce923901ce9894905e" }
# Defaults OFF at the root so lean consumers (probe-only scanners, the
# iOS-clean session-guide) don't drag the pack engine in; each consumer
# names the features it needs ("load" / "write" / "engine").
fts-sample = { git = "https://github.com/FastTrackStudios/daw", rev = "86263731dfd07e3ef69cfdce923901ce9894905e", default-features = false }
# The engine: `daw` is the facade (its engine is opt-in, `standalone`),
# `daw-standalone` the engine, `session-format` the session document,
# `dawfile-reaper` the `.rpp` reader the engine loads and saves with,
# `signal-plugin-host` CLAP/VST3 hosting, `builtin` the effects as engine
# blocks, `daw-sync` DAWs kept in step (network, Ableton Link). The engine
# takes the effects from fts-fx at the rev above.
daw = { git = "https://github.com/FastTrackStudios/daw", rev = "86263731dfd07e3ef69cfdce923901ce9894905e" }
daw-standalone = { git = "https://github.com/FastTrackStudios/daw", rev = "86263731dfd07e3ef69cfdce923901ce9894905e" }
session-format = { git = "https://github.com/FastTrackStudios/daw", rev = "86263731dfd07e3ef69cfdce923901ce9894905e" }
signal-plugin-host = { git = "https://github.com/FastTrackStudios/daw", rev = "86263731dfd07e3ef69cfdce923901ce9894905e", default-features = false }
builtin = { git = "https://github.com/FastTrackStudios/daw", rev = "86263731dfd07e3ef69cfdce923901ce9894905e" }

keyflow-lang = { git = "https://github.com/FastTrackStudios/keyflow", tag = "v0.5.4", default-features = false }
keyflow-annotate = { git = "https://github.com/FastTrackStudios/keyflow", tag = "v0.5.4" }

# ── Facet reflection + vox RPC — the rc.5 fleet pins ──────────────────
facet = { version = "0.50.0-rc.5", features = ["reflect", "chrono", "uuid"] }
facet-json = { version = "0.50.0-rc.7" }
facet-styx = { version = "5.0.0-rc.7" }
facet-toml = { version = "0.50.0-rc.5" }
vox = { version = "0.10.0-rc.5", default-features = false, features = ["runtime"] }
vox-types = { version = "0.10.0-rc.5" }
vox-core = { version = "0.10.0-rc.5" }
vox-websocket = { version = "0.10.0-rc.5" }
blake3 = { version = "1.8" }

# ── Architect framework — its own repo since the 2026-08 three-way split
# (FastTrackStudios/architect: the entity/RPC framework, the auth/crdt/
# permissions stack, architect-ui + architect-story, architect-telemetry).
# One tag pin shared by every entry so the whole framework moves together.
architect = { git = "https://github.com/FastTrackStudios/architect", tag = "v0.12.6" }
architect-mcp = { git = "https://github.com/FastTrackStudios/architect", tag = "v0.12.6" }
# auth-client (`auth_client::device`, sign-in from another device) is on
# the same tag as the rest: one architect source per Cargo.lock.
auth-client = { git = "https://github.com/FastTrackStudios/architect", tag = "v0.12.6" }
# The Dioxus primitive library (was libs/ui/fts-ui, renamed on the split).
architect-ui = { git = "https://github.com/FastTrackStudios/architect", tag = "v0.12.6" }
# Wide-events telemetry (was crates/task/telemetry).
architect-telemetry = { git = "https://github.com/FastTrackStudios/architect", tag = "v0.12.6" }

# Architect's externals, merged from its dissolved workspace table
# (root pins win — both were already on the rc.5 fleet).
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
async-trait = "0.1"
loro = { version = "1.12", default-features = false }
base64 = "0.22.1"
rand = "0.8"
sha2 = "0.10"

# ── UI framework ──────────────────────────────────────────────────────
# dioxus 0.8 line — git rev pinned: DioxusLabs/dioxus main 430cfb56
# (0.8.0-alpha.3), architect v0.12.6's. Bump it deliberately and in
# lockstep across every dioxus-* entry below AND the FTS fork tags of
# primitives/lumen/lucide/sdk, which pin the same rev.
dioxus = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41", default-features = false, features = ["lib"] }
# Blitz native renderer — dioxus-native(-dom) moved into the dioxus repo
# on the 0.8 line; blitz-* are `=0.3.0-beta.4`, matching dioxus git's
# own pins, patched below to the FTS blitz fork. Feature union of the
# wave-1 UI libs (prelude, system-fonts) and reaper-dioxus (svg,
# autofocus, data-uri theme-skin PNGs).
# `vello` — the compute-shader renderer — because dioxus-native's own
# default is `vello-hybrid`, which does much of its path work on the CPU.
# Hybrid exists for WebGL-class targets; on a desktop GPU it is what
# stands between the expression editor and its frame budget (35 fps at
# 5120x1440 with five notes on screen, where the whole scene was 69 draw
# commands and 0.04 ms to build — the cost was all in rasterising it).
#
# Both features can be on at once: the renderer is chosen by a `cfg_if`
# chain that tests `vello` first, so this wins over the default without
# having to turn defaults off and re-list them.
# `default-features = false` with every default re-listed, so that this
# list is the whole truth: dropping a feature from a `features = [...]`
# while defaults are on does NOTHING, which cost a day of chasing
# `incremental` that was never actually off.
#
# `incremental` is gone: dioxus-native has no such feature on the 0.8
# line (architect#211).
# The vendored copy (see its UPSTREAM.md) by path, not the git URL the
# [patch] below redirects: a member's dep on a patched git crate leaves
# nothing in the lockfile to match it, so cargo re-queries the git source
# — which a vendored, offline build (nix, crane) refuses. daw's crates
# still name the git URL; the patch covers them.
dioxus-native = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1", default-features = false, features = ["prelude", "system-fonts", "svg", "autofocus", "data-uri", "vello", "accessibility", "hot-reload", "net", "html", "clipboard", "file-dialog", "vello-hybrid", "woff", "apple-font-embolden"] }
# The `hit_inner` panic this comment used to chase (a pointer event
# hit-testing a node removed before the next resolve) is what Blitz's
# versioned `NodeId` (upstream #1244) answers: a stale id now misses.
blitz-dom = "=0.3.0-beta.4"
blitz-paint = "=0.3.0-beta.4"
blitz-traits = "=0.3.0-beta.4"
dioxus-native-dom = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41" }
# FTS fork tags carrying the dioxus-0.8 bumps until upstream moves (the
# tags architect v0.12.6 pins).
lumen-blocks = { git = "https://github.com/FastTrackStudios/lumen-blocks", tag = "v0.3.1" }

# ── GPU rendering stack (reaper-embed / reaper-dioxus) ────────
# One stack for the whole tree, the one architect v0.12.6's Blitz tag
# (`fts-upstream-2026-11`) builds on: vello 0.11 / wgpu 30, anyrender 0.14
# (from the blitz tag, patched below) with anyrender_vello 0.15 and
# anyrender_vello_hybrid 0.11 (vendor v0.7.0), parley 0.12. frame and
# nice-plug-dioxus are on it too, so a texture a host renderer hands over
# (`wgpu_context::DeviceHandle`) is the type every painter downcasts to.
wgpu = { version = "30", features = ["wgsl"] }
vello = { version = "0.11", features = ["wgpu"] }
anyrender_vello = "0.15"
anyrender = "0.14"
anyrender_vello_hybrid = "0.11"
# vello_hybrid's successor; anyrender_vello_hybrid 0.11 paints into its
# Scene (the browser's WebGL2 path).
vello_gpu = "0.3"
kurbo = "0.13"
# Text shaping for the painted expression-editor roll. Same version blitz
# shapes DOM text with, so a label drawn into a scene and a label drawn
# by the DOM come out of the same shaper.
parley = "0.12"

# ── Async runtime ─────────────────────────────────────────────────────
tokio = { version = "1.48", features = ["full"] }
futures = "0.3"

# ── Serialization ─────────────────────────────────────────────────────
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-traits = "0.2"
thiserror = "2.0"

# ── Observability ─────────────────────────────────────────────────────
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

proptest = "1"
tempfile = "3.8"

realfft = "3.0"
crossbeam-channel = "0.5"
rayon = "1.12"

# ── Utilities ─────────────────────────────────────────────────────────
eyre = "0.6"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
# libusb bindings for the NI Komplete Kontrol Light Guide (USB bulk transfer,
# not MIDI). Bundles/builds libusb via its build script, so no system lib is
# required. Used only by the `kontrol` crate.
rusb = "0.9"
# HID (hidraw) access for the NI Komplete Kontrol Light Guide — the LEDs are
# HID output reports, not bulk USB. Bundles hidapi; coexists with usbhid.
hidapi = "2"
# Audio I/O host abstraction — the signal rigs run on cpal's native
# pipewire host (via daw-audio-io); the `pipewire`/`jack` backends are
# feature-gated per consumer.
cpal = "0.18"
# Unix process supervision: the desktop app spawns the signal engine as a
# child and must reap it (and its group) on exit — kill(pid,0) liveness probe
# (engine watchdog) + process-group teardown. See apps/desktop.
libc = "0.2"

walkdir = "2"
regex = "1"
web-sys = "0.3.98"
# Pinned exactly, and low: `dx build` refuses to run when the crate version
# and the wasm-bindgen-cli in the dev shell disagree, and the CLI comes from
# the pinned nixpkgs (nix/modules/dx.nix, nix/modules/shells/default.nix). A
# floating "0.2" silently resolves past the CLI and breaks every web build
# with "Incorrect wasm-bindgen-cli version". Bump this only together with
# that pin.
wasm-bindgen = "=0.2.127"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# ── from processor's workspace (joined into studio) ──
tone3000 = "0.1"
signal-nam = { path = "features/dsp/nam" }

# ── from signal's workspace (joined into studio) ──
signal = { path = "features/signal" }
signal-proto = { path = "features/signal/proto" }
signal-browser = { path = "features/signal/browser", default-features = false }
signal-grid = { path = "features/signal/grid" }
signal-grid-ui = { path = "features/signal/grid-ui" }
signal-controller = { path = "features/signal/controller" }
signal-live = { path = "features/signal/live" }
signal-storage = { path = "features/signal/storage" }
signal-import = { path = "features/signal/import" }
signal-daw-bridge = { path = "features/signal/daw-bridge" }
signal-rig-host = { path = "features/rigs/host" }
signal-rigs-proto = { path = "features/rigs/proto" }
signal-widgets = { path = "features/signal/widgets" }
signal-rig-shell = { path = "features/rigs/shell" }
signal-rig-perform-ui = { path = "features/rigs/perform-ui" }
signal-rig-perform-store = { path = "features/rigs/perform-store" }
signal-content-proto = { path = "features/signal/content-proto" }
signal-content-library = { path = "features/signal/content-library" }
signal-macromod = { path = "features/signal/macromod" }
openwurli-dsp = { path = "features/rigs/keys/wurli" }

arc-swap = "1.7"
bhtsne = "0.5"
bytemuck = "1"
dirs = "6"
flate2 = "1"
hound = "3.5"
midly = "0.5"
ratatui = "0.30"
rustc-hash = "2"
url = "2"
wiremock = "0.6"

# ── external dependencies, declared once (moved up from the member
# manifests; a member says `x = { workspace = true }` and adds its features) ──
naga = "30"
wasm-bindgen-test = "0.3"
wgpu_context = "0.10"

[patch.crates-io]
# tone3000 on reqwest 0.12's ring-backed rustls instead of 0.13's `rustls`,
# whose only backend is aws-lc-rs: aws-lc-sys's build script (a cmake C
# build) was 186 s of a 375 s clean `cargo check --workspace`, all of it on
# the critical path. tone3000 was the only crate in the graph asking for it.
# See vendor/tone3000/FTS-PATCH.md; drop it once upstream lets a consumer
# pick the TLS backend.
tone3000 = { path = "vendor/tone3000" }
# Vendored one-line fix: parse_schema_bytes rejected every real schema
# exchange with "schema decode consumed N of M bytes" — it compared
# phon_schema::schema_from_bytes's owned-allocation byte count (added in
# 0.2.0-rc.6) against the encoded slice length, two unrelated numbers.
# schema_from_bytes already guarantees full-slice consumption internally.
# Surfaced by daw's architect v0.7.1 bump (which pulls vox). Drop the
# vendor once upstream removes/fixes the check. See vendor's README.
vox-phon = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.3.0" }
# baseview from the FTS fork (upstream v0.3 + one fix): the macOS frame timer
# is registered in kCFRunLoopCommonModes rather than kCFRunLoopDefaultMode.
# AppKit runs the run loop modally for the whole of a live window resize, so a
# default-mode timer stops firing mid-drag — the editor's on_frame is frozen,
# nothing relayouts, and AppKit stretches the stale surface until the mouse
# comes up. Still present upstream at 0.3.1.
#
# Pinned by rev: this is a plugin-editor dependency, and a moving branch would
# let a window-system change land in a released plugin without a bump.
#
# Superseded: baseview 0.3.3 with the same one-line fix now lives in
# FastTrackStudios/vendor (baseview/FTS-PATCH.md), pinned like the other
# forks there. nice-plug-dioxus at `fts-baseview-03` is written against
# 0.3.3 — `host_main_thread_callback` takes `&Self::Window` there — and
# does not compile against 0.3.0.
baseview = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.6.1" }
# pipewire-rs one commit past its v0.10.0 release. PipeWire 1.6 rewrote
# constants like SPA_ID_INVALID from a bare `0xffffffff` into a cast form,
# `((uint32_t)0xffffffff)`, which bindgen's own macro evaluator cannot fold —
# it needs the clang fallback, which 0.10.0 asks for but never gives a
# writable build dir, so the fallback silently produces nothing and the
# constants vanish from the generated bindings. The result is
# `error[E0425]: cannot find value SPA_ID_INVALID in crate spa_sys` in
# libspa, which takes out everything downstream of daw-audio-io (patchbay,
# signal-sampler, and with it the FTS Signal plugin). Upstream commit
# 9b54509 "sys: Set clang macro fallback build dir to OUT_DIR" is the fix;
# drop this patch when a release carrying it lands on crates.io.
libspa-sys = { git = "https://gitlab.freedesktop.org/pipewire/pipewire-rs.git", rev = "9b54509e848e53ffa971ace15d7adf4908c09358" }
pipewire-sys = { git = "https://gitlab.freedesktop.org/pipewire/pipewire-rs.git", rev = "9b54509e848e53ffa971ace15d7adf4908c09358" }
# Blitz from the FTS fork, at the revision architect v0.12.6 pins (past the
# `fts-upstream-2026-11` tag; the `www.` host so it is the same source as
# architect's workspace-hack, which names it directly): DioxusLabs/blitz
# main (0.3.0-beta.4) with the FTS work rebased on top — focus follows
# pointerdown for all focusable content (the editor's tabindex div),
# touch as pointer events, the iOS safe area and pacing, layered
# compositing of texture widgets, a press/release click target (a knob
# let go over a footswitch does not press it, studio#178), a pointer held
# outside the window keeps its target (studio#141, nice-plug-dioxus stops
# clamping to match), the measure fix. Upstream's versioned `NodeId` and
# `Node::final_layout()` replace the stale-id patches this tree carried.
# The fork's FTS.md lists where it departs from upstream (architect#211
# has the full kept/dropped table). One revision across all blitz crates,
# and anyrender from the same one.
blitz-dom = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
blitz-traits = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
blitz-paint = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
blitz-shell = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
blitz-net = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
blitz-html = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
# The fork's anyrender (0.14), carried in the blitz repo at the same tag:
# the compositor's `composite` module and `RenderContext::render`, which
# the processor's painted visualisers and the vendored anyrender_vello use.
anyrender = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
# From the vendor repo (a sibling checkout path would build on one machine
# and nowhere else). Three
# measured changes to the present path — the GPU barrier removed, frame
# latency 1 instead of 2, a switchable present mode — each reversible
# from the environment. See anyrender_vello/UPSTREAM.md in FastTrackStudios/vendor.
anyrender_vello = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }
# Vendored one-line fix, for the iOS simulator (the one place this
# renderer runs): a resize that arrives before the renderer is ready left
# the surface at its first size. See
# anyrender_vello_hybrid/UPSTREAM.md in FastTrackStudios/vendor.
anyrender_vello_hybrid = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }
# The three forks below sat in [workspace.dependencies] after the October
# merge, where nothing consumed them, so their fixes silently stopped
# applying; they are patches. Each carries its UPSTREAM.md/FTS-PATCH.md in
# the vendor repo.
# A tap that came while a frame was drawn is handled at once, not when the
# next touch arrives (the proxy wake-up never drained winit's event queue).
winit-uikit = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }
# The iOS Simulator has indirect draw/dispatch, so full Vello runs there.
wgpu-hal = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }
# No explicit ObjC class name: each plugin bundle links its own copy, and a
# second plugin registering the same name crashed the host.
raw-window-metal = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }
# Vendored one-line fix: quote scalars containing `<`/`>` — upstream
# (facet-rs/facet) styx-format emits them bare but styx-parse rejects
# them, so serialized keybind configs (`keys "<C-s>"`) could not be
# re-parsed. Drop the vendor once upstream fixes can_be_bare.
styx-format = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.1.0" }
# Vendored phon rc.7 + derive support for parse/display opaque scalars
# (Uuid, chrono DateTime/NaiveDate, url, …). Upstream (rc.5 through rc.7)
# PANICS (and the reply path aborts the process) the first time a vox RPC
# reply contains such a field — every task-server list/stats call died.
# Drop the vendor once upstream phon derives these scalars.
#
# (This entry used to point at vendor v0.1.0, which is phon rc.5: against
# this repo's rc.7 graph cargo filed it under [patch.unused] and quietly
# used unpatched upstream rc.7.)
#
# The rc.7 forward-ports, as is facet-core's below: vendor v0.4.1.
phon = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.4.1" }
# Vendored facet-core rc.7 with one change: chrono's display fns keep
# sub-second precision. chrono types are opaque scalars whose only encode
# path is `display`, so upstream's `SecondsFormat::Secs` rounded EVERY
# timestamp on every vox RPC to the second — and anything ordered by one
# could invert when two events shared a second.
facet-core = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.4.1" }
# Vendored phon-jit rc.5 with a one-line build.rs fix: force the stable,
# call-based stencils. Upstream's nightly detection can be true while no real
# nightly is present (the pinned nix toolchain), so it compiled the `become`
# (explicit tail calls) stencils on stable rustc 1.94 → E0658, breaking the
# macOS-aarch64 build. Drop the vendor once phon-jit builds on stable.
phon-jit = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.2.3" }
# mermaid-rs-renderer's patch died 2026-09: task moved it out again, into
# its own `editor` repo (consumed there as `editor-mermaid`, tag v0.0.3) —
# it now arrives as an ordinary transitive dep of `editor`/`editor-keyflow`,
# same as task's own [patch] table no longer needs to redirect it either.

# ── Lints — merged union of the dissolved workspaces' policies ─────────
[workspace.lints.rust]
# Flipped from "allow" 2026-07-28 (task cleanup): the blanket allows are
# WHY ~30k lines of dead code accumulated silently. The task tree is
# warning-clean under these; legacy crates in other domains carry a
# crate-level `#![allow(dead_code, unused)]` marked "Lint debt" until
# their own burn-down.
dead_code = "warn"
unused = "warn"
unused_unsafe = "warn"
# architect's attribute macros (`#[architect::error]`, `wire`, `entity`)
# emit `#[cfg_attr(feature = "fake", ...)]` into the calling crate; declare
# the name so those crates don't warn. Same line as architect's own
# workspace.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("fake"))'] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "allow"
private_intra_doc_links = "allow"
redundant_explicit_links = "allow"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Deny panics — crash-prevention lints (namtao.com/rust)
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

# ── Dev profile (carried from the dissolved signal workspace) ──────────
# The live rig runs from `session-desktop --engine` (formerly fasttrackstudio --engine, formerly signal-engine/signal-rigd): the vendored NAM C++
# core and the DSP crates are unusable at opt-level 0 (~10-50x slower,
# xruns), so dependencies build at release opt in dev while the thin
# app/UI workspace crates stay at light opt for fast rebuilds.
[profile.dev]
opt-level = 1

# Debuginfo discipline. Full DWARF was the single biggest cost in this
# tree: a `debug` test binary measured 1.62 GB, of which 1.59 GB (98%)
# was `.debug_*` sections — and the default linker copies all of it into
# every binary, every relink. Across ~6 worktrees that was ~1 TB of
# target/ and minutes of link time per build.
#
#   line-tables-only  keeps file:line in backtraces + profiler symbols
#                     (samply/perf still work); drops variable/type DWARF,
#                     so a *debugger* can't inspect locals.
#   unpacked          leaves the remaining DWARF in the .o files under
#                     deps/ instead of copying it into each artifact, so
#                     linking stops moving gigabytes around.
#
# Need a real debugger session? Build with `--profile dev-dbg` (below) —
# same codegen, full DWARF, and it uses a separate target dir so it never
# invalidates the fast dev artifacts.
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Escape hatch: full DWARF for stepping in gdb/lldb. Everything else is
# identical to dev, so package opt-level overrides below still apply.
# `release-fast`: the release build you run while working on it — the
# app, `blitz_shot`, `prepare`. Release's optimisation (the renderer and
# the audio thread need it; a dev build of the app is too slow to use),
# but INCREMENTAL, with many codegen units, so an edit recompiles the
# pieces of a crate that changed instead of the whole crate at O3 from
# scratch. `--release` stays the profile for shipping (and for measuring
# performance: 256 units inline a little less than 16).
#
#   cargo build --profile release-fast -p session-desktop
#
# Measured on this tree: see the `build-performance` skill.
[profile.release-fast]
inherits = "release"
incremental = true
codegen-units = 256

# The browser's app (`session-daw-web`): one module every visitor
# downloads and compiles, so its size is paid on every first visit.
# Whole-program LTO in one codegen unit lets LLVM drop what no path from
# `main` reaches across crate boundaries, and `s` stops it trading size
# for speed where speed does not matter (the UI, the parsers, the RPC).
# Measured after wasm-opt -Oz (Sep 2026): release 27.6 MB (6.65 MB
# brotli) → this 20.8 MB (5.55 MB).
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"

# Except the audio path — decode and mix run on the page's main thread
# into an AudioWorklet, twenty-odd stems in real time — which stays at
# full speed. These overrides do hold under fat LTO: without them the
# module is 0.2 MB smaller, which is what they cost.
[profile.wasm-release.package.daw-standalone]
opt-level = 3
[profile.wasm-release.package.fts-sample]
opt-level = 3
[profile.wasm-release.package.symphonia-core]
opt-level = 3
[profile.wasm-release.package.symphonia-format-ogg]
opt-level = 3
[profile.wasm-release.package.symphonia-codec-vorbis]
opt-level = 3

# dx's own profile: `dx serve` builds the window as `desktop-dev` with an
# explicit `--target`, so its artifacts land in
# target/<host>/desktop-dev. The dev loop builds the engine and the tests the
# same way (scripts/dev-herdr.sh, `just dev-test`) so all three share one set
# of compiled crates. Declared here so cargo knows it outside dx; it is the
# dev profile, nothing else.
[profile.desktop-dev]
inherits = "dev"

[profile.dev-dbg]
inherits = "dev"
debug = 2
split-debuginfo = "packed"
# Full DWARF for dependencies too in the debugger profile (dev turns it
# off for them).
[profile.dev-dbg.package."*"]
debug = 2

# dx web builds: native debuginfo in the wasm module blew past
# Chrome's 1 GiB WebAssembly module cap (1.14 GB observed). Wasm dev
# builds don't need it — strip it and dev bundles come back to a
# loadable size.
[profile.wasm-dev]
inherits = "dev"
debug = false
strip = "debuginfo"

# The in-browser setlist player renders daw-standalone's full graph in wasm —
# mirror the dev-profile audio-path opt overrides here explicitly (package
# overrides may not carry through `inherits`), so dx dev bundles mix ~20
# stems in realtime instead of grinding the main thread.
[profile.wasm-dev.package."*"]
opt-level = 3
[profile.wasm-dev.package.daw-standalone]
opt-level = 3

# Dependencies. Was 3 across the board, which meant paying full LLVM
# optimization on ~1500 registry crates for every cold build / new
# worktree. Dropped to 1: still gets rid of the pathological O0 debug
# codegen, at a fraction of the compile cost. The crates that actually
# run on the audio thread are exempted below — this override applies to
# dependencies only, so workspace members are governed by profile.dev's
# base opt-level and the explicit list further down.
[profile.dev.package."*"]
opt-level = 1
# No debuginfo for third-party dependencies (the Captain's call,
# 2026-10-21): a backtrace through a registry crate still names the
# function, and our own crates keep `line-tables-only` (above). Smaller
# target/ dirs and faster links on every runner and worktree.
debug = false

# Audio-thread dependencies, kept at 3. `package."*"` above would
# otherwise drop these to 1, and a dev run of the rig would start
# xrunning. Sourced from `cargo tree` over audiocore-dsp /
# daw-audio-graph / signal-sampler / neural-amp-modeler / dsp (the
# effects), keeping the crates that do real per-sample or per-block
# work (resampling, decode, FFT, sample-pack decompression, JIT).
#
# If a dev run ever xruns on a path not covered here: run it --release
# (the launch paths already do), or add the crate to this list.
[profile.dev.package.rubato]
opt-level = 3
[profile.dev.package.fixed-resample]
opt-level = 3
[profile.dev.package.fast-interleave]
opt-level = 3
[profile.dev.package.dasp_frame]
opt-level = 3
[profile.dev.package.dasp_sample]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.transpose]
opt-level = 3
[profile.dev.package.strength_reduce]
opt-level = 3
[profile.dev.package.primal-check]
opt-level = 3
[profile.dev.package.num-complex]
opt-level = 3
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3
[profile.dev.package.symphonia-codec-pcm]
opt-level = 3
[profile.dev.package.symphonia-codec-aac]
opt-level = 3
[profile.dev.package.symphonia-format-riff]
opt-level = 3
# Sample-pack streaming: packs are zstd-framed, so decompression is on
# the voice-start path, and blake3 hashes pack content on load.
[profile.dev.package.zstd-safe]
opt-level = 3
[profile.dev.package.zstd-sys]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
# phon's JIT engine — generates and runs the DSP graph itself.
[profile.dev.package.phon]
opt-level = 3
[profile.dev.package.phon-engine]
opt-level = 3
[profile.dev.package.phon-jit]
opt-level = 3

# Build scripts + proc macros and their deps. `package."*"` does NOT cover
# these — cargo routes them through build-override, where they were landing
# at opt-level 0 with full debuginfo. This tree leans hard on derive macros
# (facet, architect, dioxus rsx), so the macros are *executed* thousands of
# times per build: paying O3 once to compile syn/quote wins that back many
# times over, and build scripts have no use for DWARF.
[profile.dev.build-override]
opt-level = 3
debug = false

# `package."*"` covers DEPENDENCIES only — workspace members stay at the
# base opt-level. The audio path is ours, so the hot crates get full opt
# even in dev builds: a debug rig must never xrun. (Launch paths default
# to --release regardless; this is the safety net for dev runs.)
[profile.dev.package.dsp-core]
opt-level = 3
[profile.dev.package.audio]
opt-level = 3
[profile.dev.package.daw-standalone]
opt-level = 3
[profile.dev.package.neural-amp-modeler]
opt-level = 3
# neural-amp-modeler's engine since v0.1.2: the NAM forward pass, in the
# audio callback.
[profile.dev.package.valverig-nam]
opt-level = 3
# The effects (features/dsp: eq, comp, reverb, delay, pitch, trigger, …
# were crates of their own, each listed here).
[profile.dev.package.dsp]
opt-level = 3

# Preserve audio sources on newly split items until the upstream exporter is fixed.
# The Dioxus crates from the FTS vendor fork, the tag task and keyflow
