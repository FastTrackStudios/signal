[patch."https://github.com/DioxusLabs/dioxus"]
dioxus-native = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }
dioxus-native-dom = { git = "https://www.github.com/FastTrackStudios/vendor", rev = "25bf4bcdfd0b6acb268ca91a93bc8ff8da683a96" }
dioxus-vdom = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }

# keyflow (a git dependency) still takes daw and fts-sample from the daw
# repo's old tag v0.0.7. This table hands it the copies Studio builds, so
# there is one of each. A [patch] may not point back at the source it
# patches, so it names Studio's revision on the `www.` host (a different
# source to cargo, the same repo; the trick the editor table below uses).
