# signal — one root workspace.
#
# Split out of the FastTrackStudio monorepo (see docs/split/PLAN.md
# there). Intra-repo dependencies are path deps in the table below;
# cross-repo dependencies are git deps pinned to a tag.

[workspace]
resolver = "3"

members = [
    "apps/desktop",
    "apps/web",
    "apps/fts-convert",
    "apps/plugins/comp",
    "apps/plugins/delay",
    "apps/plugins/eq",
    "apps/plugins/gate",
    "apps/plugins/guide",
    "apps/plugins/host",
    "apps/plugins/level",
    "apps/plugins/limiter",
    "apps/plugins/meter",
    "apps/plugins/modulation",
    "apps/plugins/nam",
    "apps/plugins/pitch",
    "apps/plugins/reverb",
    "apps/plugins/saturate",
    "apps/plugins/signal",
    "apps/plugins/trigger",
    "apps/plugins/tune",
    "apps/plugins/unison",
    "apps/plugins/xtask",
    "crates/signal/browser",
    "crates/signal/controller",
    "crates/signal/daw-bridge",
    "crates/signal/grid",
    "crates/signal/grid-ui",
    "crates/signal/import",
    "crates/signal/live",
    "crates/signal/proto",
    "crates/signal/rig-host",
    "crates/signal/rigs-proto",
    "crates/signal/signal",
    "crates/signal/space",
    "crates/signal/space/proto",
    "crates/signal/storage",
    "crates/signal/tone3000",
    "crates/signal/tone3000-proto",
    "crates/signal/tone3000-ui",
    "crates/signal/ui",
    "crates/signal/widgets",
    "features/analyzer/signal-analyzer",
    "features/separator/signal-separator",
    "features/preset-browser/preset-browser",
    "features/preset-browser/preset-browser-ui",
    "features/fx/comp/comp",
    "features/fx/comp/comp-dsp",
    "features/fx/comp/comp-profiles",
    "features/fx/comp/comp-ui",
    "features/fx/comp/limiter-ui",
    "features/fx/delay/delay",
    "features/fx/delay/delay-dsp",
    "features/fx/delay/delay-profiles",
    "features/fx/delay/delay-ui",
    "features/fx/eq/apps/eq-standalone",
    "features/fx/eq/eq",
    "features/fx/eq/eq-dsp",
    "features/fx/eq/eq-profiles",
    "features/fx/eq/eq-ui",
    "features/fx/eq/spectrum-analyzer/spectrum-analyzer",
    "features/fx/eq/spectrum-analyzer/spectrum-analyzer-dsp",
    "features/fx/eq/spectrum-analyzer/spectrum-analyzer-ui",
    "features/fx/hit-detect/hit-detect-dsp",
    "features/fx/level/level",
    "features/fx/macromod",
    "features/fx/modulation/chorus-dsp",
    "features/fx/modulation/modulation",
    "features/fx/modulation/modulation-profiles",
    "features/fx/modulation/modulation-ui",
    "features/fx/modulation/pattern-ui",
    "features/fx/modulation/trem-dsp",
    "features/fx/modulation/wah-dsp",
    "features/fx/multiband",
    "features/fx/pitch/pitch",
    "features/fx/reverb/reverb",
    "features/fx/reverb/reverb-dsp",
    "features/fx/reverb/reverb-profiles",
    "features/fx/reverb/reverb-ui",
    "features/fx/saturate/saturate",
    "features/fx/saturate/saturate-dsp",
    "features/fx/saturate/saturate-profiles",
    "features/fx/saturate/saturate-ui",
    "features/fx/signal-fx",
    "features/fx/stack",
    "features/fx/trigger/trigger",
    "features/fx/trigger/trigger-dsp",
    "features/fx/trigger/trigger-ui",
    "features/fx/tune/tune",
    "features/nam",
    "features/plugin-host",
    "features/reaper/signal-extension",
    "features/reaper/signal-reaper-controller",
    "features/rigs/bass",
    "features/rigs/bass/proto",
    "features/rigs/bass/ui",
    "features/rigs/drums",
    "features/rigs/drums/proto",
    "features/rigs/drums/ui",
    "features/rigs/ekit",
    "features/rigs/ekit/proto",
    "features/rigs/ekit/ui",
    "features/rigs/guitar",
    "features/rigs/guitar/proto",
    "features/rigs/guitar/ui",
    "features/rigs/keys",
    "features/rigs/keys/proto",
    "features/rigs/keys/ui",
    "features/rigs/keys/worklet",
    "features/rigs/orchestra",
    "features/rigs/synth",
    "features/rigs/synth/proto",
    "features/rigs/synth/rig",
    "features/rigs/synth/ui",
    "features/rigs/wurli/openwurli-dsp",
    "features/sampler/pack-library",
    "features/sampler/packs-proto",
    "features/sampler/signal-sampler",
    "features/sampler/signal-sampler-clap",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
authors = ["FastTrack Studio"]
license = "GPL-3.0-or-later"
repository = "https://github.com/FastTrackStudios/signal"

[workspace.dependencies]
# ── Internal — every moved crate, path declared ONCE here ─────────────
fts-chrome = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
fts-audio-ui = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
fts-plug-ui = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
dock-dioxus = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2", default-features = false }
dock-proto = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
# nice-plug lives in its own fork repo (upstream RustAudio/nice-plug's
# baseview-03 branch + the FTS delta: nice-plug-dioxus, embedded editors,
# rich track-info, param rescan). The ONE sanctioned exception to
# path-deps-only — it left the tree so it can track upstream.
nice-plug = { git = "https://github.com/FastTrackStudios/nice-plug.git", branch = "fts-baseview-03" }
nice-plug-dioxus = { git = "https://github.com/FastTrackStudios/nice-plug.git", branch = "fts-baseview-03" }
nice-plug-xtask = { git = "https://github.com/FastTrackStudios/nice-plug.git", branch = "fts-baseview-03" }
utils = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
# The grid that follows the zoom. Pure arithmetic and no dependencies, so
# the arrange view and the expression editor can agree on it without
# either depending on the other.
adaptive-grid = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
installer-core = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
engine-launcher = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
neural-amp-modeler = { git = "https://github.com/FastTrackStudios/neural-amp-modeler-rs", tag = "v0.1.0" }
# TONE3000 tone library — the wire client (upstream, MIT) and our wrapper
# around it (session + download into signal-library/nam/).
tone3000 = "0.1"
signal-tone3000 = { path = "crates/signal/tone3000" }
signal-tone3000-proto = { path = "crates/signal/tone3000-proto" }
signal-tone3000-ui = { path = "crates/signal/tone3000-ui" }
audiocore-core = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
audiocore-dsp = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2", default-features = false }
audiocore-gui = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
fts-modulation = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
# Defaults OFF at the root so lean consumers (probe-only scanners, the
# iOS-clean session-guide) don't drag the pack engine in; each consumer
# names the features it needs ("load" / "write" / "engine").
fts-sample = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2", default-features = false }
fts-themes = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
meter-dsp = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
meter-ui = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
# Canonical MIDI facade. Defaults OFF at the root: daw-proto re-exports
# `midicore::MidiEvent` and must not drag midicore's `vox` service traits
# (nor the `midir` feature — midicore-midir pins midir 0.10/alsa-sys 0.3,
# colliding with daw's midir 0.11/alsa-sys 0.4 via `links = "alsa"`).
# Consumers that want the vox surface set `features = ["vox"]` themselves.
midicore = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2", default-features = false }
midicore-proto = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
midicore-midir = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
midicore-ui = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
# NI Komplete Kontrol keyboard driver (Light Guide / per-key RGB LEDs).
kontrol = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
input-config-proto = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
arborium ={ version = "2.16.0", default-features = false }
arborium-theme = "2.16.0"
arborium-tree-sitter = "2.16.0"
ropey = "1.6"
input = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
input-dioxus = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
input-keybinds = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }

# ── daw domain (wave 2) ───────────────────────────────────────────────
# Facade crate — the only public API surface for the daw domain.
# daw-proto, daw-control, daw-standalone, dawfile-* are INTERNAL to the
# domain; consumers outside it go through the `daw` facade.
daw = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
daw-proto = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
daw-actions = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
daw-control = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
daw-module = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
fts-devtools = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
daw-test-macro = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
daw-audio-graph = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
daw-audio-io = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
# RT-aware allocator — offloads RT deallocation to background thread
daw-allocator = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
fts-audio-proto = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
audio-controls = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
daw-synchronization = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
daw-link = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
daw-network = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
daw-audio-sync = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
dawfile-aaf = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
dawfile-ableton = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
dawfile-dawproject = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
dawfile-logic = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
dawfile-protools = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
dawfile-reaper = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
dawfile-standalone = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
# default = all-formats; the daw facade opts into formats individually,
# so the root entry keeps defaults OFF and consumers that want every
# importer set `default-features = true`.
daw-reaper = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2", default-features = false }
daw-bridge = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
# Extension runtime — integrated REAPER extension helpers
daw-extension-runtime = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
daw-reaper-dioxus = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
daw-reaper-dioxus-ext = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
daw-reaper-embed = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
reaper-launcher = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
fts-icons = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
fts-themer = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2", default-features = false }
fts-themer-ui = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
reaper-config = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
reaper-kbd = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
reaper-hwnd = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
reaper-embed = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
reaper-dioxus = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
# default-features = false: `overlay-prewarm` allocates wgpu/Vello surfaces
# eagerly, which OOMs when loaded at REAPER plugin_main time. The only
# consumer (fts-extensions) wants it off; enable per-member if needed.
reaper-input = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2", default-features = false }
fts-launcher = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
daw-standalone = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
daw-csi = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
daw-ui = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2", default-features = false }
daw-theme = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
daw-theme-art = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2", default-features = false }
daw-theme-reaper = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }

# ── session domain (wave 3) ───────────────────────────────────────────
# `session` is the facade — the only public API surface for the session
# domain. session-proto is INTERNAL (session-ui and session-guide are the
# documented exceptions: Dioxus components / the guide engine).
session = { git = "https://github.com/FastTrackStudios/session", tag = "v0.0.2.4" }
session-proto = { git = "https://github.com/FastTrackStudios/session", tag = "v0.0.2.4" }
session-ui = { git = "https://github.com/FastTrackStudios/session", tag = "v0.0.2.4", default-features = false }
# Portable guide engine (click / count-in / section guide). Optional `tts`
# feature adds local Chatterbox TTS (its ort/chatterbox pins live in the
# crate's own manifest, not here).
session-guide = { git = "https://github.com/FastTrackStudios/session", tag = "v0.0.2.4" }
# Durable Song + Arrangement vault-folder schema (stored counterpart to
# session_proto::Song). Keyflow-agnostic: charts are stored as references
# (relative paths / attachment ids), never embedded keyflow::Chart types.
song = { git = "https://github.com/FastTrackStudios/session", tag = "v0.0.2.4" }

# ── keyflow domain (wave 3) ───────────────────────────────────────────
# `keyflow` and `engraver` are the facades; keyflow-proto/-text/-midi/
# -syntax/-live and engraver-proto are INTERNAL to the domain.
keyflow = { git = "https://github.com/FastTrackStudios/session", tag = "v0.0.2.4" }
keyflow-proto = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
keyflow-syntax = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
keyflow-text = { git = "https://github.com/FastTrackStudios/session", tag = "v0.0.2.4" }
keyflow-chordpro = { git = "https://github.com/FastTrackStudios/session", tag = "v0.0.2.4" }
keyflow-midi = { git = "https://github.com/FastTrackStudios/session", tag = "v0.0.2.4" }
keyflow-live = { git = "https://github.com/FastTrackStudios/session", tag = "v0.0.2.4" }
keyflow-musicxml = { git = "https://github.com/FastTrackStudios/session", tag = "v0.0.2.4" }
keyflow-musx = { git = "https://github.com/FastTrackStudios/session", tag = "v0.0.2.4" }
keyflow-annotate = { git = "https://github.com/FastTrackStudios/session", tag = "v0.0.2.4" }
keyflow-orchestra = { git = "https://github.com/FastTrackStudios/session", tag = "v0.0.2.4" }
keyflow-sync = { git = "https://github.com/FastTrackStudios/session", tag = "v0.0.2.4" }
keyflow-daw-analysis = { git = "https://github.com/FastTrackStudios/session", tag = "v0.0.2.4" }
keyflow-ui = { git = "https://github.com/FastTrackStudios/session", tag = "v0.0.2.4" }
keyflow-cli = { git = "https://github.com/FastTrackStudios/session", tag = "v0.0.2.4" }
tree-sitter-keyflow = { git = "https://github.com/FastTrackStudios/session", tag = "v0.0.2.4" }
# Engraver — defaults OFF at the root (the full `engraver` feature drags
# wgpu/vello + PDF export); consumers opt into `svg`/`wgpu`/`engraver`.
engraver = { git = "https://github.com/FastTrackStudios/session", tag = "v0.0.2.4", default-features = false }
engraver-proto = { git = "https://github.com/FastTrackStudios/session", tag = "v0.0.2.4", default-features = false }
engraver-score = { git = "https://github.com/FastTrackStudios/session", tag = "v0.0.2.4" }

# ── signal domain (wave 4) ────────────────────────────────────────────
# `signal` is the facade — the only public API surface for the signal
# domain. Apps depend on `signal`, `signal-ui`, or `signal-sampler`;
# never on the internal domain crates (proto/live/storage/controller/
# import/daw-bridge/nam-manager).
signal = { path = "crates/signal/signal" }
signal-proto = { path = "crates/signal/proto" }
signal-ui = { path = "crates/signal/ui", default-features = false }
# `default-features = false` must be declared here, not just at the use
# site: cargo ignores a member's `default-features = false` on a
# workspace dependency unless the workspace entry sets it too. Consumers
# that need the filesystem scanner opt in with `features = ["native"]`.
signal-browser = { path = "crates/signal/browser", default-features = false }
signal-space = { path = "crates/signal/space" }
signal-space-proto = { path = "crates/signal/space/proto" }
signal-ekit = { path = "features/rigs/ekit" }
signal-ekit-proto = { path = "features/rigs/ekit/proto" }
signal-ekit-ui = { path = "features/rigs/ekit/ui" }
signal-grid = { path = "crates/signal/grid" }
signal-grid-ui = { path = "crates/signal/grid-ui" }
signal-controller = { path = "crates/signal/controller" }
signal-live = { path = "crates/signal/live" }
signal-storage = { path = "crates/signal/storage" }
signal-import = { path = "crates/signal/import" }
fts-convert = { path = "apps/fts-convert" }
signal-web = { path = "apps/web" }
signal-daw-bridge = { path = "crates/signal/daw-bridge" }
signal-rig-host = { path = "crates/signal/rig-host" }
signal-rigs-proto = { path = "crates/signal/rigs-proto" }
signal-widgets = { path = "crates/signal/widgets" }
signal-nam = { path = "features/nam" }
signal-extension = { path = "features/reaper/signal-extension" }
signal-macromod = { path = "features/fx/macromod" }
signal-plugin-host = { path = "features/plugin-host", default-features = false }
signal-sampler = { path = "features/sampler/signal-sampler" }
signal-packs-proto = { path = "features/sampler/packs-proto" }
signal-pack-library = { path = "features/sampler/pack-library" }
signal-bass = { path = "features/rigs/bass" }
signal-bass-proto = { path = "features/rigs/bass/proto" }
signal-bass-ui = { path = "features/rigs/bass/ui" }
signal-guitar = { path = "features/rigs/guitar" }
signal-guitar-proto = { path = "features/rigs/guitar/proto" }
signal-guitar-ui = { path = "features/rigs/guitar/ui" }
signal-keys = { path = "features/rigs/keys" }
signal-keys-proto = { path = "features/rigs/keys/proto" }
signal-keys-ui = { path = "features/rigs/keys/ui" }
signal-keys-worklet = { path = "features/rigs/keys/worklet" }
openwurli-dsp = { path = "features/rigs/wurli/openwurli-dsp" }
signal-orchestra = { path = "features/rigs/orchestra" }
signal-drums = { path = "features/rigs/drums" }
signal-drums-proto = { path = "features/rigs/drums/proto" }
signal-drums-ui = { path = "features/rigs/drums/ui" }
signal-synth = { path = "features/rigs/synth" }
signal-synth-proto = { path = "features/rigs/synth/proto" }
signal-synth-ui = { path = "features/rigs/synth/ui" }
signal-synth-rig = { path = "features/rigs/synth/rig" }

# ── features/fx — built-in FX (wave 4) ────────────────────────────────
# Facade crates — the public FX deps (downstream uses these, not `*-dsp`).
saturate = { path = "features/fx/saturate/saturate" }
saturate-dsp = { path = "features/fx/saturate/saturate-dsp" }
saturate-profiles = { path = "features/fx/saturate/saturate-profiles" }
saturate-ui = { path = "features/fx/saturate/saturate-ui" }
trigger = { path = "features/fx/trigger/trigger" }
trigger-dsp = { path = "features/fx/trigger/trigger-dsp" }
hit-detect-dsp = { path = "features/fx/hit-detect/hit-detect-dsp" }
# The trigger plugin editor. Core (waveform/threshold SVG math) is portable;
# the nice-plug/Blitz editor is behind its `native` feature.
