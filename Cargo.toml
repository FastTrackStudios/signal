# ── Patches ───────────────────────────────────────────────────────────
# NOTE: the old daw.git patch table is gone — dynamic-template (the only
# thing that still referenced the dead daw.git repo) is subtree-imported at
# features/dynamic-template/ and consumes the in-tree daw crates directly.

# NOTE: the input_actions.git patch table is gone too — nothing in the
# resolved graph carried a `git+…/input_actions` source, so it was inert.
#
# NOTE: the codeberg fts-ui.git patch table is gone. It existed only to
# fold dioxus-launcher's `launcher-ui` fts-ui git dep onto the in-tree
# crate. Both sides of that are now retired: the launcher engine is
# vendored in architect as architect-launcher-*, and fts-ui is
# architect-ui. Nothing resolves a crate named `fts-ui` any more.

[patch.crates-io]
# baseview from the FTS fork (upstream v0.3 + one fix): the macOS frame timer
# is registered in kCFRunLoopCommonModes rather than kCFRunLoopDefaultMode.
# AppKit runs the run loop modally for the whole of a live window resize, so a
# default-mode timer stops firing mid-drag — the editor's on_frame is frozen,
# nothing relayouts, and AppKit stretches the stale surface until the mouse
# comes up. Still present upstream at 0.3.1.
#
# Pinned by rev: this is a plugin-editor dependency, and a moving branch would
# let a window-system change land in a released plugin without a bump.
baseview = { git = "https://github.com/FastTrackStudios/baseview.git", rev = "fa0c2c870927ec27138f914c0841f305e9b4972f" }
# pipewire-rs one commit past its v0.10.0 release. PipeWire 1.6 rewrote
# constants like SPA_ID_INVALID from a bare `0xffffffff` into a cast form,
# `((uint32_t)0xffffffff)`, which bindgen's own macro evaluator cannot fold —
# it needs the clang fallback, which 0.10.0 asks for but never gives a
# writable build dir, so the fallback silently produces nothing and the
# constants vanish from the generated bindings. The result is
# `error[E0425]: cannot find value SPA_ID_INVALID in crate spa_sys` in
# libspa, which takes out everything downstream of daw-audio-io (patchbay,
# signal-sampler, and with it the FTS Signal plugin). Upstream commit
# 9b54509 "sys: Set clang macro fallback build dir to OUT_DIR" is the fix;
# drop this patch when a release carrying it lands on crates.io.
libspa-sys = { git = "https://gitlab.freedesktop.org/pipewire/pipewire-rs.git", rev = "9b54509e848e53ffa971ace15d7adf4908c09358" }
pipewire-sys = { git = "https://gitlab.freedesktop.org/pipewire/pipewire-rs.git", rev = "9b54509e848e53ffa971ace15d7adf4908c09358" }
# Blitz from the FTS fork (0.3.0-beta.1 line, upstream 02523b83 +
# fts-focus: focus-follows-pointerdown for all focusable content —
# upstream only click-focuses text inputs, leaving the editor's
# tabindex div unfocusable by mouse). dioxus git pins `=0.3.0-beta.1`
# and the vendored dioxus-test needs post-beta.1 APIs
# (Node::outer_html_pretty). One rev across all blitz crates.
#
# 02523b83 is the CEILING, and the blocker is dioxus, not us. Our four
# patches rebase cleanly onto current upstream main — that part is
# free — but blitz has since made `NodeId` a real type (5833d681, the
# SlotMap-backed node tree) where it used to be a `usize`, and moved
# `final_layout`/`scroll_offset` from fields to methods. dioxus's
# `native-dom` is still written against the old shape, so any bump
# lands ~47 type errors *inside the dioxus rev*, not in our tree.
#
# There is no dioxus rev that fixes it: main still pins blitz
# `=0.3.0-beta.1`, and our pin (f717a8e1) IS its newest "Sync
# Blitz/Native" commit. So the bump is gated on dioxus's next Blitz
# sync, and it moves as one step — blitz and the dioxus rev together.
# Rebased branches are parked on the fork at fts-focus-2026-08 (onto
# main) and fts-focus-2026-08b (onto db12391a, the last commit with
# the `incremental` feature) so the rebase does not have to be redone.
blitz-dom = { git = "https://github.com/FastTrackStudios/blitz", rev = "c82dd238000515c44c758845b9a17e9b48eb0087" }
blitz-traits = { git = "https://github.com/FastTrackStudios/blitz", rev = "c82dd238000515c44c758845b9a17e9b48eb0087" }
blitz-paint = { git = "https://github.com/FastTrackStudios/blitz", rev = "c82dd238000515c44c758845b9a17e9b48eb0087" }
blitz-shell = { git = "https://github.com/FastTrackStudios/blitz", rev = "c82dd238000515c44c758845b9a17e9b48eb0087" }
blitz-net = { git = "https://github.com/FastTrackStudios/blitz", rev = "c82dd238000515c44c758845b9a17e9b48eb0087" }
blitz-html = { git = "https://github.com/FastTrackStudios/blitz", rev = "c82dd238000515c44c758845b9a17e9b48eb0087" }
# Vendored one-line fix: quote scalars containing `<`/`>` — upstream
# (facet-rs/facet) styx-format emits them bare but styx-parse rejects
# them, so serialized keybind configs (`keys "<C-s>"`) could not be
# re-parsed. Drop the vendor once upstream fixes can_be_bare.
styx-format = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.1.0" }
# Vendored phon rc.5 + derive support for parse/display opaque scalars
# (Uuid, chrono DateTime/NaiveDate, url, …). Upstream rc.5 PANICS (and the
# reply path aborts the process) the first time a vox RPC reply contains
# such a field — every task-server list/stats call died. Drop the vendor
# once upstream phon derives these scalars.
phon = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.1.0" }
# Vendored phon-jit rc.5 with a one-line build.rs fix: force the stable,
# call-based stencils. Upstream's nightly detection can be true while no real
# nightly is present (the pinned nix toolchain), so it compiled the `become`
# (explicit tail calls) stencils on stable rustc 1.94 → E0658, breaking the
# macOS-aarch64 build. Drop the vendor once phon-jit builds on stable.
phon-jit = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.1.0" }

# ── Lints — merged union of the dissolved workspaces' policies ─────────
[workspace.lints.rust]
# Flipped from "allow" 2026-07-28 (task cleanup): the blanket allows are
# WHY ~30k lines of dead code accumulated silently. The task tree is
# warning-clean under these; legacy crates in other domains carry a
# crate-level `#![allow(dead_code, unused)]` marked "Lint debt" until
# their own burn-down.
dead_code = "warn"
unused = "warn"
unused_unsafe = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "allow"
private_intra_doc_links = "allow"
redundant_explicit_links = "allow"

[workspace.lints.clippy]
# The strict policy (namtao.com/rust), adopted 2026-09-02. There is NO
# blanket allow-list under this block, and that absence is the point: the
# curated legacy allows this replaced are WHY the violations accumulated.
# A lint that fires gets a real rewrite, never a suppression.
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# Panics — every one of these is a crash the type system could have caught.
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

# `disallowed_methods` is the realtime-audio guard (the list lives in
# clippy.toml: Mutex::lock, RwLock::read/write, env::var, thread::sleep). It is
# meaningful ONLY on code that runs on an audio callback — off the audio thread
# every one of these calls is ordinary and correct, and "fixing" a control-plane
# `Mutex::lock` into a `try_lock` produces strictly worse code.
#
# So the level follows the architecture rather than the call site: allowed by
# default here, and re-denied crate-by-crate via `#![deny(clippy::disallowed_methods)]`
# at the root of each processing crate (the `*-dsp` family + signal-sampler —
# the same crates CLAUDE.md requires to be no_std-able and allocation-free on
# the hot path). Measured at adoption: 518 of 562 findings were control-plane,
# 44 were in processing crates, and NONE of those was a Mutex::lock — the
# realtime discipline was already being kept, and this makes the boundary
# explicit rather than trusting a reviewer to notice.
disallowed_methods = "allow"

# Suppressions must be deliberate and self-deleting: `#[expect(.., reason = "..")]`
# fails the build once it stops being needed, `#[allow]` rots silently.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# ── Dev profile (carried from the dissolved signal workspace) ──────────
# The live rig runs from `fasttrackstudio --engine` (formerly signal-engine/signal-rigd): the vendored NAM C++
# core and the DSP crates are unusable at opt-level 0 (~10-50x slower,
# xruns), so dependencies build at release opt in dev while the thin
# app/UI workspace crates stay at light opt for fast rebuilds.
[profile.dev]
opt-level = 1

# Debuginfo discipline. Full DWARF was the single biggest cost in this
# tree: a `debug` test binary measured 1.62 GB, of which 1.59 GB (98%)
# was `.debug_*` sections — and the default linker copies all of it into
# every binary, every relink. Across ~6 worktrees that was ~1 TB of
# target/ and minutes of link time per build.
#
#   line-tables-only  keeps file:line in backtraces + profiler symbols
#                     (samply/perf still work); drops variable/type DWARF,
#                     so a *debugger* can't inspect locals.
#   unpacked          leaves the remaining DWARF in the .o files under
#                     deps/ instead of copying it into each artifact, so
#                     linking stops moving gigabytes around.
#
# Need a real debugger session? Build with `--profile dev-dbg` (below) —
# same codegen, full DWARF, and it uses a separate target dir so it never
# invalidates the fast dev artifacts.
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Escape hatch: full DWARF for stepping in gdb/lldb. Everything else is
# identical to dev, so package opt-level overrides below still apply.
[profile.dev-dbg]
inherits = "dev"
debug = 2
split-debuginfo = "packed"

# dx web builds: native debuginfo in the wasm module blew past
# Chrome's 1 GiB WebAssembly module cap (1.14 GB observed). Wasm dev
# builds don't need it — strip it and dev bundles come back to a
# loadable size.
[profile.wasm-dev]
inherits = "dev"
debug = false
strip = "debuginfo"

# The in-browser setlist player renders daw-standalone's full graph in wasm —
# mirror the dev-profile audio-path opt overrides here explicitly (package
# overrides may not carry through `inherits`), so dx dev bundles mix ~20
# stems in realtime instead of grinding the main thread.
[profile.wasm-dev.package."*"]
opt-level = 3
[profile.wasm-dev.package.audiocore-dsp]
opt-level = 3
[profile.wasm-dev.package.daw-standalone]
opt-level = 3

# Dependencies. Was 3 across the board, which meant paying full LLVM
# optimization on ~1500 registry crates for every cold build / new
# worktree. Dropped to 1: still gets rid of the pathological O0 debug
# codegen, at a fraction of the compile cost. The crates that actually
# run on the audio thread are exempted below — this override applies to
# dependencies only, so workspace members are governed by profile.dev's
# base opt-level and the explicit list further down.
[profile.dev.package."*"]
opt-level = 1

# Audio-thread dependencies, kept at 3. `package."*"` above would
# otherwise drop these to 1, and a dev run of the rig would start
# xrunning. Sourced from `cargo tree` over audiocore-dsp /
# daw-audio-graph / signal-sampler / neural-amp-modeler / eq-dsp /
# pitch-dsp, keeping the crates that do real per-sample or per-block
# work (resampling, decode, FFT, sample-pack decompression, JIT).
#
# If a dev run ever xruns on a path not covered here: run it --release
# (the launch paths already do), or add the crate to this list.
[profile.dev.package.rubato]
opt-level = 3
[profile.dev.package.fixed-resample]
opt-level = 3
[profile.dev.package.fast-interleave]
opt-level = 3
[profile.dev.package.dasp_sample]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.transpose]
opt-level = 3
[profile.dev.package.strength_reduce]
opt-level = 3
[profile.dev.package.primal-check]
opt-level = 3
[profile.dev.package.num-complex]
opt-level = 3
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3
[profile.dev.package.symphonia-codec-pcm]
opt-level = 3
[profile.dev.package.symphonia-codec-adpcm]
opt-level = 3
[profile.dev.package.symphonia-codec-aac]
opt-level = 3
[profile.dev.package.symphonia-format-riff]
opt-level = 3
[profile.dev.package.symphonia-format-mkv]
opt-level = 3
# Sample-pack streaming: blake3 hashes pack content on load, on the
# voice-start path.
[profile.dev.package.blake3]
opt-level = 3
# phon's JIT engine — generates and runs the DSP graph itself.
[profile.dev.package.phon]
opt-level = 3
[profile.dev.package.phon-engine]
opt-level = 3
[profile.dev.package.phon-jit]
opt-level = 3

# Build scripts + proc macros and their deps. `package."*"` does NOT cover
# these — cargo routes them through build-override, where they were landing
# at opt-level 0 with full debuginfo. This tree leans hard on derive macros
# (facet, architect, dioxus rsx), so the macros are *executed* thousands of
# times per build: paying O3 once to compile syn/quote wins that back many
# times over, and build scripts have no use for DWARF.
[profile.dev.build-override]
opt-level = 3
debug = false

# `package."*"` covers DEPENDENCIES only — workspace members stay at the
# base opt-level. The audio path is ours, so the hot crates get full opt
# even in dev builds: a debug rig must never xrun. (Launch paths default
# to --release regardless; this is the safety net for dev runs.)
[profile.dev.package.audiocore-dsp]
opt-level = 3
[profile.dev.package.daw-audio-io]
opt-level = 3
[profile.dev.package.daw-standalone]
opt-level = 3
[profile.dev.package.neural-amp-modeler]
opt-level = 3
[profile.dev.package.signal-sampler]
opt-level = 3
[profile.dev.package.signal-guitar]
opt-level = 3
[profile.dev.package.signal-fx]
opt-level = 3
[profile.dev.package.eq-dsp]
opt-level = 3
[profile.dev.package.comp-dsp]
opt-level = 3
[profile.dev.package.reverb-dsp]
opt-level = 3
[profile.dev.package.delay-dsp]
opt-level = 3
[profile.dev.package.pitch-dsp]
opt-level = 3
[profile.dev.package.trigger-dsp]
opt-level = 3

