# session — one root workspace.
#
# Split out of the FastTrackStudio monorepo (see docs/split/PLAN.md
# there). Intra-repo dependencies are path deps in the table below;
# cross-repo dependencies are git deps pinned to a tag.

[workspace]
resolver = "3"

members = [
    "apps/session-reaper-xtask",
    "libs/razor",
    "libs/view-gestures",
    "libs/vendor/anyrender_vello",
    "libs/vendor/anyrender_vello_hybrid",
    "libs/vendor/dioxus-native-dom",
    "libs/vendor/dioxus-native",
    "features/builtin-fx",
    "features/drum-hits",
    "features/signal-fx",
    "features/expression-editor/expression-editor-audio",
    "features/expression-editor/expression-editor-core",
    "features/expression-editor/expression-editor-corpus",
    "features/expression-editor/expression-editor-daw",
    "features/expression-editor/expression-editor-demo",
    "features/expression-editor/expression-editor-guitarpro",
    "features/expression-editor/expression-editor-host",
    "features/expression-editor/expression-editor-reaper",
    "features/expression-editor/expression-editor-standalone",
    "features/expression-editor/expression-editor-tools",
    "features/expression-editor/expression-editor-paint",
    "features/expression-editor/expression-editor-ui",
    "features/ui/daw-ui",
    "features/ui/daw-theme",
    "features/ui/daw-theme-art",
    "features/ui/daw-theme-reaper",
    "features/ui/fts-themer",
    "features/ui/fts-themer-ui",
    "features/ui/daw-reaper-dioxus-ext",
    "features/ui/daw-reaper-dioxus-ext-test",
    "apps/cli",
    "apps/desktop",
    "apps/session-daw-web",
    "apps/session-daw",
    "apps/session-player",
    "apps/vault-sync",
    "apps/web",
    "crates/session/proto",
    "crates/session/session",
    "crates/session/sync",
    "crates/session/library",
    "crates/session/ui",
    "features/chord-tool/chord-tool",
    "features/chord-tool/chord-tool-daw",
    "features/dynamic-template/dynamic-template",
    "features/dynamic-template/dynamic-template-extension",
    "features/dynamic-template/dynamic-template-proto",
    "features/dynamic-template/tests",
    "features/guide",
    "features/patch-list",
    "features/reaper/session-extension",
    "features/reaper/session-extension/xtask",
    "features/song",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
authors = ["FastTrack Studio"]
license = "GPL-3.0-or-later"
repository = "https://github.com/FastTrackStudios/session"

[workspace.dependencies]
# Razor edit areas: a rectangle of time by row, and the set algebra over
# it. Dependency-free and shared by the expression editor and the
# arrangement, so the two cannot disagree about what an area is.
razor = { path = "libs/razor" }
view-gestures = { path = "libs/view-gestures" }
# ── Internal — every moved crate, path declared ONCE here ─────────────
fts-chrome = { path = "../daw/libs/fts-chrome" }
# These two moved from `daw` to `processor` on the September 2026 FX
# split and have diverged since — `../daw` still carries an older copy,
# and taking that one puts two different `fts-audio-ui v0.1.0` in one
# lockfile, which cargo refuses outright.
fts-audio-ui = { git = "https://github.com/FastTrackStudios/processor", tag = "v0.2.1" }
fts-plug-ui = { git = "https://github.com/FastTrackStudios/processor", tag = "v0.2.1" }
dock-dioxus = { path = "../daw/libs/dock/dock-dioxus", default-features = false }
dock-proto = { path = "../daw/libs/dock/dock-proto" }
# nice-plug lives in its own fork repo (upstream RustAudio/nice-plug's
# baseview-03 branch + the FTS delta: nice-plug-dioxus, embedded editors,
# rich track-info, param rescan). The ONE sanctioned exception to
# path-deps-only — it left the tree so it can track upstream.
nice-plug = { git = "https://github.com/FastTrackStudios/nice-plug.git", branch = "fts-baseview-03" }
nice-plug-dioxus = { git = "https://github.com/FastTrackStudios/nice-plug.git", branch = "fts-baseview-03" }
nice-plug-xtask = { git = "https://github.com/FastTrackStudios/nice-plug.git", branch = "fts-baseview-03" }
utils = { path = "../daw/libs/utils" }
# The grid that follows the zoom. Pure arithmetic and no dependencies, so
# the arrange view and the expression editor can agree on it without
# either depending on the other.
adaptive-grid = { path = "../daw/libs/adaptive-grid" }
installer-core = { path = "../daw/libs/installer-core" }
engine-launcher = { path = "../daw/libs/engine-launcher" }
neural-amp-modeler = { git = "https://github.com/FastTrackStudios/neural-amp-modeler-rs", tag = "v0.1.0" }
audiocore-core = { path = "../daw/crates/audiocore/audiocore-core" }
audiocore-dsp = { path = "../daw/crates/audiocore/audiocore-dsp", default-features = false }
audiocore-gui = { path = "../daw/crates/audiocore/audiocore-gui" }
fts-modulation = { path = "../daw/crates/audiocore/fts-modulation" }
# Defaults OFF at the root so lean consumers (probe-only scanners, the
# iOS-clean session-guide) don't drag the pack engine in; each consumer
# names the features it needs ("load" / "write" / "engine").
fts-sample = { path = "../daw/crates/audiocore/fts-sample", default-features = false }
fts-themes = { path = "../daw/crates/audiocore/fts-themes" }
meter-dsp = { path = "../daw/crates/audiocore/meter-dsp" }
meter-ui = { path = "../daw/crates/audiocore/meter-ui" }
# Canonical MIDI facade. Defaults OFF at the root: daw-proto re-exports
# `midicore::MidiEvent` and must not drag midicore's `vox` service traits
# (nor the `midir` feature — midicore-midir pins midir 0.10/alsa-sys 0.3,
# colliding with daw's midir 0.11/alsa-sys 0.4 via `links = "alsa"`).
# Consumers that want the vox surface set `features = ["vox"]` themselves.
midicore = { path = "../daw/crates/midicore/midicore", default-features = false }
midicore-proto = { path = "../daw/crates/midicore/midicore-proto" }
midicore-midir = { path = "../daw/crates/midicore/midicore-midir" }
midicore-ui = { path = "../daw/crates/midicore/midicore-ui" }
# NI Komplete Kontrol keyboard driver (Light Guide / per-key RGB LEDs).
kontrol = { path = "../daw/crates/kontrol/kontrol" }
input-config-proto = { path = "../daw/crates/input/input-config-proto" }
arborium ={ version = "2.16.0", default-features = false }
arborium-theme = "2.16.0"
arborium-tree-sitter = "2.16.0"
ropey = "1.6"
input = { path = "../daw/crates/input/input" }
input-dioxus = { path = "../daw/crates/input/input-dioxus" }
input-keybinds = { path = "../daw/crates/input/input-keybinds" }

# ── frame themes ──────────────────────────────────────────────────────
# The mixer (then the TCP, then the arrangement) drawn from frame
# documents — runtime-swappable, hot-reloaded themes. See
# docs/frame-themes.md. A path dep on a local checkout of
# github.com/FastTrackStudios/frame while the theme runtime is built out;
# becomes a tagged git dep once frame cuts one.
theme-runtime = { path = "../../frame/features/theme/theme-runtime", features = ["anyrender-0-11"] }
# A frame face running live: a control surface designed in frame (the
# rig's pedals, amps and Time blocks, a reverb's machine), painted into
# the host's scene and played by its pointer — the FX view's devices.
frame-live = { path = "../../frame/crates/frame-live", features = ["anyrender-0-11"] }

# ── daw domain (wave 2) ───────────────────────────────────────────────
# Facade crate — the only public API surface for the daw domain.
# daw-proto, daw-control, daw-standalone, dawfile-* are INTERNAL to the
# domain; consumers outside it go through the `daw` facade.
daw = { path = "../daw/crates/daw/daw" }
daw-proto = { path = "../daw/crates/daw/proto" }
daw-actions = { path = "../daw/crates/daw/actions" }
daw-control = { path = "../daw/crates/daw/control" }
daw-module = { path = "../daw/crates/daw/module" }
fts-devtools = { path = "../daw/libs/devtools/fts-devtools" }
daw-test-macro = { path = "../daw/libs/devtools/daw-test-macro" }
daw-audio-graph = { path = "../daw/features/audio/daw-audio-graph" }
daw-audio-io = { path = "../daw/features/audio/daw-audio-io" }
# RT-aware allocator — offloads RT deallocation to background thread
daw-allocator = { path = "../daw/features/audio/daw-allocator" }
fts-audio-proto = { path = "../daw/features/audio/fts-audio-proto" }
audio-controls = { path = "../daw/features/audio/audio-controls" }
daw-synchronization = { path = "../daw/features/sync/daw-synchronization" }
daw-link = { path = "../daw/features/sync/daw-link" }
daw-network = { path = "../daw/features/sync/daw-network" }
daw-audio-sync = { path = "../daw/features/sync/daw-audio-sync" }
daw-transport-sync = { path = "../daw/features/sync/daw-transport-sync" }
dawfile-aaf = { path = "../daw/features/dawfile/dawfile-aaf" }
dawfile-ableton = { path = "../daw/features/dawfile/dawfile-ableton" }
dawfile-dawproject = { path = "../daw/features/dawfile/dawfile-dawproject" }
dawfile-logic = { path = "../daw/features/dawfile/dawfile-logic" }
dawfile-protools = { path = "../daw/features/dawfile/dawfile-protools" }
dawfile-reaper = { path = "../daw/features/dawfile/dawfile-reaper" }
dawfile-standalone = { path = "../daw/features/dawfile/dawfile-standalone" }
dawfile-store = { path = "../daw/features/dawfile/dawfile-store" }
# default = all-formats; the daw facade opts into formats individually,
# so the root entry keeps defaults OFF and consumers that want every
# importer set `default-features = true`.
daw-reaper = { path = "../daw/features/reaper/daw-reaper", default-features = false }
daw-bridge = { path = "../daw/features/reaper/daw-bridge" }
# Extension runtime — integrated REAPER extension helpers
daw-extension-runtime = { path = "../daw/features/reaper/daw-extension-runtime" }
daw-reaper-dioxus = { path = "../daw/features/reaper/daw-reaper-dioxus" }
daw-reaper-dioxus-ext = { path = "features/ui/daw-reaper-dioxus-ext" }
daw-reaper-embed = { path = "../daw/features/reaper/daw-reaper-embed" }
reaper-launcher = { path = "../daw/features/reaper/reaper-launcher" }
fts-icons = { path = "../daw/features/reaper/fts-icons" }
fts-themer = { path = "features/ui/fts-themer", default-features = false }
fts-themer-ui = { path = "features/ui/fts-themer-ui" }
reaper-config = { path = "../daw/features/reaper/reaper-config" }
reaper-kbd = { path = "../daw/features/reaper/reaper-kbd" }
reaper-hwnd = { path = "../daw/features/reaper/reaper-hwnd" }
reaper-embed = { path = "../daw/features/reaper/reaper-embed" }
reaper-dioxus = { path = "../daw/features/reaper/reaper-dioxus" }
# default-features = false: `overlay-prewarm` allocates wgpu/Vello surfaces
# eagerly, which OOMs when loaded at REAPER plugin_main time. The only
# consumer (fts-extensions) wants it off; enable per-member if needed.
reaper-input = { path = "../daw/features/reaper/reaper-input", default-features = false }
fts-launcher = { path = "../daw/features/launcher/fts-launcher" }
daw-standalone = { path = "../daw/features/standalone/daw-standalone" }
daw-csi = { path = "../daw/features/surfaces/daw-csi" }
daw-ui = { path = "features/ui/daw-ui", default-features = false }
daw-theme = { path = "features/ui/daw-theme" }
daw-theme-art = { path = "features/ui/daw-theme-art", default-features = false }
daw-theme-reaper = { path = "features/ui/daw-theme-reaper" }

# ── session domain (wave 3) ───────────────────────────────────────────
# `session` is the facade — the only public API surface for the session
# domain. session-proto is INTERNAL (session-ui and session-guide are the
# documented exceptions: Dioxus components / the guide engine).
session = { path = "crates/session/session" }
session-proto = { path = "crates/session/proto" }
session-sync = { path = "crates/session/sync" }
session-ui = { path = "crates/session/ui", default-features = false }
# Portable guide engine (click / count-in / section guide). Optional `tts`
# feature adds local Chatterbox TTS (its ort/chatterbox pins live in the
# crate's own manifest, not here).
session-guide = { path = "features/guide" }
# Durable Song + Arrangement vault-folder schema (stored counterpart to
# session_proto::Song). Keyflow-agnostic: charts are stored as references
# (relative paths / attachment ids), never embedded keyflow::Chart types.
song = { path = "features/song" }

# ── keyflow domain — its own repo since the 2026-08 split ─────────────
# (FastTrackStudios/keyflow: the chart language, its formats, the LSP and
# tree-sitter grammar, and Engraver.) One tag pin shared by every entry so
# the whole domain moves together.
#
# `keyflow` and `engraver` are the facades — depend on those. The rest are
# listed only because in-tree consumers still name them directly; new code
# should go through a facade.
#
# `keyflow-proto` and `keyflow-syntax` stay in `daw`: expression-editor-core,
# which daw-reaper hard-depends on, needs them.
keyflow = { git = "https://github.com/FastTrackStudios/keyflow", tag = "v0.2.4" }
keyflow-proto = { git = "https://github.com/FastTrackStudios/keyflow", tag = "v0.2.4" }
keyflow-syntax = { git = "https://github.com/FastTrackStudios/keyflow", tag = "v0.2.4" }
keyflow-text = { git = "https://github.com/FastTrackStudios/keyflow", tag = "v0.2.4" }
keyflow-chordpro = { git = "https://github.com/FastTrackStudios/keyflow", tag = "v0.2.4" }
keyflow-midi = { git = "https://github.com/FastTrackStudios/keyflow", tag = "v0.2.4" }
keyflow-live = { git = "https://github.com/FastTrackStudios/keyflow", tag = "v0.2.4" }
keyflow-musicxml = { git = "https://github.com/FastTrackStudios/keyflow", tag = "v0.2.4" }
keyflow-musx = { git = "https://github.com/FastTrackStudios/keyflow", tag = "v0.2.4" }
keyflow-annotate = { git = "https://github.com/FastTrackStudios/keyflow", tag = "v0.2.4" }
keyflow-orchestra = { git = "https://github.com/FastTrackStudios/keyflow", tag = "v0.2.4" }
keyflow-sync = { git = "https://github.com/FastTrackStudios/keyflow", tag = "v0.2.4" }
keyflow-daw-analysis = { git = "https://github.com/FastTrackStudios/keyflow", tag = "v0.2.4" }
keyflow-ui = { git = "https://github.com/FastTrackStudios/keyflow", tag = "v0.2.4" }
keyflow-cli = { git = "https://github.com/FastTrackStudios/keyflow", tag = "v0.2.4" }
keyflow-lsp = { git = "https://github.com/FastTrackStudios/keyflow", tag = "v0.2.4" }
tree-sitter-keyflow = { git = "https://github.com/FastTrackStudios/keyflow", tag = "v0.2.4" }
# Engraver — defaults OFF at the root (the full `engraver` feature drags
# wgpu/vello + PDF export); consumers opt into `svg`/`wgpu`/`engraver`.
engraver = { git = "https://github.com/FastTrackStudios/keyflow", tag = "v0.2.4", default-features = false }
engraver-proto = { git = "https://github.com/FastTrackStudios/keyflow", tag = "v0.2.4", default-features = false }
engraver-score = { git = "https://github.com/FastTrackStudios/keyflow", tag = "v0.2.4" }

# ── signal domain (wave 4) ────────────────────────────────────────────
# `signal` is the facade — the only public API surface for the signal
# domain. Apps depend on `signal`, `signal-ui`, or `signal-sampler`;
# never on the internal domain crates (proto/live/storage/controller/
# import/daw-bridge/nam-manager).
# `default-features = false` must be declared here, not just at the use
# site: cargo ignores a member's `default-features = false` on a
# workspace dependency unless the workspace entry sets it too. Consumers
# that need the filesystem scanner opt in with `features = ["native"]`.

# ── features/fx — built-in FX (wave 4) ────────────────────────────────
# Facade crates — the public FX deps (downstream uses these, not `*-dsp`).
# The trigger plugin editor. Core (waveform/threshold SVG math) is portable;
# the nice-plug/Blitz editor is behind its `native` feature.
# The full Pro-Q EQ editor. Core (graph model / response / SVG / interaction)
# is wasm-portable; the vello/nice-plug editor is behind its `native` feature.
# The comp plugin editor. Core (profile view data model) is portable; the
# nice-plug/Blitz editor is behind its `native` feature.
pitch-dsp = { path = "../daw/features/fx/pitch/pitch-dsp" }
world-sys = { path = "../daw/libs/vendor/world" }
tune-dsp = { path = "../daw/features/fx/tune/tune-dsp" }
align-dsp = { path = "../daw/features/align/align-dsp" }

# ── The built-in FX, from the processor repo ──────────────────────────
# The mixer's Tone rack draws a real EQ, compressor and saturator, and
# it draws them from the SAME functions the plugins' own editors do:
# `eq_graph_response::calculate_combined_response`,
# `comp_graph_svg::compress_transfer`, `preamp::transfer_curve`. A curve
# in a strip that disagreed with the curve in the plugin window would be
# worse than no curve at all, so the strip owns no response math.
#
# Core only — `default-features = false` drops the nice-plug/Blitz
# editors, which is what keeps this to response math rather than a
# second plugin host inside the mixer.
comp-ui = { git = "https://github.com/FastTrackStudios/processor", tag = "v0.2.1", default-features = false }
eq-ui = { git = "https://github.com/FastTrackStudios/processor", tag = "v0.2.1", default-features = false }
saturate-dsp = { git = "https://github.com/FastTrackStudios/processor", tag = "v0.2.1", default-features = false }
# The Depth units draw the plugins' own machines: the delay's style
# family decides how a repeat is drawn, and the reverb's envelope is
# the algorithm's actual impulse response, rendered by `reverb-dsp`'s
# analysis probe rather than an exponential drawn from the decay knob.
delay-dsp = { git = "https://github.com/FastTrackStudios/processor", tag = "v0.2.1" }
reverb-dsp = { git = "https://github.com/FastTrackStudios/processor", tag = "v0.2.1" }
reverb-profiles = { git = "https://github.com/FastTrackStudios/processor", tag = "v0.2.1" }
delay-profiles = { git = "https://github.com/FastTrackStudios/processor", tag = "v0.2.1" }
# The effects' own painted pictures — every reverb family, every delay
# family, and the six modulation engines — which the FX view's devices
# draw (`paint_reverb`, `paint_delay`, `paint_mod`, behind `viz`).
reverb-ui = { git = "https://github.com/FastTrackStudios/processor", tag = "v0.2.1", default-features = false, features = ["viz"] }
delay-ui = { git = "https://github.com/FastTrackStudios/processor", tag = "v0.2.1", default-features = false, features = ["viz"] }
modulation-ui = { git = "https://github.com/FastTrackStudios/processor", tag = "v0.2.1", default-features = false, features = ["viz"] }
saturate-ui = { git = "https://github.com/FastTrackStudios/processor", tag = "v0.2.1", default-features = false, features = ["viz"] }
# The saturator's five circuits and their profiles — what its selector
# picks from, applied through the plugin's own `apply`.
saturate-profiles = { git = "https://github.com/FastTrackStudios/processor", tag = "v0.2.1" }
# The FTS plugins themselves, run in-process as the engine's built-in FX
# (`builtin-fx`): their CLAP/VST3 exports off (`default-features`).
comp-plugin = { git = "https://github.com/FastTrackStudios/processor", tag = "v0.2.1", default-features = false }
delay-plugin = { git = "https://github.com/FastTrackStudios/processor", tag = "v0.2.1", default-features = false }
eq-plugin = { git = "https://github.com/FastTrackStudios/processor", tag = "v0.2.1", default-features = false }
gate-plugin = { git = "https://github.com/FastTrackStudios/processor", tag = "v0.2.1", default-features = false }
level-plugin = { git = "https://github.com/FastTrackStudios/processor", tag = "v0.2.1", default-features = false }
limiter-plugin = { git = "https://github.com/FastTrackStudios/processor", tag = "v0.2.1", default-features = false }
meter-plugin = { git = "https://github.com/FastTrackStudios/processor", tag = "v0.2.1", default-features = false }
modulation-plugin = { git = "https://github.com/FastTrackStudios/processor", tag = "v0.2.1", default-features = false }
reverb-plugin = { git = "https://github.com/FastTrackStudios/processor", tag = "v0.2.1", default-features = false }
saturate-plugin = { git = "https://github.com/FastTrackStudios/processor", tag = "v0.2.1", default-features = false }
pitch-plugin = { git = "https://github.com/FastTrackStudios/processor", tag = "v0.2.1", default-features = false }
tune-plugin = { git = "https://github.com/FastTrackStudios/processor", tag = "v0.2.1", default-features = false }
unison-plugin = { git = "https://github.com/FastTrackStudios/processor", tag = "v0.2.1", default-features = false }
mic-plugin = { git = "https://github.com/FastTrackStudios/processor", tag = "v0.2.1", default-features = false }
builtin-fx = { path = "features/builtin-fx" }
# signal's rigs in the session engine: the bass rig, the kit's voices.
signal-fx = { path = "features/signal-fx" }
# signal's in-process rig engine (NAM, convolver, the sampler), from the
# sibling checkout as daw is: both resolve daw to ../daw, so its
# processors are the session engine's `PluginInstance`s.
signal-sampler = { path = "../signal/features/sampler/signal-sampler" }
# signal's rig library — its profiles, scenes and how a profile becomes the
# chains a scene plays (the bass rig's profile mode, signal-fx).
signal-guitar = { path = "../signal/features/rigs/guitar" }

expression-editor-audio = { path = "features/expression-editor/expression-editor-audio" }
expression-editor-core = { path = "features/expression-editor/expression-editor-core" }
expression-editor-corpus = { path = "features/expression-editor/expression-editor-corpus" }
expression-editor-daw = { path = "features/expression-editor/expression-editor-daw" }
expression-editor-demo = { path = "features/expression-editor/expression-editor-demo" }
expression-editor-guitarpro = { path = "features/expression-editor/expression-editor-guitarpro" }
expression-editor-host = { path = "features/expression-editor/expression-editor-host" }
expression-editor-reaper = { path = "features/expression-editor/expression-editor-reaper" }
expression-editor-standalone = { path = "features/expression-editor/expression-editor-standalone" }
expression-editor-tools = { path = "features/expression-editor/expression-editor-tools" }
expression-editor-paint = { path = "features/expression-editor/expression-editor-paint" }
expression-editor-ui = { path = "features/expression-editor/expression-editor-ui" }
level-dsp = { path = "../daw/features/fx/level/level-dsp" }
# Internal DSP cores (behind the facades).

# ── Facet reflection + vox RPC — the rc.5 fleet pins ──────────────────
facet = { version = "0.50.0-rc.5", features = ["reflect", "chrono", "uuid"] }
facet-json = { version = "0.50.0-rc.5" }
facet-postcard = { version = "0.50.0-rc.5" }
facet-styx = { version = "5.0.0-rc.5" }
# facet-styx's formatter, needed directly by anyone who has to set
# `omit_none` (the `.daw` writer). Routed to the vendor repo by the
# [patch.crates-io] table below.
styx-format = { version = "5.0.0-rc.5" }
facet-toml = { version = "0.50.0-rc.5" }
# figue pairs with facet-styx 5.0 (reaper-input keybind config parsing).
figue = { version = "5.0.0-rc.5" }
vox = { version = "0.10.0-rc.5", default-features = false, features = ["runtime"] }
vox-types = { version = "0.10.0-rc.5" }
vox-phon = { version = "0.10.0-rc.5" }
