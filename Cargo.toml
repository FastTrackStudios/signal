# ── UI framework ──────────────────────────────────────────────────────
# dioxus 0.8 line — git rev pinned (0.8.0-alpha.0 + the blitz beta bump;
# bump this rev deliberately, it must stay in lockstep across every
# dioxus-* entry below AND the FTS fork branches of primitives/lumen/
# lucide/sdk, which pin the same rev).
dioxus = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", default-features = false, features = ["lib"] }
# Blitz native renderer — dioxus-native(-dom) moved into the dioxus repo
# on the 0.8 line; blitz-* come from crates.io (0.3.0-beta.1), matching
# dioxus git's own `=0.3.0-beta.1` pins. Feature union of the wave-1
# UI libs (prelude, system-fonts) and daw-reaper-dioxus (svg, autofocus,
# incremental, data-uri theme-skin PNGs).
# `vello` — the compute-shader renderer — because dioxus-native's own
# default is `vello-hybrid`, which does much of its path work on the CPU.
# Hybrid exists for WebGL-class targets; on a desktop GPU it is what
# stands between the expression editor and its frame budget (35 fps at
# 5120x1440 with five notes on screen, where the whole scene was 69 draw
# commands and 0.04 ms to build — the cost was all in rasterising it).
#
# Both features can be on at once: the renderer is chosen by a `cfg_if`
# chain that tests `vello` first, so this wins over the default without
# having to turn defaults off and re-list them.
dioxus-native = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", features = ["prelude", "system-fonts", "svg", "autofocus", "incremental", "data-uri", "vello"] }
blitz-dom = "=0.3.0-beta.1"
blitz-paint = "=0.3.0-beta.1"
blitz-traits = "=0.3.0-beta.1"
blitz-shell = "=0.3.0-beta.1"
blitz-html = "=0.3.0-beta.1"
dioxus-native-dom = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc" }
# Vendored DioxusLabs/dioxus-test on the pins above — headless component
# tests on blitz-dom (no browser). See libs/vendor/dioxus-test.
dioxus-test = { git = "https://github.com/FastTrackStudios/daw", tag = "v0.0.6.2" }
dioxus-devtools = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc" }
# FTS fork branches carrying the dioxus-0.8 bumps until upstream moves.
lumen-blocks = { git = "https://github.com/FastTrackStudios/lumen-blocks", branch = "main" }
dioxus-primitives = { git = "https://github.com/FastTrackStudios/dioxus-components", package = "dioxus-primitives", branch = "main", default-features = false }
lucide-dioxus = { git = "https://github.com/FastTrackStudios/lucide", branch = "main", features = ["all-icons"] }
clsx = "0.1.1"
tw_merge = "0.1.21"
nucleo-matcher = "0.3"
# fff's fuzzy scorer (SIMD Smith-Waterman, scalar fallback on wasm) —
# the everything-search window's matcher.
neo_frizbee = { version = "0.11", features = ["match_end_col"] }
palette = "0.7.6"
linkme = "0.3"

# ── REAPER bindings (FTS fork with v7.63 ruler lane APIs) ─────────────
reaper-low = { git = "https://codeberg.org/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-medium = { git = "https://codeberg.org/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-high = { git = "https://codeberg.org/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-macros = { git = "https://codeberg.org/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
# swell-ui from FTS reaper-lib — typed Window/Hwnd wrappers around SWELL.
swell-ui = { git = "https://codeberg.org/FastTrackStudios/reaper-lib.git", branch = "main" }

# ── Plugin frameworks / hosting (daw) ─────────────────────────────────
nih_plug = { git = "https://codeberg.org/FastTrackStudios/nih-plug.git", branch = "reaper-embed-ui" }
# Pinned by rev, deliberately. This was an unpinned git dep, so it floated
# to whatever the branch head was at the next resolve — and it moved
# 0.1.0 -> 0.2.0 on its own during a routine lockfile regeneration,
# breaking daw-standalone's plugin host (clack made the timer callbacks
# take &self rather than &mut self). A host API is exactly the kind of
# dependency a release must not float under.
clack-host = { git = "https://github.com/prokopyl/clack", rev = "f874e858ad576c601367b3038af5088a4e671744" }
clack-extensions = { git = "https://github.com/prokopyl/clack", rev = "f874e858ad576c601367b3038af5088a4e671744", features = [
    "clack-host",
    # Bridge host windows (winit 0.30) into CLAP embedded GUIs (fts-clap-host).
    "raw-window-handle_06",
    "audio-ports",
    "note-ports",
    # Piano-roll key labels (FTS Guide names its click/count/section keys).
    "note-name",
    "params",
    "state",
    "latency",
    "gui",
    "timer",
    "log",
    "thread-check",
    "tail",
] }
# VST3 hosting — MIT/Apache-2.0 COM bindings (not GPL vst3-sys).
vst3 = "0.3"
libloading = "0.8"

# ── GPU rendering stack (daw-reaper-embed / daw-reaper-dioxus) ────────
wgpu = { version = "29", features = ["wgsl"] }
vello = { version = "0.9", features = ["wgpu"] }
skrifa = "0.37"
anyrender_vello = "0.12"
# keyflow-ui / engraver-proto renderer stack (paired with dioxus-native
# 0.7.9 from crates.io). NOTE: keyflow-ui pins anyrender_vello 0.10.1 and
# dioxus-native 0.7.9 INLINE in its own manifest — they collide with the
# root's anyrender_vello 0.11 / blitz-git dioxus-native pins above, and
# root pins win in the workspace table, so the conflicting pair stays
# crate-local.
anyrender = "0.11"
anyrender_vello_hybrid = "0.8"
vello_hybrid = "0.0.9"
vello_common = "0.0.9"
peniko = "0.6"
kurbo = "0.13"
# Text shaping for the painted expression-editor roll. Same version blitz
# shapes DOM text with, so a label drawn into a scene and a label drawn
# by the DOM come out of the same shaper.
parley = "0.10"
# Deterministic CPU rendering for the ui-snapshot regression gate.
anyrender_vello_cpu = "0.14"

# ── Platform UI bindings ──────────────────────────────────────────────
cocoa = "0.26"
objc = "0.2.7"

# ── Async runtime ─────────────────────────────────────────────────────
tokio = { version = "1.48", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"

# ── Filesystem watching ───────────────────────────────────────────────
# crates.io `notify` — the cross-platform filesystem watcher, used by the
# Files cadence engine (issue #260) for activity *hints* (a full stat-scan
# is what certifies a checkpoint). Renamed: `notify` the workspace-
# dependency name is already taken by the in-tree `features/task/notify`
# member (the notifications feature), and one name can only mean one crate
# in `[workspace.dependencies]`.
notify-fs = { package = "notify", version = "8" }
# Glob matching for a File Root's Ignore set (issue #260 / glossary
# "Ignore set" — shared verbatim by versioning and selective sync).
globset = "0.4"

# ── Serialization ─────────────────────────────────────────────────────
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"

# ── Observability ─────────────────────────────────────────────────────
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# ── OpenTelemetry (opt-in via OTEL_EXPORTER_OTLP_ENDPOINT; see
# crates/task/telemetry) — http/protobuf OTLP to the cluster collector.
opentelemetry = "0.30"
opentelemetry_sdk = { version = "0.30", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.30", default-features = false, features = [
  "http-proto",
  # BLOCKING is deliberate: the SDK's batch processors run on their own
  # dedicated OS threads, which have no Tokio reactor — the async client
  # panics them with "there is no reactor running" on first flush.
  "reqwest-blocking-client",
  "reqwest-rustls",
  "trace",
  "logs",
  "metrics",
] }
opentelemetry-appender-tracing = "0.30"
opentelemetry-semantic-conventions = "0.30"
tracing-opentelemetry = "0.31"
# Sentry error/crash telemetry — rustls (not native-tls) for iOS.
sentry = { version = "0.44", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
sentry-tracing = "0.44"

# ── Proc-macro plumbing ───────────────────────────────────────────────
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

# ── fts-story tooling ─────────────────────────────────────────────────
dssim-core = "3"
png = "0.17"
proptest = "1"
tempfile = "3"

# ── Audio / plugin framework externals (nice-plug + audiocore) ───────
atomic_float = "1.1"
atomic_refcell = "0.1"
bitflags = "2.11"
raw-window-handle = "0.5"
realfft = "3.0"
