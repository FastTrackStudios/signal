# Release binaries — attach downloadable platform builds to a GitHub Release.
#
# Fires when `release.yml` (cargo-rail finalize) publishes a release. Each job
# builds one platform artifact and uploads it to that release. iOS/watchOS are
# NOT here — those push to TestFlight/App Store via ios.yml, not GitHub assets.
#
#   linux-desktop  .AppImage           self-hosted nix-host (THEBATTLESHIP)
#   linux-plugins  fts-plugins-*.tar.gz self-hosted nix-host (THEBATTLESHIP)
#   patchbay-linux .deb                self-hosted nix-host (THEBATTLESHIP)
#   macos-desktop        notarized .dmg (arm64)   self-hosted airlock (TODO)
#   macos-desktop-x86_64 notarized .dmg (Intel, cross-compiled)  self-hosted airlock
#   macos-plugins        notarized (unstapled), universal fts-plugins-*.zip  self-hosted airlock
#   docker         self-host image     self-hosted nix-host         (TODO)
#
# workflow_dispatch takes a tag so a release can be (re)built by hand.

name: release-binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (e.g. v0.1.0)"
        required: true

concurrency:
  group: release-binaries-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  # Local mirror on THEBATTLESHIP (same as deploy.yml) — github egress here is
  # unreliable, so clone local-first and fall back to the forge.
  FTS_LOCAL_REPO: /run/media/Development/FastTrackStudio

jobs:
  linux-desktop:
    runs-on: [self-hosted, nix-host]
    steps:
      - name: Checkout the release tag (local-first)
        run: |
          set -eu
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          [ -n "$FTS_LOCAL_REPO" ] && {
            git config --global --add safe.directory "$FTS_LOCAL_REPO" 2>/dev/null || true
            git config --global --add safe.directory "$FTS_LOCAL_REPO/.git" 2>/dev/null || true
          }
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
          git clone --quiet "$FTS_LOCAL_REPO" . || git clone "$url" .
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            attempt=1
            until git fetch --no-tags "$url" "refs/tags/$tag:refs/tags/$tag"; do
              [ "$attempt" -ge 6 ] && { echo "fetch tag $tag failed"; exit 1; }
              attempt=$((attempt + 1)); sleep 15
            done
          fi
          git checkout --quiet "tags/$tag"
          echo "building $(git rev-parse --short HEAD) for tag $tag"

      - name: Bundle Linux .deb
        run: |
          set -euo pipefail
          # The desktop app embeds the web view and serves it on the LAN
          # (feature embed-web), so stage the web bundle first, then bundle the
          # desktop app with embed-web. .deb (dpkg) needs no external tooling —
          # unlike AppImage, whose linuxdeploy dx can't locate.
          nix develop --accept-flake-config . -c bash -c '
            set -euo pipefail
            just web-stage
            cd apps/fasttrackstudio
            dx bundle --platform linux --package-types deb --release --features embed-web
          '
          out="$(find target/dx/fasttrackstudio -name '*.deb' | head -1)"
          [ -n "$out" ] || { echo "no .deb produced"; exit 1; }
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          dest="FastTrackStudio-${tag}-linux-amd64.deb"
          cp "$out" "$dest"
          echo "artifact=$dest" >> "$GITHUB_ENV"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          nix run nixpkgs#gh -- release upload "$tag" "$artifact" --clobber
          echo "uploaded $artifact to $tag"

  linux-plugins:
    # The FTS plugin bundle (11 CLAP+VST3 plugins, issue #31): built with the
    # same nix devshell, packaged by `just plugins-package`, attached as
    # fts-plugins-v<version>-x86_64-linux.tar.gz.
    runs-on: [self-hosted, nix-host]
    steps:
      - name: Checkout the release tag (local-first)
        run: |
          set -eu
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          [ -n "$FTS_LOCAL_REPO" ] && {
            git config --global --add safe.directory "$FTS_LOCAL_REPO" 2>/dev/null || true
            git config --global --add safe.directory "$FTS_LOCAL_REPO/.git" 2>/dev/null || true
          }
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
          git clone --quiet "$FTS_LOCAL_REPO" . || git clone "$url" .
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            attempt=1
            until git fetch --no-tags "$url" "refs/tags/$tag:refs/tags/$tag"; do
              [ "$attempt" -ge 6 ] && { echo "fetch tag $tag failed"; exit 1; }
              attempt=$((attempt + 1)); sleep 15
            done
          fi
          git checkout --quiet "tags/$tag"
          echo "building $(git rev-parse --short HEAD) for tag $tag"

      - name: Build + package the plugin bundle
        run: |
          set -euo pipefail
          nix develop --accept-flake-config . -c just plugins-package
          artifact="$(find dist -name 'fts-plugins-*.tar.gz' | head -1)"
          [ -n "$artifact" ] || { echo "no plugin tarball produced"; exit 1; }
          echo "artifact=$artifact" >> "$GITHUB_ENV"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          nix run nixpkgs#gh -- release upload "$tag" "$artifact" --clobber
          echo "uploaded $artifact to $tag"

  patchbay-linux:
    # fts-patchbay: the PipeWire studio-routing app. Linux-only, embeds
    # its browser remote (feature embed-web → served on :4046). Same
    # self-hosted nix-host + local-mirror checkout as linux-desktop.
    runs-on: [self-hosted, nix-host]
    steps:
      - name: Checkout the release tag (local-first)
        run: |
          set -eu
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          [ -n "$FTS_LOCAL_REPO" ] && {
            git config --global --add safe.directory "$FTS_LOCAL_REPO" 2>/dev/null || true
            git config --global --add safe.directory "$FTS_LOCAL_REPO/.git" 2>/dev/null || true
          }
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
          git clone --quiet "$FTS_LOCAL_REPO" . || git clone "$url" .
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            attempt=1
            until git fetch --no-tags "$url" "refs/tags/$tag:refs/tags/$tag"; do
              [ "$attempt" -ge 6 ] && { echo "fetch tag $tag failed"; exit 1; }
              attempt=$((attempt + 1)); sleep 15
            done
          fi
          git checkout --quiet "tags/$tag"
          echo "building patchbay $(git rev-parse --short HEAD) for tag $tag"

      - name: Bundle Linux .deb
        run: |
          set -euo pipefail
          # Stage the browser remote (dx web build → web-dist/), then bundle
          # the desktop app with embed-web so the ONE binary also serves the
          # web UI on the LAN. .deb needs no external tooling.
          nix develop --accept-flake-config . -c bash -c '
            set -euo pipefail
            just patchbay-web-stage
            cd apps/patchbay
            dx bundle --platform linux --package-types deb --release --features embed-web
          '
          out="$(find target/dx/fts-patchbay -name '*.deb' | head -1)"
          [ -n "$out" ] || { echo "no .deb produced"; exit 1; }
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          dest="FTS-Patchbay-${tag}-linux-amd64.deb"
          cp "$out" "$dest"
          echo "artifact=$dest" >> "$GITHUB_ENV"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          nix run nixpkgs#gh -- release upload "$tag" "$artifact" --clobber
          echo "uploaded $artifact to $tag"

  macos-desktop:
    # Self-hosted Mac (airlock) — the only machine that can Developer-ID-sign
    # and notarize. Its build keychain + ASC key + Developer ID cert are
    # provisioned locally; see deploy-macos.sh. airlock reaches GitHub, so a
    # plain checkout works (no local mirror like the nix-host). Native build
    # (airlock's own arch, Apple Silicon) — see macos-desktop-x86_64 for the
    # cross-compiled Intel build.
    runs-on: [self-hosted, macos, airlock]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          clean: false
      - name: Build, sign, notarize, staple .dmg
        env:
          KEYCHAIN: fts-build.keychain
          KEYCHAIN_PW: fts-build
          ACTOOL_DEVELOPER_DIR: /Applications/Xcode-beta.app/Contents/Developer
          # embed-web works now (the wasm CC on darwin is DYLD-clean); the app
          # serves its web view on the LAN.
          EMBED_WEB: "1"
        run: |
          set -euo pipefail
          export PATH="/nix/var/nix/profiles/default/bin:$PATH"
          export NIX=/nix/var/nix/profiles/default/bin/nix
          # Version from the tag (strip a leading v): 0.1.0 from v0.1.0.
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          export MARKETING_VER="${tag#v}"
          bash apps/fasttrackstudio/ios/deploy-macos.sh
          echo "artifact=$(ls -t target/FastTrackStudio-*-aarch64-macos.dmg | head -1)" >> "$GITHUB_ENV"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          nix run nixpkgs#gh -- release upload "$tag" "$artifact" --clobber
          echo "uploaded $artifact to $tag"

  macos-desktop-x86_64:
    # Same airlock Mac, cross-compiled for Intel (TARGET=x86_64-apple-darwin
    # — airlock is Apple Silicon and has no real Intel hardware; the
    # x86_64-apple-darwin rustc target + Apple's SDK/linker support this
    # without one, see nix/modules/toolchain.nix). Ships as a SEPARATE dmg,
    # not a universal binary — fts-installer picks the matching one via
    # platform_suffix() at install time.
    runs-on: [self-hosted, macos, airlock]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          clean: false
      - name: Build, sign, notarize, staple .dmg (x86_64)
        env:
          KEYCHAIN: fts-build.keychain
          KEYCHAIN_PW: fts-build
          ACTOOL_DEVELOPER_DIR: /Applications/Xcode-beta.app/Contents/Developer
          EMBED_WEB: "1"
          TARGET: x86_64-apple-darwin
        run: |
          set -euo pipefail
          export PATH="/nix/var/nix/profiles/default/bin:$PATH"
          export NIX=/nix/var/nix/profiles/default/bin/nix
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          export MARKETING_VER="${tag#v}"
          bash apps/fasttrackstudio/ios/deploy-macos.sh
          echo "artifact=$(ls -t target/FastTrackStudio-*-x86_64-macos.dmg | head -1)" >> "$GITHUB_ENV"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          nix run nixpkgs#gh -- release upload "$tag" "$artifact" --clobber
          echo "uploaded $artifact to $tag"

  macos-plugins:
    # Same airlock Mac as macos-desktop, same Developer-ID cert. Unlike the
    # app, this is ONE universal (lipo'd, both arches) build — nice-plug-
    # xtask's bundle-universal — not two separate jobs. The FTS plugin
    # bundle (CLAP+VST3, no AU yet) isn't an .app/.pkg/.dmg, so it's signed
    # + notarized but NOT stapled (deploy-macos-plugins.sh).
    runs-on: [self-hosted, macos, airlock]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          clean: false
      - name: Build, sign, notarize plugin bundle
        env:
          KEYCHAIN: fts-build.keychain
          KEYCHAIN_PW: fts-build
        run: |
          set -euo pipefail
          export PATH="/nix/var/nix/profiles/default/bin:$PATH"
          export NIX=/nix/var/nix/profiles/default/bin/nix
          bash apps/fasttrackstudio/ios/deploy-macos-plugins.sh
          echo "artifact=$(ls -t target/fts-plugins-*-macos.zip | head -1)" >> "$GITHUB_ENV"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          nix run nixpkgs#gh -- release upload "$tag" "$artifact" --clobber
          echo "uploaded $artifact to $tag"
