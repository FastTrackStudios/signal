# REAPER integration suites — INTENTIONALLY TRIGGERED ONLY, never on
# push/PR. This is the one workflow that MUST run self-hosted: REAPER's
# license does not permit redistribution, so the suites only run where
# REAPER is licensed (THEBATTLESHIP).
#
# PREREQUISITE: a self-hosted GitHub Actions runner registered on
# THEBATTLESHIP with labels [self-hosted, nix-host] (NixOS:
# services.github-runners in ~/.flake hosts/THEBATTLESHIP). Until it
# exists, dispatched runs queue and time out — do not tag releases
# expecting this to pass before the runner lands.
#
# Triggers:
#   workflow_dispatch — run a full pass whenever you want.
#   push tags v* / rc-* — release candidates and releases always get
#     the full REAPER pass before anything ships.
#
# The job resolves the same REAPER 7.75 store path the dev machine's
# rig uses (pinned via gcroot; nixpkgs fallback) and runs both
# harnesses fully isolated: daw-reaper builds its own rig under
# <checkout>/target/fts-reaper-test, fts-extensions gets a CI-owned
# resources dir. Nothing touches ~/.config/signal or port 4040
# (different user, Dummy audio, unix sockets only).

name: reaper-integration

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "rc-*"

concurrency:
  group: reaper-${{ github.ref }}
  cancel-in-progress: false

env:
  FTS_CI: /var/lib/github-runner/fts-ci
  CARGO_TARGET_DIR: /var/lib/github-runner/fts-ci/target-reaper
  CARGO_HOME: /var/lib/github-runner/fts-ci/cargo-home

jobs:
  reaper-integration:
    runs-on: [self-hosted, nix-host]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Prepare persistent caches
        run: |
          mkdir -p "$CARGO_TARGET_DIR" "$CARGO_HOME"
          nix develop .#reaper-test --profile "$FTS_CI/devshell-reaper" -c true

      # Resolve REAPER. Preferred: the exact 7.75 store path the dev
      # machine's rig uses (built from FastTrackStudios/reaper-flake) —
      # pinned with an indirect gcroot so GC can't take it. Fallback:
      # nixpkgs reaper from the repo flake's pin (7.67; version drift
      # possible — the daw-reaper skip list is tuned against 7.75).
      - name: Resolve REAPER
        run: |
          mkdir -p "$FTS_CI"
          PIN=/nix/store/ky0r08mnqbhrs1r6prvkfv4lv41yyhz8-reaper-7.75
          if [ -x "$PIN/bin/reaper" ]; then
            nix-store --add-root "$FTS_CI/reaper" --indirect -r "$PIN" > /dev/null
          else
            echo "pinned REAPER 7.75 missing — building nixpkgs reaper (flake pin)"
            NIXPKGS_ALLOW_UNFREE=1 nix build --impure --inputs-from . \
              nixpkgs#reaper -o "$FTS_CI/reaper"
          fi
          echo "REAPER: $(readlink -f "$FTS_CI/reaper")"

      # daw domain suite (95 tests): builds its own isolated rig under
      # <checkout>/target/fts-reaper-test — fresh every run, never the
      # dev rig, never ~/.config/signal.
      - name: daw suite (daw-reaper)
        run: |
          FTS_REAPER_EXECUTABLE="$FTS_CI/reaper/bin/reaper" \
            nix develop .#reaper-test -c cargo run -p daw-reaper-xtask

      # Extension suite (13 tests): CI-owned REAPER resources dir
      # (persistent — keeps the [nag] prewarm token between runs),
      # seeded with the same Dummy-audio ini the daw harness uses.
      - name: extension suite (fts-extensions)
        run: |
          RIG="$FTS_CI/reaper-rig"
          mkdir -p "$RIG/UserPlugins"
          if [ ! -f "$RIG/reaper.ini" ]; then
            printf '[REAPER]\naudiodriver=2\nlinux_audio_mode=2\nautosaveint=0\n[reaper_explorer]\nlastdir=/tmp\n' \
              > "$RIG/reaper.ini"
          fi
          FTS_REAPER_EXECUTABLE="$FTS_CI/reaper/bin/reaper" \
          FTS_REAPER_RESOURCES="$RIG" \
            nix develop .#reaper-test -c cargo run -p fts-extensions-xtask
