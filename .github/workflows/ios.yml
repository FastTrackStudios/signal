# iOS TestFlight — build the FastTrackStudio iPhone app and upload it to
# TestFlight on every push to main that touches the app or its dependencies.
#
# Runs on a SELF-HOSTED macOS runner labeled `airlock` (a headless Mac mini).
# Register it once: repo → Settings → Actions → Runners → New self-hosted
# runner (macOS), labels `macos,airlock`, and run it as the `rat` user so it
# inherits that account's provisioned state:
#   - ~/.appstoreconnect  (App Store Connect API key + config.env + dist cert)
#   - fts-build.keychain  (headless codesigning identity; see setup-keychain.sh)
#   - the nix store with the FTS dev shell warmed
# so no GitHub secrets are needed — the box holds its own credentials.
#
# CHANGE-GATED by the push `paths:` filter below (only app-feeding files
# trigger a build). Serialized so the single Mac never runs two builds at
# once. workflow_dispatch forces a build regardless of what changed.
#
# The build number is stamped from unix time (climbs every run); the marketing
# version is MARKETING_VER. Uploaded builds appear in TestFlight after Apple
# processing (~5-15 min); internal testers get them with no review.

name: ios

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "features/**"
      - "crates/**"
      - "libs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      # A sibling moved (daw, processor, blitz, frame — the faces ship in
      # the app).
      - ".github/siblings"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "CFBundleShortVersionString (e.g. 0.0.2)"
        required: false
        default: "0.0.1"

# One TestFlight build at a time on the single Mac; queue, never cancel.
concurrency:
  # Per-WORKFLOW, not shared across the three Apple workflows.
  #
  # They used to share one `ios-testflight` group, intending to stop the
  # single Mac running two Apple builds at once. The effect was the
  # opposite of the intent: a concurrency group holds only ONE pending
  # run, so task-ios and task-macos evicted each other — every merge
  # fires both, the later arrival takes the pending slot, and the other
  # is CANCELLED. task-ios lost that race every time, which is why
  # TestFlight went stale while every run showed "cancelled".
  #
  # The serialization they wanted is already guaranteed: airlock is a
  # SINGLE self-hosted runner and runs one job at a time, so two Apple
  # builds cannot overlap regardless. The shared group added nothing
  # except mutual cancellation.
  #
  # Keeping the group per-workflow preserves the useful half — a newer
  # run of the SAME workflow supersedes an older queued one.
  group: ios-testflight-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: [self-hosted, macos, airlock]
    # Fail loudly when the airlock Mac isn't there. Without this a job
    # with no available runner just QUEUES, and is eventually cancelled —
    # which reads as "cancelled", not "failed", so nothing alerts and
    # nobody looks. That is exactly how TestFlight silently missed every
    # merge from 2026-08-09 onward while the runner was offline: four
    # cancelled runs in a row, discovered only by picking up the phone.
    # A timeout turns a missing runner into a red X within the hour.
    timeout-minutes: 90
    steps:
      # clean:false keeps target/ between runs so nix+cargo build incrementally
      # (a fresh checkout each time would recompile the whole tree).
      - name: Preflight — build volume mounted
        run: |
          if [ ! -d /Volumes/build-disk ]; then
            echo "ERROR: /Volumes/build-disk is not mounted on this runner." >&2
            exit 1
          fi
          df -h /Volumes/build-disk | tail -1

      - uses: actions/checkout@v4
        with:
          clean: false

      # The sibling repos the workspace builds from (`../<dir>`: daw,
      # processor, blitz, frame, …), each at the commit .github/siblings
      # pins — the same ones a dev tree builds against.
      - name: Sibling checkouts
        run: scripts/ci-siblings.sh

      - name: Build, sign, and upload to TestFlight
        env:
          KEYCHAIN: fts-build.keychain
          KEYCHAIN_PW: fts-build
          MARKETING_VER: ${{ inputs.marketing_version || '0.0.1' }}
          # The release Xcode xcode-select points at (27, on macOS 27) builds,
          # compiles the icon catalog, signs and uploads: App Store Connect
          # refuses a beta SDK (90534), and actool must match the macOS.
          # ── Telemetry ────────────────────────────────────────────────
          # Baked at build time via option_env! in architect-telemetry: a
          # shipped app has nobody to set env vars for it, and the exporter
          # is built at process start -- before sign-in -- so a session
          # token cannot be the credential. Both empty => the app is
          # telemetry-free, which is the local-first default.
          TASK_OTLP_ENDPOINT: ${{ vars.TASK_OTLP_ENDPOINT }}
          TASK_OTLP_TOKEN: ${{ secrets.TASK_OTLP_TOKEN }}
          TASK_SENTRY_DSN: ${{ secrets.TASK_SENTRY_DSN }}
          # ── Signal product identity ──────────────────────────────────
          # The app crate (apps/desktop) — the Mac's Blitz app, which lays
          # the rig out for a phone — with the guitar and keys rigs.
          DX_PACKAGE: signal-desktop
          DX_APP_DIR: apps/desktop
          DX_FEATURES: --no-default-features --features signal-guitar,signal-keys-rig
          # Bundle id must match apps/desktop/Dioxus.toml.
          DX_BUNDLE_ID: app.fasttrackstudio.signal
          # Home-screen name. Without this the device shows the dx-derived
          # bundle name — `signal-desktop`, the crate name — rather than the
          # product name.
          APP_DISPLAY_NAME: Signal
          # Own profile, or each product's build revokes the last one's.
          PROFILE_NAME: FTS Signal App Store
          ICONS_DIR: ${{ github.workspace }}/apps/desktop/ios/Assets.xcassets
        run: |
          set -euo pipefail
          export PATH="/nix/var/nix/profiles/default/bin:$PATH"
          export NIX=/nix/var/nix/profiles/default/bin/nix
          bash apps/desktop/ios/deploy-testflight.sh

      - name: Summary
        if: always()
        run: |
          echo "### iOS TestFlight" >> "$GITHUB_STEP_SUMMARY"
          echo "commit \`$(git rev-parse --short HEAD)\` → build uploaded (see log for build number)." >> "$GITHUB_STEP_SUMMARY"
