name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Checkout sibling repos
        run: |
          cd ..
          for repo in daw input_actions keyflow monarchy dock-dioxus dynamic-template; do
            gh repo clone FastTrackStudios/$repo -- --depth 1
          done
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Clippy
        run: nix develop --command cargo clippy --workspace -- -D warnings

      - name: Format
        run: nix develop --command cargo fmt --all -- --check

      - name: Tests
        run: nix develop --command cargo nextest run --workspace
