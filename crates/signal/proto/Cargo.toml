[package]
name = "signal-proto"
version.workspace = true
edition = "2021"          # kept on 2021 — pre-move signal workspace edition; migrate deliberately
license.workspace = true
authors.workspace = true

[dependencies]
architect.workspace = true
signal-macromod.workspace = true
utils.workspace = true
serde.workspace = true
facet.workspace = true
vox.workspace = true
thiserror.workspace = true
uuid.workspace = true

# Browser builds: uuid needs a randomness source, and `getrandom`
# needs to be told it's on the web. Same pattern as keyflow and
# engraver-proto.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
serde_json.workspace = true
