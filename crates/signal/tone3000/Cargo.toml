[package]
name = "signal-tone3000"
version.workspace = true
edition = "2021"          # matches the sibling signal crates
license.workspace = true
authors.workspace = true
description = "TONE3000 tone library: OAuth session, model download into the NAM library"

[lints]
workspace = true

[dependencies]
# The wire client (OAuth2+PKCE, search, models, downloads). Upstream MIT.
tone3000.workspace = true
signal-nam.workspace = true
signal-tone3000-proto.workspace = true
architect = { workspace = true, features = ["platform"] }
# The model/image transfers: the wire client streams to an AsyncWrite but
# reports no progress, and artwork is not its concern at all.
reqwest = { workspace = true, features = ["stream"] }
futures-util = { workspace = true }
url = "2"
tokio = { workspace = true }
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
# A stubbed catalog on a loopback port: the conversation is the thing under
# test, and it cannot be tested without one.
wiremock = "0.6"
url = "2"
signal-nam.workspace = true
serde_json.workspace = true
