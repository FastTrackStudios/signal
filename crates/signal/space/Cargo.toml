[package]
name = "signal-space"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Asset similarity space — analyze audio assets into feature vectors, project to a 2D map, classify, and serve KNN similarity (spec: docs/spec/sample-space.md, #77)."

[lints]
workspace = true

[dependencies]
fts-sample = { workspace = true, features = ["load"] }
realfft = { workspace = true }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { workspace = true }
walkdir = { workspace = true }
# Barnes-Hut t-SNE (pure Rust) for the 2D projection.
bhtsne = "0.5"
architect = { workspace = true, features = ["vox", "rig"] }
signal-space-proto = { workspace = true }
