[package]
name = "fts-cli"
version.workspace = true
edition = "2024"
license.workspace = true
authors.workspace = true
description = "fts — the one FastTrackStudio CLI (daw, keyflow, engines, status)"

# One CLI over the whole stack:
#
#   fts daw <...>            the daw command tree (daw::cli, feature `daw`)
#   fts keyflow <...>        the kf command tree  (keyflow-cli, feature `keyflow`;
#                            alias: fts kf)
#   fts signal engine        spawn `fasttrackstudio --engine` (headless rig core)
#   fts session engine       in-process standalone session engine on ws://:3030/ws
#   fts template <...>       Dynamic Template classification, offline (feature
#                            `template`; alias: fts dynamic-template)
#   fts status               probe the known engine ports and report up/down
#
# The heavy domains are feature-gated (default = all) so a lean build is
# `--no-default-features` + just the engines/status plumbing.

[[bin]]
name = "fts"
path = "src/main.rs"

[features]
default = ["daw", "keyflow", "session", "pack", "template"]
# `fts signal pack <...>` — signalpack inspect/edit/build/transcode
# (signal_sampler::pack_cli's clap tree).
pack = ["dep:signal-sampler"]
# `fts daw <...>` — mounts daw::cli's clap tree.
daw = ["dep:daw", "daw/cli"]
# `fts keyflow <...>` / `fts kf <...>` — mounts keyflow-cli's clap tree.
keyflow = ["dep:keyflow-cli"]
# `fts session engine` — the in-process standalone session engine
# (daw-standalone + SetlistService) served over architect axum_ws.
session = [
    "dep:daw",
    "dep:daw-standalone",
    "dep:session",
    "dep:architect",
    "dep:axum",
    "dep:vox",
]
# `fts template <...>` — the Dynamic Template classifier with no DAW in
# the loop. Pulls `session` for the colour classifier (grouping and
# colour come from one monarchy_sort pass, so they cannot disagree).
template = [
    "dep:dynamic-template",
    "dep:session",
    "dep:serde",
    "dep:serde_json",
]

[dependencies]
clap = { workspace = true }
eyre = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Telemetry: Sentry + OTLP export, engaged only when
# OTEL_EXPORTER_OTLP_ENDPOINT is set (http/protobuf, :4318).
architect-telemetry = { workspace = true, features = ["otel"] }
engine-launcher = { workspace = true }

# fts daw / fts session engine
daw = { workspace = true, optional = true }

# fts keyflow
keyflow-cli = { workspace = true, optional = true }

# fts signal pack — signalpack inspection/mutation CLI
signal-sampler = { workspace = true, optional = true }

# fts session engine — the same standalone stack apps/fasttrackstudio's
# session_engine.rs builds, served over a WebSocket instead of in-app.
daw-standalone = { workspace = true, features = ["bootstrap", "audio"], optional = true }
session = { workspace = true, optional = true }
architect = { workspace = true, features = ["vox", "local", "server-axum"], optional = true }
axum = { workspace = true, optional = true }
vox = { workspace = true, optional = true }

# fts template — the classifier plus JSON output
dynamic-template = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }

[lints]
workspace = true
