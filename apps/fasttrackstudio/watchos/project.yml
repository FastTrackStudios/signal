# XcodeGen manifest for the watch remote. `xcodegen generate` → FTSWatch.xcodeproj.
name: FTSWatch
options:
  bundleIdPrefix: app.fasttrackstudio
  deploymentTarget:
    watchOS: "11.0"
  createIntermediateGroups: true

targets:
  FTSWatch:
    type: application
    platform: watchOS
    sources:
      - FTSWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fasttrackstudio.watch
        PRODUCT_NAME: FastTrackStudio
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        SWIFT_VERSION: "6.0"
        # App-icon catalog (FTSWatch/Assets.xcassets). Required — altool
        # rejects a watch app with no icon. watchOS icons must have no alpha.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Signing: Cody's personal team. For the direct devicectl push
        # (deploy-voyager.sh) xcodebuild mints a profile via
        # -allowProvisioningUpdates. For the embedded TestFlight companion
        # (deploy-testflight.sh) the app is built with CODE_SIGNING_ALLOWED=NO
        # and manually re-signed with the Apple Distribution cert + the
        # app.fasttrackstudio.watch App Store profile.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 28C2G63DA7
    info:
      path: FTSWatch/Info.plist
      properties:
        CFBundleDisplayName: FTS
        # Standalone watch app (no iOS companion required).
        WKApplication: true
        # Embedded companion (rides the iPhone app's TestFlight build so it
        # installs on the paired watch and auto-updates). Was WKWatchOnly.
        WKCompanionAppBundleIdentifier: app.fasttrackstudio
        # Local-network HTTP to the engine bridge.
        NSLocalNetworkUsageDescription: >-
          Connects to the FastTrackStudio engine on your local network to
          switch guitar-rig scenes.
        # BLE MIDI controller mode.
        NSBluetoothAlwaysUsageDescription: >-
          Sends MIDI to Bluetooth LE MIDI devices to switch scenes and
          control your rig.
        # Dev builds talk plain http:// to the engine (no TLS on :4040).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
