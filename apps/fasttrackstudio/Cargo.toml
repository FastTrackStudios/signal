[package]
name = "fasttrackstudio"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["FastTrackStudio"]

# THE app. One binary, feature-configured for how you're working:
#
#   --features signal    the live guitar rig (control surface, perform grid)
#   --features session   setlists, songs, charts + chords (keyflow), daw sync
#   --features full      both — combined live usage (default)
#
# Chart writing (keyflow), setlist creation, and daw integration are
# session-side; the rig is signal-side; the shell (navigation, palette,
# theming) is shared. The signal domain stays a headless engine reached
# over vox (this app is a remote, like the web remotes). The session
# domain is embedded IN-PROCESS: a daw-standalone backend (memory-link
# bootstrap) makes the setlist DATA the app can PLAY — transport over
# songs/sections without REAPER.

[features]
default = ["full"]
full = ["signal", "session"]
# signal also force-enables session-ui/desktop: signal-guitar-ui pulls
# session-ui (default-features off), which only compiles with its dioxus
# renderer feature on (dock-dioxus needs "web" for its prelude).
signal = ["dep:signal-guitar-proto", "dep:signal-guitar-ui", "dep:session-ui"]
session = [
    "dep:session-proto",
    "dep:session-ui",
    "dep:keyflow",
    "dep:session",
    "dep:session-guide",
    "dep:daw",
    "dep:daw-standalone",
    "dep:architect",
    "dep:vox",
    "dep:tokio",
    "dep:eyre",
]
# Spoken section-name cues via local Chatterbox TTS (session-guide/tts,
# ONNX Runtime). Even with this feature compiled in, models are NEVER
# downloaded implicitly at startup: TTS activates only when the env var
# FTS_TTS=1 is set AND a reference voice wav exists at
# ~/.config/fts/tts-voice.wav (Chatterbox is voice-cloning). Cues are
# pre-rendered at schedule-build time and cached in
# ~/.config/fts/tts-cache/ (cached cues keep loading even without this
# feature). Without the feature — or on any synthesis failure — section
# cues fall back to the canned/synthesized guide samples.
tts = ["session", "session-guide/tts"]

[dependencies]
dioxus = { version = "=0.7.9", features = ["desktop", "launch"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Signal domain (the rig)
signal-guitar-proto = { path = "../../features/rigs/guitar/proto", optional = true }
signal-guitar-ui = { path = "../../features/rigs/guitar/ui", optional = true }

# Session domain (setlists / charts / daw) — embedded in-process.
session = { path = "../../crates/session/session", optional = true }
session-proto = { path = "../../crates/session/proto", optional = true }
session-ui = { path = "../../crates/session/ui", default-features = false, features = ["desktop"], optional = true }
# Guide engine: click / count-in / section cues rendered into the audio
# output through daw-standalone's aux post-render hook.
session-guide = { path = "../../features/guide", optional = true }
keyflow = { path = "../../crates/keyflow/keyflow", optional = true }

# DAW domain — facade (daw::get / init_from_parts / LayerRouter) + the
# standalone backend that plays the setlist without REAPER. "audio" is
# required by daw-standalone's unconditional `sync` module (same
# workaround session's dev-deps carry) and drives real cpal output.
daw = { path = "../../crates/daw/daw", optional = true }
daw-standalone = { path = "../../features/standalone/daw-standalone", features = ["bootstrap", "audio"], optional = true }

# Service framework — same sources as the daw/session workspaces so the
# whole graph shares one architect + one vox.
architect = { git = "https://codeberg.org/FastTrackStudios/architect.git", branch = "main", features = ["vox", "local"], optional = true }
vox = { version = "0.10.0-rc.5", default-features = false, features = ["runtime"], optional = true }

tokio = { version = "1.48", features = ["rt-multi-thread", "sync", "time", "macros"], optional = true }
eyre = { version = "0.6", optional = true }

[workspace]
# Standalone workspace until phase 2 merges the domain workspaces.

# NOTE: the old daw.git patch block is gone — dynamic-template (the only
# dep that referenced the dead daw.git repo) is subtree-imported into the
# root workspace at features/dynamic-template/ and uses the in-tree daw.

# moire: FTS fork — tolerates broken frame-pointer chains on NixOS glibc.
# All moire crates must point to the same fork rev to avoid duplicate
# moire-runtime #[ctor] registrations that crash. Aligned with daw/session.
[patch."https://github.com/bearcove/moire"]
moire = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-macros-noop = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-runtime = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-tokio = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-trace-capture = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-trace-types = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-types = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-wasm = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-wire = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }

[patch.crates-io]
moire = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-macros-noop = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-runtime = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-tokio = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-trace-capture = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-trace-types = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-types = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-wasm = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-wire = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
