[package]
name = "reverb-plugin"
version.workspace = true
edition = "2021"          # matches the nice-plug plugin stack (signal-sampler-clap)
authors.workspace = true
license.workspace = true
description = "FTS Reverb — CLAP/VST3 reverb plugin (15 algorithms) over the reverb engine"

[lib]
# cdylib → the loadable CLAP/VST3 binary; lib → tests + a future standalone host.
crate-type = ["cdylib", "lib"]

[dependencies]
# Plugin framework. `nice_plug` must be a DIRECT dep: `#[derive(Params)]` and
# `nice_export_clap!`/`nice_export_vst3!` expand to absolute `::nice_plug::…`
# paths, so the crate has to be nameable here. `vst3` is on by default.
nice-plug.workspace = true

# The DSP facade (re-exports reverb-dsp). Never depend on reverb-dsp directly.
reverb.workspace = true

# The chain's lifecycle trait (`Processor`) + `AudioConfig` live here.
audiocore-dsp.workspace = true

# The Blitz/nice-plug editor: the seven families and their panels. `native`
# pulls nice-plug-dioxus.
reverb-ui = { workspace = true, features = ["native"] }
reverb-profiles.workspace = true
audiocore-core = { workspace = true }
