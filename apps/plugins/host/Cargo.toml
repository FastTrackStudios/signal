[package]
name = "fts-clap-host"
version.workspace = true
edition = "2021"
authors.workspace = true
license.workspace = true
description = "fts-clap-host — launch any CLAP plugin's embedded GUI in a window (the REAPER-parity way to iterate on FTS plugin editors)"

[[bin]]
name = "fts-clap-host"
path = "src/main.rs"

[dependencies]
# The clack-based CLAP host (bundle loading, embedded GUI, main-thread pump).
# `decode` papers over a daw-standalone feature-gating gap: `clap-host`
# alone fails to build (source.rs unconditionally uses the decoder).
daw-standalone = { workspace = true, features = ["clap-host", "audio"] }
# Parent window + event loop: baseview (core X11, like REAPER's parent) —
# winit selects XInput2 on its window, which starves the plugin's core-X11
# baseview child of input. rwh 0.6 matches clack's raw-window-handle_06.
baseview = "0.2.2"
raw-window-handle = "0.6"
eyre = { workspace = true }

# macOS only: baseview builds its NSWindow with Titled|Closable|Miniaturizable
# and no Resizable bit, so the host window cannot be dragged to a new size —
# see `make_window_resizable` in main.rs. Versions match baseview 0.2.2's own
# objc2 deps so the graph keeps one copy.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSResponder",
    "NSView",
    "NSWindow",
] }
