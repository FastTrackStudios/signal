[package]
name = "nam-plugin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "FTS NAM — CLAP/VST3 Neural Amp Modeler plugin over the neural-amp-modeler engine"

[lib]
# cdylib → the loadable CLAP/VST3 binary; lib → tests + a future standalone host.
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[dependencies]
# Plugin framework. `nice_plug` must be a DIRECT dep: `#[derive(Params)]` and
# `nice_export_clap!`/`nice_export_vst3!` expand to absolute `::nice_plug::…`
# paths, so the crate has to be nameable here. `vst3` is on by default.
nice-plug.workspace = true

# The Dioxus editor stack (nice-plug-dioxus + Blitz), re-exported through
# audiocore-core the way every other FTS plugin editor takes it.
audiocore-core = { workspace = true }
# The tone browser — the same component the app and the browser remote
# mount — and the engine half it drives.
signal-tone3000-ui.workspace = true
signal-tone3000.workspace = true
signal-tone3000-proto.workspace = true
# Where downloads land, and the config dir the session file sits in.
signal-nam.workspace = true
signal-sampler.workspace = true
# The in-process engine: a memory-link server for the editor's clients.
architect = { workspace = true, features = ["local", "vox"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing.workspace = true

# The NAM inference engine (load .nam files, run mono inference).
# NOTE: this is deliberately NOT `signal-nam` — that crate (features/nam) is
# the *library manager* (catalog, tags, chunk rewriting) with no DSP; the
# realtime model lives in libs/neural-amp-modeler.
neural-amp-modeler.workspace = true
