[package]
name = "signal-plugin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "FTS Signal as a CLAP/VST3: signal-core (rigs, DSP chains, the sampler) wrapped for any DAW, and Studio's hot-reloadable development copy"

[lib]
# cdylib → the loadable CLAP/VST3 binary; lib → tests + a future standalone host.
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[features]
# The development build: "Signal Dev" (com.fasttrackstudio.signal.dev), a
# plugin of its own beside a released FTS Signal.
dev = []

[dependencies]
# Plugin framework. `nice_plug` must be a DIRECT dep: `#[derive(Params)]` and
# `nice_export_clap!`/`nice_export_vst3!` expand to absolute `::nice_plug::…`
# paths, so the crate has to be nameable here. `vst3` is on by default.
nice-plug.workspace = true

# The one processor (signal#26): rigs, chains, the session.
signal-core = { workspace = true, features = ["std", "fx", "nam"] }
# The sampler engine, as the desktop `sampler` block.
sampler = { workspace = true }

# Rig config (.styx) parsing — same stack as signal-sampler-clap's PatchConfig
facet.workspace = true
facet-styx.workspace = true

# Observability (file logger — hosts eat stderr)
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

eyre.workspace = true
# The CLAP state stream's JSON (`plugin::clap_state`).
serde_json = { workspace = true }

[dev-dependencies]
# The headless host test (tests/clap_host.rs): load the bundled .clap
# through daw's plugin host, as Studio's engine does.
daw = { workspace = true, features = ["clap-host"] }
serde_json = { workspace = true }
# examples/render_kit.rs: the stems in, the mix out.
hound = { workspace = true }
