[package]
name = "eq-plugin"
version.workspace = true
authors.workspace = true
license.workspace = true
edition = "2021"          # kept on 2021 — pre-move signal workspace edition; migrate deliberately
description = "FTS EQ — CLAP/VST3 audio plugin entry point"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
audiocore-core = { workspace = true }
eq-dsp = { workspace = true }
eq-profiles = { workspace = true }
# The full Dioxus plugin editor (control view, EQ graph, spectrum) —
# `native` pulls nice-plug-dioxus/Blitz.
eq-ui = { workspace = true, features = ["native"] }
audiocore-dsp = { workspace = true }
nice-plug = { workspace = true }
spectrum-analyzer = { workspace = true }
