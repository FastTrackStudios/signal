  <rect x="8" y="8" width="240" height="240" rx="44" fill="none" stroke="#27272a" stroke-width="4"/>
  <text x="128" y="148" text-anchor="middle"
        font-family="Inter, 'Segoe UI', sans-serif" font-weight="800"
        font-size="84" letter-spacing="6" fill="#e4e4e7">FTS</text>
  <circle cx="128" cy="192" r="10" fill="#22c55e"/>
</svg>
