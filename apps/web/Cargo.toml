[package]
name = "signal-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "signal.fasttrackstudio.app — the Signal landing page, rig demos, and guide"

[dependencies]
# The router and the view layer. The workspace dep carries no platform
# features (`default-features = false, features = ["lib"]` at the root);
# this crate's `default = ["web"]` turns on `dioxus/web` + `dioxus/launch`.
# That is dioxus-flake's packages/web pattern, and what keyflow-web does —
# `dx serve` gets away without it by injecting the platform itself, but a
# sandboxed `dx build` resolves offline and falls back to a feature set
# that wants `dioxus-fullstack`, which the vendored dioxus source does not
# carry.
# `fullstack` is what makes the guide a static site: `dx build --ssg`
# needs a server target to render the routes and a `#[server]` function
# to ask for the list. The site is still deployed as static files — the
# server exists at build time, to produce them.
#
# `launch` is here rather than on the `web` feature because both halves
# of a fullstack build go through `LaunchBuilder`: the browser one to
# mount the app, the server one to start rendering. Tying it to `web`
# left the server build without it.
dioxus = { workspace = true, features = ["router", "fullstack", "launch"] }
# A direct dep only so `wasm-split` below can turn on its feature; the
# router itself is used through `dioxus::prelude`.
dioxus-router = { workspace = true }

# The guide, as a static site. `ssg` carries the page model this crate's
# build script codegens; `ssg-ui` renders it. Nothing here parses
# markdown at runtime any more — build.rs does it, once.
#
# No `graph` feature: Signal's guide is three notes with no
# cross-references, so there is no link graph to draw and no reason to
# pull the knowledge-graph crate's dependency chain in to not draw one.
ssg = { workspace = true }
ssg-ui = { workspace = true }

tracing = { workspace = true }

# Not called directly. web-sys features are ADDITIVE across the dependency
# graph and only a direct dependent can turn one on, so dioxus-web's own
# use of `Window::location` (its history/router backend) does not compile
# unless something in this crate enables `Location`. keyflow-web carries
# the same block for the same reason.
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "Location",
    "History",
    "Navigator",
    "Storage",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tracing-wasm = "0.2"
console_error_panic_hook = "0.1"

[build-dependencies]
# Reads docs/guides/signal and codegens the page table. The whole build
# script is one call to it.
ssg-build = { workspace = true }

[lints]
workspace = true

[features]
default = ["web"]
web = ["dioxus/web"]
# The server half of the fullstack build. dx turns this on itself for the
# server target — it looks for a feature named exactly `server` — and
# never for the wasm one, so the axum/tokio stack stays out of the
# bundle. It exists to run for the length of `dx build --ssg` and render
# the routes; nothing deploys it.
server = ["dioxus/server"]
# Bundle-split the wasm along route variants, so the landing page does not
# ship the guide and the rig pages before anyone asks for them. Requires
# building with `dx build --wasm-split`; the feature alone changes nothing.
# Same shape as task's apps/web.
wasm-split = ["dioxus-router/wasm-split"]
